<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium 3D Bubble Shooter</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/powerups.css">
    <link rel="stylesheet" href="css/developer-panel.css">
</head>
<body>
    <div id="developerPanel" class="developer-panel">
        <h2>Developer Panel</h2>

        <div class="dev-tool-group">
            <h3>Essential Tools</h3>
            <label for="loadLevelInput">Load Level by ID/Number:</label>
            <input type="text" id="loadLevelInput" name="loadLevelInput" placeholder="e.g., 1 or level_name">
            <button id="nextLevelBtn">Next Level</button>
            <button id="prevLevelBtn">Previous Level</button>
            <div class="checkbox-group">
                <input type="checkbox" id="godModeToggle" name="godModeToggle">
                <label for="godModeToggle">Toggle God Mode</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="showCoordsToggle" name="showCoordsToggle">
                <label for="showCoordsToggle">Show Bubble Coordinates</label>
            </div>
        </div>

        <div class="dev-tool-group">
            <h3>Destructive Power-ups</h3>
            <button class="bubble-select-btn" data-bubble-type="Bomb Bubble">Bomb Bubble</button>
            <button class="bubble-select-btn" data-bubble-type="Lightning Bubble">Lightning Bubble</button>
            <button class="bubble-select-btn" data-bubble-type="Fireball">Fireball</button>
            <button class="bubble-select-btn" data-bubble-type="Rainbow Bubble">Rainbow Bubble</button>
            <button class="bubble-select-btn" data-bubble-type="Laser Bubble">Laser Bubble</button>
            <button class="bubble-select-btn" data-bubble-type="Meteor Bubble">Meteor Bubble</button>
        </div>

        <div class="dev-tool-group">
            <h3>Utility Power-ups</h3>
            <button class="bubble-select-btn" data-bubble-type="Magnet Bubble">Magnet Bubble</button>
            <button class="bubble-select-btn" data-bubble-type="Time Freeze">Time Freeze</button>
            <button class="bubble-select-btn" data-bubble-type="Precision Aim">Precision Aim</button>
            <button class="bubble-select-btn" data-bubble-type="Color Change">Color Change</button>
            <button class="bubble-select-btn" data-bubble-type="Ghost Bubble">Ghost Bubble</button>
            <button class="bubble-select-btn" data-bubble-type="Multiplier Bubble">Multiplier Bubble</button>
        </div>

        <div class="dev-tool-group">
            <h3>Defensive Power-ups</h3>
            <button class="bubble-select-btn" data-bubble-type="Shield Bubble">Shield Bubble</button>
            <button class="bubble-select-btn" data-bubble-type="Anchor Bubble">Anchor Bubble</button>
            <button class="bubble-select-btn" data-bubble-type="Reinforcement">Reinforcement</button>
        </div>

        <div class="dev-tool-group">
            <h3>Obstacle Systems</h3>
            <button class="bubble-select-btn" data-bubble-type="Block Bubbles">Block Bubbles</button>
            <button class="bubble-select-btn" data-bubble-type="Spike Bubbles">Spike Bubbles</button>
            <button class="bubble-select-btn" data-bubble-type="Ice Bubbles">Ice Bubbles</button>
            <button class="bubble-select-btn" data-bubble-type="Chain Bubbles">Chain Bubbles</button>
            <button class="bubble-select-btn" data-bubble-type="Mimic Bubbles">Mimic Bubbles</button>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-container">
        <div class="ui-panel">
            <div class="score-display">
                <span class="score-label">Score</span>
                <span class="score-value" id="scoreValue">0</span>
            </div>
            <div class="score-display">
                <span class="score-label">Level</span>
                <span class="score-value" id="levelValue">1</span>
            </div>
        </div>
    </div>
    
    <div class="combo-display" id="comboDisplay">
        COMBO x<span id="comboValue">2</span>
    </div>
    
    <!-- Settings Icon -->
    <div class="settings-icon" id="settingsIcon">
        <svg viewBox="0 0 24 24">
            <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12A3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5a3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97c0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1c0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66Z"/>
        </svg>
    </div>
    
    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h3 class="settings-title">Settings</h3>
            <div class="settings-close" id="settingsClose">×</div>
        </div>
        <div class="settings-content">
            <div class="music-toggle">
                <span class="music-label">Music</span>
                <div class="toggle-button active" id="musicToggle"></div>
            </div>
            <div class="volume-control">
                <span class="music-label">Volume</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="30">
                <span class="volume-value" id="volumeValue">30%</span>
            </div>
        </div>
    </div>
    
    <!-- Game Overlay -->
    <div class="game-overlay" id="gameOverlay">
        <div class="pause-text">PAUSED</div>
    </div>
    
    <div class="power-meter" id="powerMeter">
        <div class="power-fill" id="powerFill"></div>
    </div>
    
    <div class="next-bubble" id="nextBubble">
        <span class="next-label">NEXT</span>
    </div>
    
    <div class="game-over" id="gameOver">
        <h2>GAME OVER</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p style="font-size: 18px; color: #fff; margin-bottom: 10px;">Level Reached: <span id="finalLevel">1</span></p>
        <p style="font-size: 18px; color: #fff; margin-bottom: 30px;">Best Combo: <span id="bestCombo">0</span></p>
        <button class="restart-btn" onclick="restartGame()">PLAY AGAIN</button>
    </div> 
    
    <!-- Precision Aim Indicator -->
    <div class="precision-indicator" id="precisionIndicator" style="display: none;">
        <div class="precision-timer">
            <svg width="60" height="60" viewBox="0 0 60 60">
                <circle cx="30" cy="30" r="25" fill="none" stroke="rgba(0,255,255,0.2)" stroke-width="3"/>
                <circle cx="30" cy="30" r="25" fill="none" stroke="#00ffff" stroke-width="3"
                        stroke-dasharray="157" stroke-dashoffset="0" 
                        transform="rotate(-90 30 30)" id="precisionTimerCircle"/>
            </svg>
            <span class="precision-time" id="precisionTime">10</span>
        </div>
        <span class="precision-label">PRECISION AIM</span>
    </div>
    
    <!-- Power-Up Indicator -->
    <div class="powerup-indicator" id="powerupIndicator" style="display: none;">
        <span class="powerup-label" id="powerupLabel">POWER-UP</span>
    </div>
    
    <!-- Import map for ES modules -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js"
        }
    }
    </script>
    
    <!-- Developer Panel Script -->
    <script type="module">
        // Developer Panel Logic
        const developerPanel = document.getElementById('developerPanel');
        const bubbleSelectButtons = document.querySelectorAll('.bubble-select-btn');

        // Toggle developer panel with 'd' key
        document.addEventListener('keydown', (event) => {
            if (event.key.toLowerCase() === 'd') {
                const activeElement = document.activeElement;
                if (activeElement && (activeElement.tagName.toLowerCase() === 'input' ||
                    activeElement.tagName.toLowerCase() === 'textarea')) {
                    return;
                }
                if (developerPanel) {
                    developerPanel.classList.toggle('visible');
                }
            }
        });

        // Placeholder for bubble select buttons
        if (bubbleSelectButtons.length > 0) {
            bubbleSelectButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const bubbleType = button.dataset.bubbleType;
                    if (bubbleType) {
                        console.log(`Developer Panel: Setting next bubble to: ${bubbleType}`);
                        alert(`Next bubble set to: ${bubbleType}`);
                    }
                });
            });
        }
        
        // Placeholders for other dev tools
        const loadLevelInput = document.getElementById('loadLevelInput');
        if (loadLevelInput) {
            loadLevelInput.addEventListener('change', (event) => {
                console.log(`Dev: Load level: ${event.target.value}`);
                alert(`Dev: Load level: ${event.target.value}`);
            });
        }

        const nextLevelBtn = document.getElementById('nextLevelBtn');
        if (nextLevelBtn) {
            nextLevelBtn.addEventListener('click', () => {
                console.log('Dev: Next Level');
                alert('Dev: Next Level');
            });
        }

        const prevLevelBtn = document.getElementById('prevLevelBtn');
        if (prevLevelBtn) {
            prevLevelBtn.addEventListener('click', () => {
                console.log('Dev: Previous Level');
                alert('Dev: Previous Level');
            });
        }
        
        const godModeToggle = document.getElementById('godModeToggle');
        if (godModeToggle) {
            godModeToggle.addEventListener('change', (event) => {
                console.log(`Dev: God Mode: ${event.target.checked}`);
                alert(`Dev: God Mode: ${event.target.checked}`);
            });
        }

        const showCoordsToggle = document.getElementById('showCoordsToggle');
        if (showCoordsToggle) {
            showCoordsToggle.addEventListener('change', (event) => {
                console.log(`Dev: Show Bubble Coords: ${event.target.checked}`);
                alert(`Dev: Show Bubble Coords: ${event.target.checked}`);
            });
        }
    </script>
    
    <!-- Main Game Module -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
