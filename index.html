<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium 3D Bubble Shooter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Orbitron', monospace;
            overflow: hidden;
            background: radial-gradient(ellipse at bottom, #001133 0%, #000011 40%, #000000 100%);
            color: #fff;
            user-select: none;
        }
        
        #gameCanvas {
            display: block;
            cursor: crosshair;
        }
        
        .ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
            z-index: 100;
        }
        
        .ui-panel {
            background: rgba(0, 20, 40, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 255, 255, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            pointer-events: auto;
        }
        
        .score-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .score-label {
            font-size: 14px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        
        .score-value {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        
        .combo-display {
            position: absolute;
            top: 120px;
            right: 20px;
            font-size: 24px;
            font-weight: 700;
            color: #ff6b35;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.8);
            opacity: 0;
            transition: all 0.3s ease;
        }
        
        .combo-display.active {
            opacity: 1;
            transform: scale(1.2);
        }
        
        /* Settings Icon */
        .settings-icon {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: rgba(0, 20, 40, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 255, 255, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }
        
        .settings-icon:hover {
            background: rgba(0, 30, 60, 0.8);
            border-color: rgba(0, 255, 255, 0.5);
            box-shadow: 0 6px 24px rgba(0, 255, 255, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        
        .settings-icon svg {
            width: 24px;
            height: 24px;
            fill: #00ffff;
            filter: drop-shadow(0 0 4px rgba(0, 255, 255, 0.5));
        }
        
        /* Settings Panel */
        .settings-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 20, 40, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 255, 255, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 2000;
            min-width: 300px;
            display: none;
        }
        
        .settings-panel.active {
            display: block;
            animation: settingsFadeIn 0.3s ease;
        }
        
        @keyframes settingsFadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .settings-title {
            font-size: 24px;
            font-weight: 700;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        
        .settings-close {
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 20px;
            color: #fff;
        }
        
        .settings-close:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }
        
        .settings-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        /* Game Overlay for Pause */
        .game-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1500;
            display: none;
            pointer-events: auto;
        }
        
        .game-overlay.active {
            display: block;
        }
        
        .pause-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 900;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
            opacity: 0.5;
            pointer-events: none;
        }
        .music-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .music-label {
            font-size: 12px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        
        .toggle-button {
            width: 50px;
            height: 25px;
            background: rgba(0, 255, 255, 0.2);
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 25px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .toggle-button.active {
            background: rgba(0, 255, 255, 0.5);
        }
        
        .toggle-button::after {
            content: '';
            position: absolute;
            width: 21px;
            height: 21px;
            background: #00ffff;
            border-radius: 50%;
            top: 1px;
            left: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
        
        .toggle-button.active::after {
            left: 27px;
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .volume-slider {
            flex: 1;
            height: 6px;
            background: rgba(0, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #00ffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
        
        .volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #00ffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            border: none;
        }
        
        .volume-value {
            font-size: 12px;
            color: #00ffff;
            min-width: 35px;
            text-align: right;
        }
        
        .power-meter {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 20px;
            background: rgba(0, 20, 40, 0.7);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .power-meter.active {
            opacity: 1;
        }
        
        .power-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffff 0%, #ff6b35 100%);
            width: 0%;
            transition: width 0.1s ease;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.8);
        }
        
        .next-bubble {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: rgba(0, 20, 40, 0.7);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 255, 255, 0.3),
                        inset 0 0 20px rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            overflow: hidden;
        }
        
        .next-bubble::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            animation: rotate 3s linear infinite;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .next-label {
            position: absolute;
            top: -25px;
            font-size: 12px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            animation: fadeIn 0.5s ease;
            z-index: 200;
        }
        
        .game-over h2 {
            font-size: 48px;
            font-weight: 900;
            color: #ff6b35;
            text-shadow: 0 0 30px rgba(255, 107, 53, 0.8);
            margin-bottom: 20px;
        }
        
        .game-over p {
            font-size: 24px;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            margin-bottom: 30px;
        }
        
        .restart-btn {
            background: linear-gradient(135deg, #00ffff 0%, #ff6b35 100%);
            border: none;
            border-radius: 30px;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 8px 32px rgba(0, 255, 255, 0.4);
            transition: all 0.3s ease;
            font-family: 'Orbitron', monospace;
        }
        
        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(255, 107, 53, 0.6);
        }
        
        .floating-score {
            position: absolute;
            font-size: 24px;
            font-weight: 900;
            color: #ffff00;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.8);
            pointer-events: none;
            animation: floatUp 1.5s ease-out forwards;
            z-index: 150;
        }
        
        @keyframes floatUp {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-100px);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -60%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes bubbleBounce {
            0% { transform: scale(0.8) translateY(10px); }
            50% { transform: scale(1.1) translateY(-5px); }
            100% { transform: scale(1) translateY(0); }
        }
        
        /* Lightning Selector UI */
        .lightning-selector {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 20, 40, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid #00aaff;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 0 50px rgba(0, 170, 255, 0.5),
                        inset 0 0 20px rgba(0, 170, 255, 0.2);
            animation: lightningPulse 2s ease-in-out infinite;
        }
        
        .lightning-selector h3 {
            color: #00ddff;
            font-size: 24px;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(0, 221, 255, 0.8);
            letter-spacing: 3px;
        }
        
        .lightning-selector p {
            color: #fff;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .lightning-options {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .lightning-btn {
            background: linear-gradient(135deg, #0066cc, #00aaff);
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 170, 255, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .lightning-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 170, 255, 0.6);
            background: linear-gradient(135deg, #0077dd, #00bbff);
        }
        
        .lightning-btn::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, transparent, #00ddff, transparent);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .lightning-btn:hover::before {
            opacity: 1;
            animation: lightningBorder 1.5s linear infinite;
        }
        
        .lightning-cancel {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .lightning-cancel:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        @keyframes lightningPulse {
            0%, 100% { 
                box-shadow: 0 0 50px rgba(0, 170, 255, 0.5),
                           inset 0 0 20px rgba(0, 170, 255, 0.2);
            }
            50% { 
                box-shadow: 0 0 80px rgba(0, 170, 255, 0.8),
                           inset 0 0 30px rgba(0, 170, 255, 0.4);
            }
        }
        
        @keyframes lightningBorder {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        /* Precision Aim Indicator */
        .precision-indicator {
            position: absolute;
            bottom: 150px;
            right: 30px;
            background: rgba(0, 20, 40, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            animation: precisionGlow 2s ease-in-out infinite;
        }
        
        .precision-timer {
            position: relative;
            width: 60px;
            height: 60px;
        }
        
        .precision-time {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            font-weight: 700;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
        
        .precision-label {
            color: #00ffff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        
        @keyframes precisionGlow {
            0%, 100% { 
                box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
                border-color: #00ffff;
            }
            50% { 
                box-shadow: 0 0 50px rgba(0, 255, 255, 0.8);
                border-color: #66ffff;
            }
        }
        
        /* Power-Up Indicator */
        .powerup-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 20, 40, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #fff;
            border-radius: 30px;
            padding: 10px 30px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            animation: powerupPulse 2s ease-in-out infinite;
        }
        
        .powerup-label {
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }
        
        @keyframes powerupPulse {
            0%, 100% { 
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            }
            50% { 
                transform: translateX(-50%) scale(1.05);
                box-shadow: 0 0 50px rgba(255, 255, 255, 0.5);
            }
        }
        
        /* Lightning selection highlights */
        .lightning-highlight-row,
        .lightning-highlight-column {
            position: absolute;
            pointer-events: none;
            background: rgba(0, 170, 255, 0.3);
            border: 2px solid #00ddff;
            transition: all 0.3s ease;
            z-index: 500;
/* Power-up Text Display */
        .powerup-text-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            pointer-events: none;
            z-index: 300;
            opacity: 0;
            animation: powerupTextAnimation 2s ease-out forwards;
        }
        
        @keyframes powerupTextAnimation {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            20% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
            40% {
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -70%) scale(0.8);
            }
        }
        
        .powerup-text-rainbow {
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
        }
        
        .powerup-text-bomb {
            color: #ff0000;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.8),
                        0 0 50px rgba(255, 100, 0, 0.6);
        }
        
        .powerup-text-lightning {
            color: #00ddff;
            text-shadow: 0 0 30px rgba(0, 221, 255, 0.8),
                        0 0 50px rgba(0, 170, 255, 0.6);
        }
        
        .powerup-text-precision {
            color: #00ffff;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.8),
                        0 0 50px rgba(0, 255, 255, 0.6);
        }
        
        .powerup-text-colorsplash {
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 0, 255, 0.8);
        }
        
        /* Game Effect Text Display */
        .effect-text-display {
            position: absolute;
            top: 30%;
            right: 50px;
            font-size: 28px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 250;
            opacity: 0;
            animation: effectTextAnimation 1.5s ease-out forwards;
        }
        
        @keyframes effectTextAnimation {
            0% {
                opacity: 0;
                transform: translateX(50px);
            }
            20% {
                opacity: 1;
                transform: translateX(0);
            }
            80% {
                opacity: 1;
                transform: translateX(0);
            }
            100% {
                opacity: 0;
                transform: translateX(-50px);
            }
        }
        
        .effect-text-combo {
            color: #ff6b35;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.8);
        }
        
        .effect-text-megaclear {
            color: #ffff00;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.8);
        }
        
        .effect-text-victory {
            background: linear-gradient(135deg, #00ffff, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
        }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-container">
        <div class="ui-panel">
            <div class="score-display">
                <span class="score-label">Score</span>
                <span class="score-value" id="scoreValue">0</span>
            </div>
            <div class="score-display">
                <span class="score-label">Level</span>
                <span class="score-value" id="levelValue">1</span>
            </div>
        </div>
    </div>
    
    <div class="combo-display" id="comboDisplay">
        COMBO x<span id="comboValue">2</span>
    </div>
    
    <!-- Settings Icon -->
    <div class="settings-icon" id="settingsIcon">
        <svg viewBox="0 0 24 24">

    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script>
        // Audio System for managing game sounds
        class AudioSystem {
            constructor() {
                this.audioContext = null;
                this.sounds = {};
                this.ambientGain = null;
                this.effectsGain = null;
                this.ambientSource = null;
                this.ambientBuffer = null;
                this.isInitialized = false;
                this.ambientVolume = 0.3; // Base ambient volume
                this.targetAmbientVolume = 0.3;
                this.volumeTransitionSpeed = 0.02;
                this.musicTracks = [
                    'music/music_DeepTheme_Audio_Spring_Hazes_34.mp3',
                    'music/music_zapsplat_action_break.mp3',
                    'music/music_zapsplat_and_action_breakbeat.mp3',
                    'music/music_zapsplat_lets_rock.mp3'
                ];
                this.currentTrackIndex = -1;
                this.musicEnabled = true;
                this.musicVolume = 0.3;
            }
            
            async initialize() {
                if (this.isInitialized) return;
                
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    // Create gain nodes for volume control
                    this.effectsGain = this.audioContext.createGain();
                    this.effectsGain.gain.value = 0.7;
                    this.effectsGain.connect(this.audioContext.destination);
                    
                    this.ambientGain = this.audioContext.createGain();
                    this.ambientGain.gain.value = this.ambientVolume;
                    this.ambientGain.connect(this.audioContext.destination);
                    
                    // Load sound effects
                    await this.loadSounds();
                    
                    this.isInitialized = true;
                    console.log('Audio system initialized');
                } catch (error) {
                    console.error('Failed to initialize audio system:', error);
                }
            }
            
            async loadSounds() {
                // Define sound configurations
                const soundConfigs = {
                    'plink': {
                        frequency: 800,
                        duration: 0.1,
                        type: 'sine',
                        envelope: { attack: 0.01, decay: 0.09 }
                    },
                    'crunchy_pop': {
                        frequencies: [400, 600, 800, 1000],
                        duration: 0.3,
                        type: 'sawtooth',
                        envelope: { attack: 0.02, decay: 0.28 }
                    },
                    'ambient_hum': {
                        frequency: 110,
                        duration: 2,
                        type: 'sine',
                        loop: true
                    }
                };
                
                // Generate procedural sounds
                for (const [name, config] of Object.entries(soundConfigs)) {
                    this.sounds[name] = await this.generateSound(config);
                }
            }
            
            async generateSound(config) {
                const sampleRate = this.audioContext.sampleRate;
                const duration = config.duration;
                const length = sampleRate * duration;
                const buffer = this.audioContext.createBuffer(1, length, sampleRate);
                const data = buffer.getChannelData(0);
                
                if (config.frequencies) {
                    // Multi-frequency sound (crunchy)
                    for (let i = 0; i < length; i++) {
                        let sample = 0;
                        const t = i / sampleRate;
                        
                        config.frequencies.forEach(freq => {
                            sample += Math.sin(2 * Math.PI * freq * t) / config.frequencies.length;
                        });
                        
                        // Apply envelope
                        let envelope = 1;
                        if (config.envelope) {
                            if (t < config.envelope.attack) {
                                envelope = t / config.envelope.attack;
                            } else {
                                envelope = 1 - ((t - config.envelope.attack) / config.envelope.decay);
                            }
                        }
                        
                        // Add some noise for crunchiness
                        sample += (Math.random() - 0.5) * 0.1;
                        
                        data[i] = sample * envelope * 0.3;
                    }
                } else {
                    // Single frequency sound
                    for (let i = 0; i < length; i++) {
                        const t = i / sampleRate;
                        let sample;
                        
                        switch (config.type) {
                            case 'sine':
                                sample = Math.sin(2 * Math.PI * config.frequency * t);
                                break;
                            case 'square':
                                sample = Math.sign(Math.sin(2 * Math.PI * config.frequency * t));
                                break;
                            case 'sawtooth':
                                sample = 2 * ((config.frequency * t) % 1) - 1;
                                break;
                            default:
                                sample = Math.sin(2 * Math.PI * config.frequency * t);
                        }
                        
                        // Apply envelope
                        let envelope = 1;
                        if (config.envelope) {
                            if (t < config.envelope.attack) {
                                envelope = t / config.envelope.attack;
                            } else {
                                envelope = 1 - ((t - config.envelope.attack) / config.envelope.decay);
                            }
                        }
                        
                        data[i] = sample * envelope * 0.5;
                    }
                }
                
                return { buffer, config };
            }
            
            playSound(soundName, volume = 1.0) {
                if (!this.isInitialized || !this.sounds[soundName]) return;
                
                const sound = this.sounds[soundName];
                const source = this.audioContext.createBufferSource();
                source.buffer = sound.buffer;
                
                const gainNode = this.audioContext.createGain();
                gainNode.gain.value = volume;
                
                source.connect(gainNode);
                gainNode.connect(this.effectsGain);
                
                source.start();
            }
            
            async startAmbientAudio() {
                if (!this.isInitialized || this.ambientSource || !this.musicEnabled) return;
                
                // Play a random music track
                await this.playRandomMusicTrack();
            }
            
            async playRandomMusicTrack() {
                if (!this.musicEnabled) return;
                
                // Select a random track different from the current one
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * this.musicTracks.length);
                } while (newIndex === this.currentTrackIndex && this.musicTracks.length > 1);
                
                this.currentTrackIndex = newIndex;
                const trackUrl = this.musicTracks[this.currentTrackIndex];
                
                try {
                    // Fetch and decode the audio file
                    const response = await fetch(trackUrl);
                    if (!response.ok) {
                        throw new Error(`Failed to fetch audio: ${response.statusText}`);
                    }
                    
                    const arrayBuffer = await response.arrayBuffer();
                    const audioBuffer = await this.audioContext.decodeAudioData(arrayBuffer);
                    
                    // Create buffer source
                    const source = this.audioContext.createBufferSource();
                    source.buffer = audioBuffer;
                    source.loop = false; // Don't loop individual tracks
                    
                    // Connect to ambient gain for volume control
                    source.connect(this.ambientGain);
                    
                    // When track ends, play another random track
                    source.onended = () => {
                        this.ambientSource = null;
                        if (this.musicEnabled) {
                            this.playRandomMusicTrack();
                        }
                    };
                    
                    // Store reference and start playback
                    this.ambientSource = source;
                    source.start();
                    
                    console.log(`Playing music track: ${trackUrl}`);
                } catch (error) {
                    console.error('Failed to load music track:', error);
                    // Try another track after a delay
                    setTimeout(() => {
                        if (this.musicEnabled && !this.ambientSource) {
                            this.playRandomMusicTrack();
                        }
                    }, 1000);
                }
            }
            
            toggleMusic() {
                this.musicEnabled = !this.musicEnabled;
                
                if (!this.musicEnabled) {
                    this.stopAmbientAudio();
                } else if (this.isInitialized) {
                    if (!this.ambientSource) {
                        this.startAmbientAudio();
                    }
                }
                
                return this.musicEnabled;
            }
            
            setMusicVolume(volume) {
                this.musicVolume = Math.max(0, Math.min(1, volume));
                this.ambientVolume = this.musicVolume;
                this.targetAmbientVolume = this.musicVolume;
                
                if (this.ambientGain) {
                    this.ambientGain.gain.value = this.musicVolume;
                }
            }
            createAmbientSound() {
                // Create multiple oscillators for a richer ambient sound
                const oscillators = [];
                const gains = [];
                const merger = this.audioContext.createChannelMerger(1);
                
                // Base frequency and harmonics
                const baseFreq = 55; // Low A
                const harmonics = [1, 2, 3, 4, 5];
                
                harmonics.forEach((harmonic, index) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    const lfo = this.audioContext.createOscillator();
                    const lfoGain = this.audioContext.createGain();
                    
                    // Set oscillator frequency
                    osc.frequency.value = baseFreq * harmonic;
                    osc.type = index === 0 ? 'sine' : 'triangle';
                    
                    // Set up LFO for subtle frequency modulation
                    lfo.frequency.value = 0.1 + index * 0.05;
                    lfoGain.gain.value = 2 + index;
                    
                    lfo.connect(lfoGain);
                    lfoGain.connect(osc.frequency);
                    
                    // Set gain based on harmonic
                    gain.gain.value = 1 / (harmonic * harmonic);
                    
                    osc.connect(gain);
                    gain.connect(merger);
                    
                    osc.start();
                    lfo.start();
                    
                    oscillators.push(osc, lfo);
                    gains.push(gain);
                });
                
                // Add subtle noise
                const noiseBuffer = this.createNoiseBuffer();
                const noiseSource = this.audioContext.createBufferSource();
                noiseSource.buffer = noiseBuffer;
                noiseSource.loop = true;
                
                const noiseGain = this.audioContext.createGain();
                noiseGain.gain.value = 0.02;
                
                const noiseFilter = this.audioContext.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.value = 200;
                
                noiseSource.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(merger);
                
                noiseSource.start();
                
                merger.connect(this.ambientGain);
                
                // Return a custom object that can stop all oscillators
                return {
                    oscillators: [...oscillators, noiseSource],
                    start: () => {},
                    stop: () => {
                        oscillators.forEach(osc => osc.stop());
                        noiseSource.stop();
                    }
                };
            }
            
            createNoiseBuffer() {
                const bufferSize = 2 * this.audioContext.sampleRate;
                const buffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
                const output = buffer.getChannelData(0);
                
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                
                return buffer;
            }
            
            updateAmbientVolume(swellFactor) {
                // Apply swell factor to the user-set music volume
                // swellFactor is between 0 and 1, where 0 is normal and 1 is maximum swell
                const baseVolume = this.musicVolume;
                const maxVolume = Math.min(this.musicVolume * 2, 1); // Don't exceed 100%
                this.targetAmbientVolume = baseVolume + (maxVolume - baseVolume) * swellFactor;
            }
            
            update() {
                if (!this.isInitialized || !this.ambientGain) return;
                
                // Smoothly transition ambient volume
                const currentVolume = this.ambientGain.gain.value;
                const diff = this.targetAmbientVolume - currentVolume;
                
                if (Math.abs(diff) > 0.001) {
                    this.ambientGain.gain.value += diff * this.volumeTransitionSpeed;
                }
            }
            
            stopAmbientAudio() {
                if (this.ambientSource) {
                    // Handle both procedural and external audio sources
                    if (this.ambientSource.stop) {
                        this.ambientSource.stop();
                    } else if (this.ambientSource.oscillators) {
                        // Procedural audio with multiple oscillators
                        this.ambientSource.oscillators.forEach(osc => {
                            if (osc && osc.stop) osc.stop();
                        });
                    }
                    this.ambientSource = null;
                }
            }
        }

        // Event Bus System for modular communication
        class EventBus {
            constructor() {
                this.events = {};
            }
            
            on(event, callback) {
                if (!this.events[event]) {
                    this.events[event] = [];
                }
                this.events[event].push(callback);
            }
            
            off(event, callback) {
                if (this.events[event]) {
                    this.events[event] = this.events[event].filter(cb => cb !== callback);
                }
            }
            
            emit(event, data) {
                if (this.events[event]) {
                    this.events[event].forEach(callback => callback(data));
                }
            }
        }

                    combo4x: { category: 'effects', volume: 1.0, file: 'sounds/combo-4x.wav' },
                    scoreTick: { category: 'ui', volume: 0.4, file: 'sounds/score-tick.wav' },
                    bonusPoints: { category: 'effects', volume: 0.9, file: 'sounds/bonus-points.wav' },
                    
                    // Game State
                    gameStart: { category: 'ui', volume: 0.8, file: 'sounds/game-start.wav' },
                    levelComplete: { category: 'ui', volume: 1.0, file: 'sounds/level-complete.wav' },
                    gameOver: { category: 'ui', volume: 0.9, file: 'sounds/game-over.wav' },
                    warning: { category: 'ui', volume: 0.8, file: 'sounds/warning.wav' },
                    pause: { category: 'ui', volume: 0.6, file: 'sounds/pause.wav' },
                    resume: { category: 'ui', volume: 0.6, file: 'sounds/resume.wav' },
                    
                    // Particle/Effect Sounds
                    particleSparkle: { category: 'effects', volume: 0.3, file: 'sounds/particle-sparkle.wav' },
                    screenShake: { category: 'effects', volume: 0.7, file: 'sounds/screen-shake.wav' },
                    electricArc: { category: 'effects', volume: 0.6, file: 'sounds/electric-arc.wav' }
                };
                
                this.loadingSounds = new Set();
                this.loadedSounds = new Set();
            }
            
            async init() {
                // Pre-load critical sounds
                const criticalSounds = [
                    'bubbleShoot', 'bubbleAttach', 'bubblePopSingle', 'bubblePopMultiple',
                    'uiClick', 'gameStart'
                ];
                
                for (const soundName of criticalSounds) {
                    await this.loadSound(soundName);
                }
                
                // Load remaining sounds asynchronously
                for (const soundName in this.soundDefinitions) {
                    if (!criticalSounds.includes(soundName)) {
                        this.loadSound(soundName).catch(err => 
                            console.warn(`Failed to load sound: ${soundName}`, err)
                        );
                    }
                }
            }
            
            async loadSound(soundName) {
                if (this.loadingSounds.has(soundName) || this.loadedSounds.has(soundName)) {
                    return;
                }
                
                this.loadingSounds.add(soundName);
                const soundDef = this.soundDefinitions[soundName];
                
                if (!soundDef) {
                    console.warn(`Sound definition not found: ${soundName}`);
                    return;
                }
                
                try {
                    const audio = new Audio(soundDef.file);
                    audio.volume = soundDef.volume * this.soundCategories[soundDef.category] * this.volume;
                    
                    await new Promise((resolve, reject) => {
                        audio.addEventListener('canplaythrough', resolve, { once: true });
                        audio.addEventListener('error', reject, { once: true });
                        audio.load();
                    });
                    
                    this.sounds.set(soundName, {
                        audio: audio,
                        definition: soundDef,
                        pool: [audio] // Pool for overlapping sounds
                    });
                    
                    this.loadedSounds.add(soundName);
                } catch (error) {
                    console.error(`Failed to load sound ${soundName}:`, error);
                } finally {
                    this.loadingSounds.delete(soundName);
                }
            }
            
            play(soundName, options = {}) {
                if (!this.enabled) return;
                
                const soundData = this.sounds.get(soundName);
                if (!soundData) {
                    // Try to load it if not yet loaded
                    this.loadSound(soundName);
                    return;
                }
                
                // Get audio from pool or clone if all are playing
                let audio = null;
                for (const pooledAudio of soundData.pool) {
                    if (pooledAudio.paused || pooledAudio.ended) {
                        audio = pooledAudio;
                        break;
                    }
                }
                
                if (!audio) {
                    // All pool instances are playing, create a new one
                    audio = soundData.audio.cloneNode();
                    soundData.pool.push(audio);
                }
                
                // Apply volume settings
                const categoryVolume = this.soundCategories[soundData.definition.category];
                const finalVolume = (options.volume || soundData.definition.volume) * categoryVolume * this.volume;
                audio.volume = Math.max(0, Math.min(1, finalVolume));
                
                // Apply playback rate if specified
                if (options.rate) {
                    audio.playbackRate = options.rate;
                }
                
                // Reset and play
                audio.currentTime = 0;
                audio.play().catch(err => {
                    console.warn(`Failed to play sound: ${soundName}`, err);
                });
                
                return audio;
            }
            
            playWithVariation(soundName, options = {}) {
                // Add slight pitch variation for repeated sounds
                const variation = 0.1;
                const rate = 1 + (Math.random() - 0.5) * variation;
                return this.play(soundName, { ...options, rate });
            }
            
            playCombo(comboLevel) {
                if (comboLevel === 2) {
                    this.play('combo2x');
                } else if (comboLevel === 3) {
                    this.play('combo3x');
                } else if (comboLevel >= 4) {
                    this.play('combo4x', { rate: 1 + (comboLevel - 4) * 0.1 });
                }
            }
            
            stopAll() {
                for (const [soundName, soundData] of this.sounds) {
                    for (const audio of soundData.pool) {
                        audio.pause();
                        audio.currentTime = 0;
                    }
                }
            }
            
            setEnabled(enabled) {
                this.enabled = enabled;
                if (!enabled) {
                    this.stopAll();
                }
            }
            
            setVolume(volume) {
                this.volume = Math.max(0, Math.min(1, volume));
                // Update all loaded sounds
                for (const [soundName, soundData] of this.sounds) {
                    const categoryVolume = this.soundCategories[soundData.definition.category];
                    for (const audio of soundData.pool) {
                        audio.volume = soundData.definition.volume * categoryVolume * this.volume;
                    }
                }
            }
            
            setCategoryVolume(category, volume) {
                this.soundCategories[category] = Math.max(0, Math.min(1, volume));
                // Update affected sounds
                for (const [soundName, soundData] of this.sounds) {
                    if (soundData.definition.category === category) {
                        for (const audio of soundData.pool) {
                            audio.volume = soundData.definition.volume * this.soundCategories[category] * this.volume;
                        }
                    }
                }
            }
        }

        // Chain Lightning Bubble Power-Up
        class ChainLightningPowerUp extends PowerUp {
            constructor() {
                super('chainLightning', {
                    name: 'Chain Lightning Bubble',
                    rarity: 'rare',
                    spawnRate: 0.08,
                    color: 0x00aaff,
                    glowColor: 0x00ddff
                });
                this.primaryArcCount = 3; // 2-3 primary arcs
                this.secondaryArcCount = 2; // 1-2 secondary arcs per primary
                this.hitBubbles = new Set(); // Track bubbles already hit
            }
            
            activate(targetBubble, gameState, gameManager) {
                // Clear hit tracking for this activation
                this.hitBubbles.clear();
                
                // Get the impact position
                const impactPos = targetBubble.position;
                
                // Find the bubble at impact position (could be the shot bubble or a grid bubble)
                let impactBubble = null;
                let minDistance = Infinity;
                
                // Check all grid bubbles to find the one at impact position
                for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                    for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
                        const bubble = gameState.bubbleGrid[y][x];
                        if (bubble) {
                            const distance = bubble.position.distanceTo(impactPos);
                            if (distance < minDistance) {
                                minDistance = distance;
                                impactBubble = bubble;
                            }
                        }
                    }
                }
                
                if (!impactBubble) {
                    console.log('No bubble found at impact position');
                    return false;
                }
                
                // Emit event for visual/audio feedback
                gameManager.eventBus.emit('chainLightningActivated', {
                    position: impactPos,
                    bubble: impactBubble
                });
                
                // Start the chain lightning effect
                this.executeChainLightning(impactBubble, gameState, gameManager);
                
                return true;
            }
            
            executeChainLightning(impactBubble, gameState, gameManager) {
                const bubblesDestroyed = [];
                
                // 1. Destroy the initial impact bubble
                this.hitBubbles.add(impactBubble);
                bubblesDestroyed.push(impactBubble);
                
                // Create initial impact effect
                this.createLightningImpactEffect(impactBubble.position, gameManager);
                
                // 2. Find and destroy primary arc targets
                const primaryTargets = this.findNearestBubbles(
                    impactBubble,
                    this.primaryArcCount,
                    gameState,
                    this.hitBubbles
                );
                
                // Create primary lightning arcs with delay
                primaryTargets.forEach((target, index) => {
                    setTimeout(() => {
                        this.createLightningArc(
                            impactBubble.position,
                            target.position,
                            true, // isPrimary
                            gameManager
                        );
                        this.hitBubbles.add(target);
                        bubblesDestroyed.push(target);
                        
                        // Play electric arc sound
                        soundManager.playWithVariation('electricArc', { volume: 0.8 });
                        
                        // 3. For each primary target, find secondary targets
                        const secondaryTargets = this.findNearestBubbles(
                            target,
                            Math.floor(Math.random() * 2) + 1, // 1-2 secondary arcs
                            gameState,
                            this.hitBubbles
                        );
                        
                        // Create secondary arcs with additional delay
                        secondaryTargets.forEach((secondaryTarget, secondaryIndex) => {
                            setTimeout(() => {
                                this.createLightningArc(
                                    target.position,
                                    secondaryTarget.position,
                                    false, // not primary
                                    gameManager
                                );
                                this.hitBubbles.add(secondaryTarget);
                                bubblesDestroyed.push(secondaryTarget);
                                
                                // Play quieter arc sound for secondary
                                soundManager.playWithVariation('electricArc', { volume: 0.5, rate: 1.2 });
                            }, 50 + secondaryIndex * 30);
                        });
                    }, 100 + index * 50);
                });
                
                // Destroy all hit bubbles after all arcs are shown
                setTimeout(() => {
                    bubblesDestroyed.forEach((bubble, index) => {
                        setTimeout(() => {
                            this.createElectricDestructionEffect(bubble);
                            removeBubble(bubble);
                            
                            // Add score for each destroyed bubble
                            gameState.score += 20;
                            updateScore();
                        }, index * 30);
                    });
                    
                    // Check for floating bubbles after destruction
                    setTimeout(() => {
                        removeFloatingBubbles();
                    }, bubblesDestroyed.length * 30 + 200);
                    
                }, primaryTargets.length * 50 + 300);
            }
            
            findNearestBubbles(centerBubble, count, gameState, excludeSet) {
                const candidates = [];
                
                // Find all valid neighbor bubbles
                for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                    for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
                        const bubble = gameState.bubbleGrid[y][x];
                        if (bubble && bubble !== centerBubble && !excludeSet.has(bubble) && !bubble.isPowerUp) {
                            const distance = centerBubble.position.distanceTo(bubble.position);
                            candidates.push({ bubble, distance });
                        }
                    }
                }
                
                // Sort by distance and return the nearest ones
                candidates.sort((a, b) => a.distance - b.distance);
                return candidates.slice(0, count).map(c => c.bubble);
            }
            
            createLightningImpactEffect(position, gameManager) {
                // Bright flash at impact point
                const flashLight = new THREE.PointLight(0x00ddff, 15, 10);
                flashLight.position.copy(position);
                flashLight.position.z = 2;
                scene.add(flashLight);
                
                // Fade out flash
                let intensity = 15;
                const fadeInterval = setInterval(() => {
                    intensity -= 1;
                    flashLight.intensity = intensity;
                    if (intensity <= 0) {
                        scene.remove(flashLight);
                        clearInterval(fadeInterval);
                    }
                }, 20);
                
                // Create electrical burst particles
                for (let i = 0; i < 30; i++) {
                    const particle = new Particle(

                        position.y,
                        position.z + 0.5,

                        0.2
                    );
                    
                    const angle = (Math.PI * 2 * i) / 30;
                    const speed = 5 + Math.random() * 5;
                    particle.velocity = new THREE.Vector3(
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed,
                        Math.random() * 2
                    );
                    particle.decay = 0.03;
                    gameState.particles.push(particle);
                }
                
                // Screen shake
                gameManager.addScreenShake(0.3, 8);
            }
            
            createLightningArc(startPos, endPos, isPrimary, gameManager) {
                // Create animated lightning bolt geometry
                const points = this.generateLightningPath(startPos, endPos, isPrimary ? 5 : 3);
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                
                const material = new THREE.LineBasicMaterial({
                    color: isPrimary ? 0x00ddff : 0x66ccff,
                    transparent: true,
                    opacity: 1,
                    linewidth: isPrimary ? 3 : 2
                });
                
                const lightning = new THREE.Line(geometry, material);
                scene.add(lightning);
                
                // Add glow effect
                const glowMaterial = new THREE.LineBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.5,
                    linewidth: isPrimary ? 5 : 3
                });
                const glowLine = new THREE.Line(geometry, glowMaterial);
                scene.add(glowLine);
                
                // Animate the lightning
                let opacity = 1;
                let time = 0;
                const animateInterval = setInterval(() => {
                    time += 0.016;
                    
                    // Flicker effect
                    const flicker = Math.random() > 0.3 ? 1 : 0.5;
                    material.opacity = opacity * flicker;
                    glowMaterial.opacity = opacity * 0.5 * flicker;
                    
                    // Update path for dynamic movement
                    if (time < 0.2) {
                        const newPoints = this.generateLightningPath(startPos, endPos, isPrimary ? 5 : 3);
                        geometry.setFromPoints(newPoints);
                    }
                    
                    // Fade out
                    if (time > 0.3) {
                        opacity -= 0.05;
                        if (opacity <= 0) {
                            scene.remove(lightning);
                            scene.remove(glowLine);
                            geometry.dispose();
                            material.dispose();
                            glowMaterial.dispose();
                            clearInterval(animateInterval);
                        }
                    }
                }, 16);
            }
            
            generateLightningPath(start, end, segments) {
                const points = [];
                points.push(new THREE.Vector3(start.x, start.y, start.z + 0.5));
                
                // Generate intermediate points with random offset
                for (let i = 1; i < segments; i++) {
                    const t = i / segments;
                    const x = start.x + (end.x - start.x) * t;
                    const y = start.y + (end.y - start.y) * t;
                    const z = start.z + (end.z - start.z) * t + 0.5;
                    
                    // Add random offset perpendicular to the line
                    const perpX = -(end.y - start.y);
                    const perpY = end.x - start.x;
                    const length = Math.sqrt(perpX * perpX + perpY * perpY);
                    const normalizedPerpX = perpX / length;
                    const normalizedPerpY = perpY / length;
                    
                    const offset = (Math.random() - 0.5) * 0.3;
                    points.push(new THREE.Vector3(
                        x + normalizedPerpX * offset,
                        y + normalizedPerpY * offset,
                        z
                    ));
                }
                
                points.push(new THREE.Vector3(end.x, end.y, end.z + 0.5));
                return points;
            }
            
            createElectricDestructionEffect(bubble) {

                // Electric flash at bubble position

                scene.add(flash);
                
                setTimeout(() => {
                    scene.remove(flash);
                }, 100);
            }
            
            createVisualEffect(bubble) {

                // Dark stormy bubble with electric core

                });

                bubble.lightningCore = core;
                
                // Add crackling electric arcs around the bubble
                const arcCount = 4;

                for (let i = 0; i < arcCount; i++) {
                    const arcGeometry = new THREE.BufferGeometry();
                    const arcPositions = new Float32Array(6 * 3);

                    const arcMaterial = new THREE.LineBasicMaterial({

                    });
                    
                    const arc = new THREE.Line(arcGeometry, arcMaterial);

                        phase: Math.random() * Math.PI * 2,

                    });
                }
                
                // Enhanced animation with pulsing core and dynamic arcs
                const originalUpdate = bubble.powerUpAnimation.update;
                bubble.powerUpAnimation.update = function(deltaTime) {

                    bubble.lightningCore.scale.setScalar(corePulse);

                    // Update electric arcs with more chaotic movement
                    bubble.electricArcs.forEach((arc, index) => {
                        const positions = arc.mesh.geometry.attributes.position.array;
                        const time = this.time * arc.speed + arc.phase;
                        
                        for (let j = 0; j < 6; j++) {
                            const t = j / 5;
                            const angle = time + t * Math.PI * 2;
                            const radius = CONFIG.BUBBLE_RADIUS * (0.7 + Math.sin(time * 3 + j) * 0.4);
                            
                            // More erratic movement
                            const jitterX = (Math.random() - 0.5) * 0.2;
                            const jitterY = (Math.random() - 0.5) * 0.2;
                            
                            positions[j * 3] = Math.cos(angle) * radius + jitterX;
                            positions[j * 3 + 1] = Math.sin(angle) * radius + jitterY;
                            positions[j * 3 + 2] = (j - 2.5) * 0.3;
                        }
                        
                        arc.mesh.geometry.attributes.position.needsUpdate = true;
                        arc.mesh.material.opacity = 0.3 + Math.random() * 0.7;
                    });
                    
                    // Occasional bright flash
                    if (Math.random() < 0.02) {
                        bubble.mesh.material.emissiveIntensity = 1.5;
                        setTimeout(() => {
                            bubble.mesh.material.emissiveIntensity = 0.6;
                        }, 50);
                    }
                };
            }
        }

        // Color Splash Power-Up
        class ColorSplashPowerUp extends PowerUp {
            constructor() {
                super('colorSplash', {
                    name: 'Color Splash',
                    rarity: 'rare',
                    spawnRate: 0.10,
                    color: 0xff00ff,
                    glowColor: 0xff66ff
                });
                this.clusterSize = 2; // Radius of 2 for cluster detection
            }
            
            activate(targetPosition, gameState, gameManager) {
                // Find all bubbles on the board
                const allBubbles = [];
                for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                    for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
                        const bubble = gameState.bubbleGrid[y][x];
                        if (bubble && !bubble.isPowerUp) {
                            allBubbles.push(bubble);
                        }
                    }
                }
                
                if (allBubbles.length === 0) return false;
                
                // Randomly select a center bubble
                const centerBubble = allBubbles[Math.floor(Math.random() * allBubbles.length)];
                
                // Find cluster of bubbles around the center
                const cluster = [centerBubble];
                const maxDistance = this.clusterSize * CONFIG.HEX_WIDTH;
                
                for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                    for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
                        const bubble = gameState.bubbleGrid[y][x];
                        if (bubble && bubble !== centerBubble && !bubble.isPowerUp) {
                            const distance = centerBubble.position.distanceTo(bubble.position);
                            if (distance <= maxDistance) {
                                cluster.push(bubble);
                            }
                        }
                    }
                }
                
                // Get all active colors from the board
                const activeColors = new Set();
                allBubbles.forEach(bubble => {
                    activeColors.add(bubble.color);
                });
                
                // Randomly select a color from active colors
                const colorsArray = Array.from(activeColors);
                const selectedColor = colorsArray[Math.floor(Math.random() * colorsArray.length)];
                
                // Create visual effect before color change
                this.createSplashEffect(centerBubble, cluster, selectedColor, gameManager);
                
                // Change colors of all bubbles in cluster after delay
                setTimeout(() => {
                    cluster.forEach((bubble, index) => {
                        setTimeout(() => {
                            this.transformBubbleColor(bubble, selectedColor);
                        }, index * 50);
                    });
                    
                    // Check for matches after all transformations
                    setTimeout(() => {
                        cluster.forEach(bubble => {
                            const matches = findConnectedBubbles(bubble);
                            if (matches.length >= 3) {
                                checkMatches(bubble);
                            }
                        });
                        // Check for floating bubbles after color transformations
                        setTimeout(() => {
                            removeFloatingBubbles();
                        }, 500);
                    }, cluster.length * 50 + 200);
                }, 800);
                
                // Remove the power-up bubble itself
                setTimeout(() => {
                    const powerUpBubble = gameState.bubbleGrid[targetPosition.gridY][targetPosition.gridX];
                    if (powerUpBubble) {
                        removeBubble(powerUpBubble);
                        createExplosionEffect(powerUpBubble);
                    }
                }, 100);
                
                return true;
            }
            
            createSplashEffect(centerBubble, cluster, targetColor, gameManager) {
                // Create expanding ring effect from center
                const ringGeometry = new THREE.TorusGeometry(0.1, 0.05, 8, 32);
                const ringMaterial = new THREE.MeshStandardMaterial({
                    color: targetColor,

                    if (opacity <= 0) {
                        scene.remove(ring);
                        ringGeometry.dispose();
                        ringMaterial.dispose();
                        clearInterval(expandInterval);
                    }
                }, 16);
                
                // Create color wave particles
                const particleCount = 50;
                for (let i = 0; i < particleCount; i++) {
                    const angle = (Math.PI * 2 * i) / particleCount;

                    );

                // Add screen flash effect

                    }
                }, 50);
                
                // Screen shake for impact

                // Create spiral effect around each bubble in cluster
                cluster.forEach((bubble, index) => {
                    setTimeout(() => {

                    }, index * 30);
                });
            }
            
            createSpiralEffect(bubble, targetColor) {
                // Create spiral particles around bubble
                const spiralCount = 8;
                for (let i = 0; i < spiralCount; i++) {
                    const angle = (Math.PI * 2 * i) / spiralCount;
                    const particle = new Particle(
                        bubble.position.x + Math.cos(angle) * CONFIG.BUBBLE_RADIUS,
                        bubble.position.y + Math.sin(angle) * CONFIG.BUBBLE_RADIUS,
                        bubble.position.z,
                        targetColor,

                    );
                    
                    // Spiral motion
                    const tangentAngle = angle + Math.PI / 2;
                    particle.velocity = new THREE.Vector3(

            transformBubbleColor(bubble, newColor) {

                // Create transformation particles
                for (let i = 0; i < 20; i++) {
                    const particle = new Particle(
                        bubble.position.x,
                        bubble.position.y,
                        bubble.position.z,
                        i < 10 ? oldColor : newColor,
                        0.15
                    );
                    
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 3;
                    particle.velocity = new THREE.Vector3(
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed,
                        (Math.random() - 0.5) * 2
                    );
                    particle.decay = 0.04;
                    gameState.particles.push(particle);
                }
                
                // Update bubble color
                bubble.color = newColor;
                bubble.material.color.set(newColor);
                bubble.material.emissive.set(newColor);
                bubble.glowMesh.material.color.set(newColor);
                
                // Add transformation pulse
                bubble.connectionAnimating = 1.5;
                
                // Create flash effect
                const flash = new THREE.PointLight(newColor, 3, 3);
                flash.position.copy(bubble.position);
                scene.add(flash);
                
                setTimeout(() => {

                    emissive: 0xff00ff,
                    emissiveIntensity: 0.5,
                    metalness: 0.3,
                    roughness: 0.2,
                    clearcoat: 1,
                    clearcoatRoughness: 0,

                    iridescenceIOR: 2.3,
                    sheen: 1,
                    sheenRoughness: 0.2,
                    sheenColor: new THREE.Color(0x00ffff)
                });
                
                // Add swirling color particles
                const particleCount = 5;
                bubble.colorParticles = [];
                
                for (let i = 0; i < particleCount; i++) {
                    const particleGeometry = new THREE.SphereGeometry(0.1, 8, 8);
                    const particleColor = CONFIG.BUBBLE_COLORS[Math.floor(Math.random() * CONFIG.BUBBLE_COLORS.length)];
                    const particleMaterial = new THREE.MeshStandardMaterial({
                        color: particleColor,
                        transparent: true,
                        opacity: 0.8,
                        emissive: particleColor,
                        emissiveIntensity: 2
                    });
                    
                    const particleMesh = new THREE.Mesh(particleGeometry, particleMaterial);
                    bubble.mesh.add(particleMesh);
                    bubble.colorParticles.push({
                        mesh: particleMesh,
                        angle: (Math.PI * 2 * i) / particleCount,
                        radius: CONFIG.BUBBLE_RADIUS * 0.8,
                        speed: 2 + Math.random(),
                        color: particleColor
                    });
                }
                
                // Enhanced animation with swirling particles
                const originalUpdate = bubble.powerUpAnimation.update;
                bubble.powerUpAnimation.update = function(deltaTime) {
                    originalUpdate.call(this, deltaTime);
                    
                    // Animate color shift
                    const hue = (this.time * 0.2) % 1;
                    bubble.mesh.material.color.setHSL(hue, 1, 0.5);
                    bubble.mesh.material.emissive.setHSL(hue, 1, 0.5);
                    
                    // Animate swirling particles
                    bubble.colorParticles.forEach((particle, index) => {
                        particle.angle += particle.speed * deltaTime;
                        const wobble = Math.sin(this.time * 3 + index) * 0.1;
                        const r = particle.radius + wobble;
                        
                        particle.mesh.position.x = Math.cos(particle.angle) * r;
                        particle.mesh.position.y = Math.sin(particle.angle) * r;
                        particle.mesh.position.z = Math.sin(this.time * 2 + index) * 0.2;
                        
                        // Pulse opacity
                        particle.mesh.material.opacity = 0.5 + Math.sin(this.time * 4 + index) * 0.3;
                    });
                };
            }
        }
        
        // Power-Up System Manager
        class PowerUpSystem {
            constructor(eventBus) {
                this.eventBus = eventBus;
                this.powerUps = new Map();
                this.activePowerUps = [];
                
                // Register power-ups
                this.registerPowerUp(new RainbowPowerUp());
                this.registerPowerUp(new BombPowerUp());
                this.registerPowerUp(new ChainLightningPowerUp());
                this.registerPowerUp(new PrecisionAimPowerUp());
                this.registerPowerUp(new ColorSplashPowerUp());
                
                // Calculate total spawn rate
                this.totalSpawnRate = 0;
                this.powerUps.forEach(powerUp => {
                    this.totalSpawnRate += powerUp.spawnRate;
                });
            }
            
            registerPowerUp(powerUp) {
                this.powerUps.set(powerUp.type, powerUp);
            }
            
            shouldSpawnPowerUp() {
                return Math.random() < this.totalSpawnRate;
            }
            
            getRandomPowerUp() {
                const rand = Math.random() * this.totalSpawnRate;
                let accumulator = 0;
                
                for (const [type, powerUp] of this.powerUps) {
                    accumulator += powerUp.spawnRate;
                    if (rand < accumulator) {
                        return powerUp;
                    }
                }
                
                // Fallback to first power-up
                return this.powerUps.values().next().value;
            }
            
            applyPowerUpToBubble(bubble) {
                if (this.shouldSpawnPowerUp()) {
                    const powerUp = this.getRandomPowerUp();
                    powerUp.createVisualEffect(bubble);
                    console.log(`Created ${powerUp.type} power-up`);
                    return powerUp;
                }
                return null;
            }
            
            activatePowerUp(bubble, gameState, gameManager) {
                if (bubble.isPowerUp && bubble.powerUpType) {
                    const powerUp = this.powerUps.get(bubble.powerUpType);
                    if (powerUp) {
                        return powerUp.activate(bubble.position, gameState, gameManager);
                    }
                }
                return false;
            }
            
            update(deltaTime) {
                // Update active power-ups
                this.activePowerUps = this.activePowerUps.filter(powerUp => {
                    powerUp.duration -= deltaTime;
                    return powerUp.duration > 0;
                });
            }
        }

                        gameState.extendedTrajectory = false;

                        timerCircle.style.strokeDashoffset = offset;
