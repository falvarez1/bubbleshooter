            addScreenShake(duration, intensity) {
                this.screenShake.duration = Math.max(this.screenShake.duration, duration);
                this.screenShake.intensity = Math.max(this.screenShake.intensity, intensity);
            }
            
            updateScreenShake(deltaTime, camera) {
                if (this.screenShake.duration > 0) {
                    this.screenShake.duration -= deltaTime;
                    
                    const shakeX = (Math.random() - 0.5) * this.screenShake.intensity * 0.1;
                    const shakeY = (Math.random() - 0.5) * this.screenShake.intensity * 0.1;
                    
                    camera.position.x = shakeX;
                    camera.position.y = shakeY;
                    
                    if (this.screenShake.duration <= 0) {
                        camera.position.x = 0;
                        camera.position.y = 0;
                        this.screenShake.intensity = 0;
                    }
                }
            }
            
            update(deltaTime, camera) {
                this.powerUpSystem.update(deltaTime);
                this.updateScreenShake(deltaTime, camera);
            }
        }

        // Bubble Class
        class Bubble {
            constructor(x, y, color, radius = CONFIG.BUBBLE_RADIUS) {
                this.gridX = -1;
                this.gridY = -1;
                this.position = new THREE.Vector3(x, y, 0);
                this.velocity = new THREE.Vector3(0, 0, 0);
                this.color = color;
                this.radius = radius;
                this.isMoving = false;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;
                
                // Create geometry with high detail
                const geometry = new THREE.IcosahedronGeometry(radius, 2);
                
                // Premium glass-like material with enhanced rim lighting
                this.material = new THREE.MeshPhysicalMaterial({
                    color: color,
                    metalness: 0.1,
                    roughness: 0.1,
                    transmission: 0.5,
                    thickness: 0.5,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.0,
                    envMapIntensity: 1.5,
                    ior: 1.5,
                    reflectivity: 0.8,
                    emissive: color,
                    emissiveIntensity: 0.2,
                    sheen: 1.0,
                    sheenRoughness: 0.3,
                    sheenColor: new THREE.Color(color).multiplyScalar(1.5)
                });
                
                this.mesh = new THREE.Mesh(geometry, this.material);
                this.mesh.position.set(x, y, 0);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                
                // Add rim light glow
                const glowGeometry = new THREE.IcosahedronGeometry(radius * 1.1, 2);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.15,
                    side: THREE.BackSide
                });
                this.glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
                this.mesh.add(this.glowMesh);
                
                // Connection animation properties
                this.connectionScale = 1.0;
                this.connectionAnimating = false;
                
                // Add subtle floating animation
                this.floatOffset = Math.random() * Math.PI * 2;
                this.floatSpeed = 0.5 + Math.random() * 0.5;
            }
            
            update(deltaTime) {
                if (this.isMoving) {
                    // Update position
                    this.position.add(this.velocity.clone().multiplyScalar(deltaTime));
                    this.mesh.position.copy(this.position);
                    
                    // Check wall collisions
                    const wallLimit = 5.5;
                    if (Math.abs(this.position.x) > wallLimit - this.radius) {
                        this.position.x = Math.sign(this.position.x) * (wallLimit - this.radius);
                        this.velocity.x *= -CONFIG.WALL_BOUNCE_DAMPING;
                        this.createWallImpactParticles();
                        
                        // Add wall flash effect
                        const wallFlash = new THREE.PointLight(0x00ffff, 2, 5);
                        wallFlash.position.set(this.position.x, this.position.y, 2);
                        scene.add(wallFlash);
                        
                        // Fade out wall flash
                        const fadeInterval = setInterval(() => {
                            wallFlash.intensity -= 0.1;
                            if (wallFlash.intensity <= 0) {
                                scene.remove(wallFlash);
                                clearInterval(fadeInterval);
                            }
                        }, 50);
                    }
                    
                    // Check ceiling
                    if (this.position.y > 7 - this.radius) {
                        this.position.y = 7 - this.radius;
                        this.velocity.y = 0;
                        this.isMoving = false;
                    }
                }
                
                // Floating animation
                if (!this.isMoving) {
                    const floatY = Math.sin(Date.now() * 0.001 * this.floatSpeed + this.floatOffset) * 0.05;
                    this.mesh.position.y = this.position.y + floatY;
                }
                
                // Rotation
                this.mesh.rotation.x += this.rotationSpeed;
                this.mesh.rotation.y += this.rotationSpeed * 0.7;
                
                // Connection bounce animation
                if (this.connectionAnimating) {
                    this.connectionScale = 1.0 + Math.sin(Date.now() * 0.01) * 0.1 * this.connectionAnimating;
                    this.mesh.scale.setScalar(this.connectionScale);
                    this.connectionAnimating *= 0.95; // Decay
                    if (this.connectionAnimating < 0.01) {
                        this.connectionAnimating = false;
                        this.mesh.scale.setScalar(1.0);
                    }
                }
                
                // Update rim glow
                if (this.glowMesh) {
                    this.glowMesh.rotation.x = -this.mesh.rotation.x;
                    this.glowMesh.rotation.y = -this.mesh.rotation.y;
                }
                
                // Update power-up animation if present
                if (this.powerUpAnimation) {
                    this.powerUpAnimation.update(deltaTime);
                }
            }
            
            createWallImpactParticles() {
                for (let i = 0; i < 10; i++) {
                    const particle = new Particle(
                        this.position.x,
                        this.position.y,
                        this.position.z,
                        this.color,
                        0.1
                    );
                    gameState.particles.push(particle);
                }
            }
            
            destroy() {
                scene.remove(this.mesh);
                this.material.dispose();
                this.mesh.geometry.dispose();
            }
        }
        
        // Particle System
        class Particle {
            constructor(x, y, z, color, size) {
                this.position = new THREE.Vector3(x, y, z);
                this.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 5
                );
                this.life = 1.0;
                this.decay = 0.02;
                
                const geometry = new THREE.SphereGeometry(size, 8, 8);
                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    transparent: true,
                    opacity: 1.0,
                    emissive: color,
                    emissiveIntensity: 2
                });
                
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.copy(this.position);
                scene.add(this.mesh);
            }
            
            update(deltaTime) {
                this.velocity.y -= 9.8 * deltaTime; // Gravity
                this.position.add(this.velocity.clone().multiplyScalar(deltaTime));
                this.mesh.position.copy(this.position);
                
                this.life -= this.decay;
                this.mesh.material.opacity = this.life;
                this.mesh.scale.setScalar(this.life);
                
                return this.life > 0;
            }
            
            destroy() {
                scene.remove(this.mesh);
                this.mesh.geometry.dispose();
                this.mesh.material.dispose();
            }
        }
        
        // Starfield System
        class StarfieldLayer {
            constructor(count, size, speed, depth, color = 0xffffff) {
                this.speed = speed;
                this.time = 0;
                
                // Create geometry
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);
                const sizes = new Float32Array(count);
                const twinklePhases = new Float32Array(count);
                
                // Color variations
                const colorVariations = [
                    new THREE.Color(0xffffff), // White
                    new THREE.Color(0xffffff), // White (more common)
                    new THREE.Color(0xaaccff), // Blue
                    new THREE.Color(0xffccaa), // Orange
                    new THREE.Color(0xffaaaa)  // Red
                ];
                
                for (let i = 0; i < count; i++) {
                    // Position
                    positions[i * 3] = (Math.random() - 0.5) * 50;
                    positions[i * 3 + 1] = (Math.random() - 0.5) * 40;
                    positions[i * 3 + 2] = -depth - Math.random() * 10;
                    
                    // Color
                    const starColor = colorVariations[Math.floor(Math.random() * colorVariations.length)];
                    colors[i * 3] = starColor.r;
                    colors[i * 3 + 1] = starColor.g;
                    colors[i * 3 + 2] = starColor.b;
                    
                    // Size
                    sizes[i] = size * (0.5 + Math.random() * 1.5);
                    
                    // Twinkle phase
                    twinklePhases[i] = Math.random() * Math.PI * 2;
                }
                
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
                
                // Store attributes for animation
                this.positions = positions;
                this.sizes = sizes;
                this.baseSizes = new Float32Array(sizes);
                this.twinklePhases = twinklePhases;
                
                // Create material with vertex colors
                const material = new THREE.PointsMaterial({
                    size: 1,
                    sizeAttenuation: true,
                    transparent: true,
                    opacity: 0.9,
                    vertexColors: true,
                    blending: THREE.AdditiveBlending,
                    map: this.createStarTexture()
                });
                
                this.points = new THREE.Points(geometry, material);
                scene.add(this.points);
            }
            
            createStarTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 32;
                canvas.height = 32;
                const ctx = canvas.getContext('2d');
                
                // Create gradient
                const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
                gradient.addColorStop(0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
                gradient.addColorStop(0.4, 'rgba(255,255,255,0.3)');
                gradient.addColorStop(1, 'rgba(255,255,255,0)');
                
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 32, 32);
                
                const texture = new THREE.CanvasTexture(canvas);
                return texture;
            }
            
            update(deltaTime, mouseX, mouseY) {
                this.time += deltaTime;
                
                // Parallax movement based on mouse
                const parallaxX = mouseX * this.speed * 0.1;
                const parallaxY = mouseY * this.speed * 0.1;
                
                // Update positions for parallax
                for (let i = 0; i < this.positions.length / 3; i++) {
                    // Gentle drift
                    this.positions[i * 3] += Math.sin(this.time * 0.1 + i) * this.speed * deltaTime * 0.1;
                    this.positions[i * 3 + 1] += Math.cos(this.time * 0.1 + i) * this.speed * deltaTime * 0.05;
                    
                    // Wrap around edges
                    if (this.positions[i * 3] > 25) this.positions[i * 3] = -25;
                    if (this.positions[i * 3] < -25) this.positions[i * 3] = 25;
                    if (this.positions[i * 3 + 1] > 20) this.positions[i * 3 + 1] = -20;
                    if (this.positions[i * 3 + 1] < -20) this.positions[i * 3 + 1] = 20;
                    
                    // Twinkle effect
                    const twinkle = Math.sin(this.time * 3 + this.twinklePhases[i]) * 0.3 + 0.7;
                    this.sizes[i] = this.baseSizes[i] * twinkle;
                }
                
                // Apply parallax to entire layer
                this.points.position.x = parallaxX;
                this.points.position.y = parallaxY;
                
                // Update buffers
                this.points.geometry.attributes.position.needsUpdate = true;
                this.points.geometry.attributes.size.needsUpdate = true;
            }
        }
        
        // Game Board Setup
        function createGameBoard() {
            // Create multi-layer starfield
            gameState.starfieldLayers = [
                new StarfieldLayer(100, 2.0, 0.5, 20),  // Far background
                new StarfieldLayer(75, 1.5, 1.0, 15),   // Middle layer

            // Add nebula/dust clouds for depth

            });

            scene.add(nebula);

            // Add heat haze distortion effect

                `,

                    varying vec2 vUv;
                    
                    void main() {
                        vec2 distortion = vec2(
                            sin(vUv.y * 10.0 + time * 0.5) * distortionStrength,
                            cos(vUv.x * 10.0 + time * 0.3) * distortionStrength
                        );
                        
                        float alpha = 0.05 * (0.5 + 0.5 * sin(time * 0.2));
                        gl_FragColor = vec4(0.5, 0.5, 1.0, alpha);
                    }
                `,
                transparent: true,

            const heatHaze = new THREE.Mesh(heatHazeGeometry, heatHazeMaterial);

            // Add shooting stars
            class ShootingStar {
                constructor() {

                }

                    this.position = new THREE.Vector3(
                        (Math.random() - 0.5) * 60,
                        10 + Math.random() * 20,
                        -15 - Math.random() * 5
                    );
                    this.velocity = new THREE.Vector3(
                        (Math.random() - 0.5) * 20,
                        -10 - Math.random() * 10,
                        0
                    );
                    this.life = 1.0;
                    this.trail = [];
                    
                    // Create shooting star mesh
                    const geometry = new THREE.SphereGeometry(0.2, 8, 8);
                    const material = new THREE.MeshBasicMaterial({
                        color: 0xffffff,
                        transparent: true,
                        opacity: 1
                    });
                    
                    if (this.mesh) {
                        this.mesh.geometry.dispose();
                        this.mesh.material.dispose();
                        scene.remove(this.mesh);
                    }
                    
                    this.mesh = new THREE.Mesh(geometry, material);
                    this.mesh.position.copy(this.position);
                    scene.add(this.mesh);
                    
                    // Create trail
                    const trailGeometry = new THREE.BufferGeometry();
                    const trailPositions = new Float32Array(30 * 3);
                    trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
                    
                    const trailMaterial = new THREE.LineBasicMaterial({
                        color: 0xaaccff,
                        transparent: true,

                    });
                    
                    if (this.trailMesh) {
                        this.trailMesh.geometry.dispose();

                    }
                    
                    this.trailMesh = new THREE.Line(trailGeometry, trailMaterial);
                    scene.add(this.trailMesh);
                }
                
                update(deltaTime) {
                    this.position.add(this.velocity.clone().multiplyScalar(deltaTime));
                    this.mesh.position.copy(this.position);
                    
                    // Update trail
                    this.trail.unshift(this.position.clone());
                    if (this.trail.length > 10) {
                        this.trail.pop();
                    }
                    
                    const positions = this.trailMesh.geometry.attributes.position.array;
                    for (let i = 0; i < this.trail.length; i++) {
                        positions[i * 3] = this.trail[i].x;
                        positions[i * 3 + 1] = this.trail[i].y;
                        positions[i * 3 + 2] = this.trail[i].z;
                    }
                    this.trailMesh.geometry.attributes.position.needsUpdate = true;
                    
                    // Fade out
                    this.life -= deltaTime * 0.5;
                    this.mesh.material.opacity = this.life;
                    this.trailMesh.material.opacity = this.life * 0.6;

                destroy() {

            // Create a few shooting stars

            // Create nebula texture
            function createNebulaTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                
                // Create multiple gradients for nebula effect
                const gradient1 = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
                gradient1.addColorStop(0, 'rgba(100, 50, 200, 0.2)');
                gradient1.addColorStop(0.5, 'rgba(50, 30, 150, 0.1)');
                gradient1.addColorStop(1, 'rgba(0, 0, 0, 0)');
                
                ctx.fillStyle = gradient1;
                ctx.fillRect(0, 0, 512, 512);
                
                const gradient2 = ctx.createRadialGradient(384, 384, 0, 384, 384, 150);
                gradient2.addColorStop(0, 'rgba(200, 50, 100, 0.2)');
                gradient2.addColorStop(0.5, 'rgba(150, 30, 50, 0.1)');
                gradient2.addColorStop(1, 'rgba(0, 0, 0, 0)');
                
                ctx.fillStyle = gradient2;
                ctx.fillRect(0, 0, 512, 512);
                
                // Add some noise
                for (let i = 0; i < 100; i++) {
                    const x = Math.random() * 512;
                    const y = Math.random() * 512;
                    const radius = Math.random() * 50 + 10;
                    const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
                    gradient.addColorStop(0, `rgba(${Math.random() * 100 + 100}, ${Math.random() * 100 + 50}, ${Math.random() * 100 + 150}, 0.1)`);
                    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
                }
                
                const texture = new THREE.CanvasTexture(canvas);
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                return texture;
            }
            
            // Create walls
            const wallGeometry = new THREE.PlaneGeometry(0.5, 20);
            const wallMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x001133,
                metalness: 0.8,
                roughness: 0.2,
                transparent: true,
                opacity: 0.8,
                side: THREE.DoubleSide
            });
            
            const leftWall = new THREE.Mesh(wallGeometry, wallMaterial);
            leftWall.position.set(-6, 0, -1);
            leftWall.rotation.y = Math.PI / 2;
            scene.add(leftWall);
            
            const rightWall = new THREE.Mesh(wallGeometry, wallMaterial);
            rightWall.position.set(6, 0, -1);
            rightWall.rotation.y = Math.PI / 2;
            scene.add(rightWall);
            
            // Create ceiling
            const ceilingGeometry = new THREE.PlaneGeometry(12, 0.5);
            const ceiling = new THREE.Mesh(ceilingGeometry, wallMaterial);
            ceiling.position.set(0, 7.5, -1);
            scene.add(ceiling);
            
            // Create danger line as energy field
            const dangerFieldGroup = new THREE.Group();
            
            // Main energy field plane
            const dangerGeometry = new THREE.PlaneGeometry(12, 0.5);
            const dangerMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    color: { value: new THREE.Color(0xff0066) }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    uniform vec3 color;
                    varying vec2 vUv;
                    
                    void main() {
                        float wave = sin(vUv.x * 10.0 + time * 2.0) * 0.5 + 0.5;
                        float pulse = sin(time * 3.0) * 0.3 + 0.7;
                        float edge = 1.0 - abs(vUv.y - 0.5) * 2.0;
                        
                        vec3 fieldColor = mix(color, vec3(1.0, 0.0, 0.3), wave);

                transparent: true,

            const dangerField = new THREE.Mesh(dangerGeometry, dangerMaterial);
            dangerField.position.set(0, CONFIG.DANGER_LINE, 0);
            dangerFieldGroup.add(dangerField);
            
            // Add energy particles

            const particleSizes = new Float32Array(particleCount);
            
            for (let i = 0; i < particleCount; i++) {

                particlePositions[i * 3 + 1] = CONFIG.DANGER_LINE + (Math.random() - 0.5) * 0.5;
                particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 2;
                particleSizes[i] = Math.random() * 0.1 + 0.05;
            }
            
            particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            particleGeometry.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));

            scene.add(dangerFieldGroup);

            // Animate danger field
            const animateDangerField = () => {
                dangerMaterial.uniforms.time.value = Date.now() * 0.001;
                
                // Move particles
                const positions = dangerParticles.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    positions[i * 3] += (Math.random() - 0.5) * 0.02;
                    if (positions[i * 3] > 6) positions[i * 3] = -6;
                    if (positions[i * 3] < -6) positions[i * 3] = 6;
                }
                dangerParticles.geometry.attributes.position.needsUpdate = true;
                
                requestAnimationFrame(animateDangerField);
            };
            animateDangerField();
            
            // Initialize bubble grid
            for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {

                    gameState.bubbleGrid[y][x] = null;
                }

        // Create initial bubbles
        function createInitialBubbles() {
            const rows = 5;
            for (let y = 0; y < rows; y++) {
                const isOddRow = y % 2 === 1;
                const bubblesInRow = isOddRow ? CONFIG.GRID_WIDTH - 1 : CONFIG.GRID_WIDTH;
                
                for (let x = 0; x < bubblesInRow; x++) {
                    if (Math.random() > 0.3) { // 70% chance to place a bubble
                        const color = CONFIG.BUBBLE_COLORS[Math.floor(Math.random() * CONFIG.BUBBLE_COLORS.length)];
                        const xPos = (x - CONFIG.GRID_WIDTH / 2 + 0.5) * CONFIG.HEX_WIDTH + (isOddRow ? CONFIG.HEX_WIDTH / 2 : 0);
                        const yPos = 6 - y * CONFIG.HEX_HEIGHT;
                        
                        const bubble = new Bubble(xPos, yPos, color);
                        scene.add(bubble.mesh);
                        gameState.bubbleGrid[y][x] = bubble;
                        bubble.gridX = x;
                        bubble.gridY = y;
                        
                        // Apply power-up with lower rate for initial bubbles
                        if (Math.random() < 0.05) { // 5% chance for initial bubbles

                }

        // Create shooting bubble

        // Update next bubble display
        function updateNextBubbleDisplay() {
            const nextBubbleDiv = document.getElementById('nextBubble');
            const color = `#${gameState.nextBubbleColor.toString(16).padStart(6, '0')}`;
            nextBubbleDiv.style.background = `radial-gradient(circle at 30% 30%, ${color}88, ${color}44)`;

        // Shooting mechanics
        function shootBubble(power) {
            if (!gameState.currentBubble || gameState.currentBubble.isMoving || gameState.isGameOver) return;
            
            
            // Prevent shooting backwards or below a certain angle
            const direction = new THREE.Vector3(
                gameState.mousePosition.x - gameState.currentBubble.position.x,
                gameState.mousePosition.y - gameState.currentBubble.position.y,
                0
            );
            
            // Minimum upward angle requirement
            if (direction.y < 0.3) return; // Don't allow shooting too low
            
            direction.normalize();
            
            const speed = CONFIG.SHOOTING_SPEED + (CONFIG.MAX_SHOOTING_SPEED - CONFIG.SHOOTING_SPEED) * power;
            gameState.currentBubble.velocity = direction.multiplyScalar(speed);
            gameState.currentBubble.isMoving = true;
            
            // Create shooting trail
            createShootingTrail(gameState.currentBubble);
            
            // Play shooting sound effect (visual feedback instead)
            createShootingEffect(gameState.currentBubble.position.clone());
        }
        
        // Create shooting effect
        function createShootingEffect(position) {
            for (let i = 0; i < 8; i++) {
                const particle = new Particle(
                    position.x,
                    position.y,
                    position.z,
                    0x00ffff,
                    0.15
                );
                const angle = (Math.PI * 2 * i) / 8;
                particle.velocity = new THREE.Vector3(
                    Math.cos(angle) * 3,
                    Math.sin(angle) * 3,
                    0
                );
                particle.decay = 0.04;
                gameState.particles.push(particle);
            }
        }
        
        // Create shooting trail effect
        function createShootingTrail(bubble) {
            const trailInterval = setInterval(() => {
                if (!bubble.isMoving) {
                    clearInterval(trailInterval);
                    return;
                }
                
                const particle = new Particle(
                    bubble.position.x,
                    bubble.position.y,
                    bubble.position.z,
                    bubble.color,
                    0.2
                );
                particle.decay = 0.05;
                gameState.particles.push(particle);
            }, 50);
        }
        
        // Calculate trajectory
        function calculateTrajectory() {
            if (!gameState.currentBubble || gameState.currentBubble.isMoving || gameState.isPaused) return;
            
            gameState.trajectory = [];
            const startPos = gameState.currentBubble.position.clone();
            const direction = new THREE.Vector3(
                gameState.mousePosition.x - startPos.x,
                gameState.mousePosition.y - startPos.y,
                0
            );
            
            // Check minimum angle
            if (direction.y < 0.3) {
                // Don't show trajectory for invalid angles
                return;
            }
            
            direction.normalize();
            
            let pos = startPos.clone();
            let vel = direction.multiplyScalar(CONFIG.SHOOTING_SPEED);
            const step = 0.05; // Smaller steps for smoother trajectory
            const maxSteps = gameState.precisionAimActive ? 500 : 200; // Extended trajectory for precision aim
            let bounceCount = 0;
            const maxBounces = gameState.precisionAimActive ? 5 : 2; // Show more bounces with precision aim
            
            for (let i = 0; i < maxSteps; i++) {
                pos = pos.add(vel.clone().multiplyScalar(step));
                
                // Check wall bounce
                if (Math.abs(pos.x) > 5.5 - CONFIG.BUBBLE_RADIUS) {
                    vel.x *= -1;
                    pos.x = Math.sign(pos.x) * (5.5 - CONFIG.BUBBLE_RADIUS);
                    bounceCount++;
                    
                    // Stop if we've reached max bounces (unless precision aim is active)
                    if (bounceCount >= maxBounces && !gameState.precisionAimActive) {
                        break;
                    }
                }
                
                gameState.trajectory.push(pos.clone());
                
                // Stop at ceiling or when hitting bubbles
                if (pos.y > 6.5) break;
                
                // Check collision with existing bubbles
                let hitBubble = false;
                for (let y = 0; y < CONFIG.GRID_HEIGHT && !hitBubble; y++) {
                    const isOddRow = y % 2 === 1;
                    const bubblesInRow = isOddRow ? CONFIG.GRID_WIDTH - 1 : CONFIG.GRID_WIDTH;
                    
                    for (let x = 0; x < bubblesInRow; x++) {
                        const bubble = gameState.bubbleGrid[y][x];
                        if (bubble) {
                            const distance = pos.distanceTo(bubble.position);
                            if (distance < CONFIG.BUBBLE_RADIUS * 1.8) {
                                hitBubble = true;
                                break;
                            }
                        }
                    }
                }
                
                if (hitBubble) break;
            }
        }
        
        // Render trajectory
        function renderTrajectory() {
            // Remove old trajectory
            const oldTrajectory = scene.getObjectByName('trajectoryGroup');
            if (oldTrajectory) {
                oldTrajectory.children.forEach(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                });
                scene.remove(oldTrajectory);
            }
            
            if (gameState.trajectory.length < 2 || !gameState.currentBubble) return;
            
            const trajectoryGroup = new THREE.Group();
            trajectoryGroup.name = 'trajectoryGroup';
            
            // Create glowing dots along the trajectory
            const dotCount = Math.min(gameState.trajectory.length, gameState.precisionAimActive ? 60 : 30);
            const spacing = Math.floor(gameState.trajectory.length / dotCount);
            
            for (let i = 0; i < dotCount; i++) {
                const index = i * spacing;
                if (index >= gameState.trajectory.length) break;
                
                const point = gameState.trajectory[index];
                const size = 0.05 + (i / dotCount) * 0.1; // Dots get bigger along the path
                const opacity = 0.3 + (i / dotCount) * 0.4; // Fade in along the path
                
                const dotGeometry = new THREE.SphereGeometry(size, 8, 8);
                const trajectoryColor = gameState.precisionAimActive ? 0x00ffff : gameState.currentBubble.color;
                const dotMaterial = new THREE.MeshStandardMaterial({
                    color: trajectoryColor,
                    transparent: true,
                    opacity: opacity,
                    emissive: trajectoryColor,
                    emissiveIntensity: gameState.precisionAimActive ? 3 : 2
                });
                
                const dot = new THREE.Mesh(dotGeometry, dotMaterial);
                dot.position.copy(point);
                
                // Add glow effect
                const glowGeometry = new THREE.SphereGeometry(size * 2, 8, 8);
                const glowMaterial = new THREE.MeshStandardMaterial({
                    color: trajectoryColor,
                    transparent: true,
                    opacity: opacity * 0.3,
                    emissive: trajectoryColor,
                    emissiveIntensity: 1
                });
                
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                glow.position.copy(point);
                
                trajectoryGroup.add(glow);
                trajectoryGroup.add(dot);
            }
            
            scene.add(trajectoryGroup);
        }
        
        // Bubble collision detection
        function checkBubbleCollisions() {
            if (!gameState.currentBubble || !gameState.currentBubble.isMoving) return;
            
            const current = gameState.currentBubble;
            
            // Check grid bubbles
            for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                const isOddRow = y % 2 === 1;
                const bubblesInRow = isOddRow ? CONFIG.GRID_WIDTH - 1 : CONFIG.GRID_WIDTH;
                
                for (let x = 0; x < bubblesInRow; x++) {
                    const bubble = gameState.bubbleGrid[y][x];
                    if (!bubble) continue;
                    
                    const distance = current.position.distanceTo(bubble.position);
                    // Use slightly less than 2 radii to ensure proper contact
                    if (distance < CONFIG.BUBBLE_RADIUS * 1.8) {
                        attachBubble(current);
                        return;
                    }
                }
            }
            
            // Check if bubble reached the ceiling
            if (current.position.y > 6.5 - CONFIG.BUBBLE_RADIUS) {
                attachBubble(current);
            }
        }
        
        // Attach bubble to grid
        function attachBubble(bubble) {
            bubble.isMoving = false;
            bubble.velocity.set(0, 0, 0);
            
            // Find nearest valid grid position
            let bestDistance = Infinity;
            let bestX = -1;
            let bestY = -1;
            let fallbackX = -1;
            let fallbackY = -1;
            let fallbackDistance = Infinity;
            
            // Check all possible attachment points
            for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                const isOddRow = y % 2 === 1;
                const bubblesInRow = isOddRow ? CONFIG.GRID_WIDTH - 1 : CONFIG.GRID_WIDTH;
                
                for (let x = 0; x < bubblesInRow; x++) {
                    // Skip if position is occupied
                    if (gameState.bubbleGrid[y][x]) continue;
                    
                    // Calculate world position for this grid cell
                    const xPos = (x - CONFIG.GRID_WIDTH / 2 + 0.5) * CONFIG.HEX_WIDTH + (isOddRow ? CONFIG.HEX_WIDTH / 2 : 0);
                    const yPos = 6 - y * CONFIG.HEX_HEIGHT;
                    
                    const distance = Math.sqrt(
                        Math.pow(bubble.position.x - xPos, 2) + 
                        Math.pow(bubble.position.y - yPos, 2)
                    );
                    
                    // Track closest empty position as fallback
                    if (distance < fallbackDistance) {
                        fallbackDistance = distance;
                        fallbackX = x;
                        fallbackY = y;
                    }
                    
                    // Check if this position has adjacent bubbles
                    let hasAdjacent = false;
                    const neighbors = getNeighbors(x, y);
                    for (let neighbor of neighbors) {
                        if (neighbor) {
                            hasAdjacent = true;
                            break;
                        }
                    }
                    
                    // For top row, always allow attachment
                    if (y === 0) hasAdjacent = true;
                    
                    if (hasAdjacent && distance < bestDistance) {
                        bestDistance = distance;
                        bestX = x;
                        bestY = y;
                    }
                }
            }
            
            // Use best position if found, otherwise use fallback
            let finalX = bestX;
            let finalY = bestY;
            
            if (finalX === -1) {
                // No valid position with neighbors found, use closest empty position
                finalX = fallbackX;
                finalY = fallbackY;
            }
            
            if (finalX !== -1 && finalY !== -1) {
                // Snap to position
                const isOddRow = finalY % 2 === 1;
                bubble.position.x = (finalX - CONFIG.GRID_WIDTH / 2 + 0.5) * CONFIG.HEX_WIDTH + (isOddRow ? CONFIG.HEX_WIDTH / 2 : 0);
                bubble.position.y = 6 - finalY * CONFIG.HEX_HEIGHT;
                bubble.gridX = finalX;
                bubble.gridY = finalY;
                bubble.mesh.position.copy(bubble.position);
                
                gameState.bubbleGrid[finalY][finalX] = bubble;
                
                // Create attachment effect
                createAttachmentEffect(bubble);
                
                // Check for matches
                checkMatches(bubble);
                
                // Check game over
                if (finalY >= CONFIG.GRID_HEIGHT - 2) {
                    gameOver();
                } else {
                    // Create new bubble
                    setTimeout(() => createShootingBubble(), 500);
                }
            }
        }
        
        // Create attachment effect
        function createAttachmentEffect(bubble) {
            // Trigger connection bounce animation
            bubble.connectionAnimating = 1.0;
            
            // Animate neighboring bubbles too
            const neighbors = getNeighbors(bubble.gridX, bubble.gridY);
            neighbors.forEach(neighbor => {
                if (neighbor) {
                    neighbor.connectionAnimating = 0.5; // Less intense for neighbors
                }
            });
            
            // Create attachment particles
            for (let i = 0; i < 15; i++) {
                const particle = new Particle(
                    bubble.position.x,
                    bubble.position.y,
                    bubble.position.z,
                    0xffffff,
                    0.15
                );
                particle.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 5,
                    (Math.random() - 0.5) * 5,
                    (Math.random() - 0.5) * 3
                );
                gameState.particles.push(particle);
            }
        }
        
        // Check for matches
        function checkMatches(bubble) {
            // Check if bubble is a power-up and activate it
            if (bubble.isPowerUp) {
                handlePowerUpActivation(bubble);
                return;
            }
            
            const matches = findConnectedBubbles(bubble);
            
            if (matches.length >= 3) {
                // Remove matched bubbles
                let points = matches.length * 10;
                const comboMultiplier = Math.min(gameState.combo + 1, 5);
                points *= comboMultiplier;
                
                updateScore(points);
                updateCombo();
                
                // Show mega clear text for large matches
                if (matches.length >= 7) {
                    visualTextDisplay.showEffectText('megaClear');
                }
                
                // Create floating score at center of match group
                const centerX = matches.reduce((sum, b) => sum + b.position.x, 0) / matches.length;
                const centerY = matches.reduce((sum, b) => sum + b.position.y, 0) / matches.length;
                createFloatingScore(new THREE.Vector3(centerX, centerY, 0), points);
                
                matches.forEach((matchedBubble, index) => {
                    setTimeout(() => {
                        removeBubble(matchedBubble);
                        // Use enhanced explosion for large matches
                        createExplosionEffect(matchedBubble, matches.length >= 5);
                    }, index * 50);
                });
                
                // Check for floating bubbles
                setTimeout(() => {
                    removeFloatingBubbles();
                    
                    // Check victory condition
                    setTimeout(() => checkVictory(), 500);
                }, matches.length * 50 + 100);
            } else {
                gameState.combo = 0;
            }
        }
        
        // Handle power-up activation
        function handlePowerUpActivation(bubble) {
            // Use the PowerUpSystem to handle all power-up activations
            const activated = gameManager.powerUpSystem.activatePowerUp(bubble, gameState, gameManager);
            
            if (activated) {
                console.log(`Power-up ${bubble.powerUpType} activated successfully`);
            } else {
                // Fallback for legacy power-ups (rainbow and bomb) if needed
                if (bubble.powerUpType === 'rainbow') {
                    // Rainbow bubble matches all adjacent bubbles
                    const neighbors = getNeighbors(bubble.gridX, bubble.gridY);
                    const bubblesRemoved = [bubble];
                    
                    neighbors.forEach(neighbor => {
                        if (neighbor && !neighbor.isPowerUp) {
                            bubblesRemoved.push(neighbor);
                            // Find all connected bubbles of the same color
                            const connected = findConnectedBubbles(neighbor);
                            connected.forEach(b => {
                                if (!bubblesRemoved.includes(b)) {
                                    bubblesRemoved.push(b);
                                }
                            });
                        }
                    });
                    
                    // Remove all affected bubbles
                    let points = bubblesRemoved.length * 20; // Double points for rainbow
                    updateScore(points);
                    updateCombo();
                    
                    createFloatingScore(bubble.position, points);
                    
                    bubblesRemoved.forEach((b, index) => {
                        setTimeout(() => {
                            removeBubble(b);
                            // Enhanced explosion for rainbow power-up
                            createExplosionEffect(b, true);
                        }, index * 30);
                    });
                    
                    // Check for floating bubbles
                    setTimeout(() => {
                        removeFloatingBubbles();
                    }, bubblesRemoved.length * 30 + 100);
                    
                } else if (bubble.powerUpType === 'bomb') {
                    // Bomb bubble destroys 3x3 area
                    const bombRadius = 1.5; // Distance to check for 3x3 grid
                    const destroyed = [bubble];
                
                // Find all bubbles within explosion radius
                for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                    for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
                        const target = gameState.bubbleGrid[y][x];
                        if (target && target !== bubble) {
                            const distance = bubble.position.distanceTo(target.position);
                            if (distance <= bombRadius * CONFIG.HEX_WIDTH) {
                                destroyed.push(target);
                            }
                        }
                    }
                }
                
                // Create explosion effect
                const explosionLight = new THREE.PointLight(0xff0000, 5, 10);
                explosionLight.position.copy(bubble.position);
                scene.add(explosionLight);
                
                // Fade out explosion light
                let explosionIntensity = 5;
                const explosionFade = setInterval(() => {
                    explosionIntensity -= 0.5;
                    explosionLight.intensity = explosionIntensity;
                    if (explosionIntensity <= 0) {
                        scene.remove(explosionLight);
                        clearInterval(explosionFade);
                    }
                }, 50);
                
                // Remove destroyed bubbles with explosion effect
                let points = destroyed.length * 30; // Triple points for bomb
                updateScore(points);
                updateCombo();
                
                createFloatingScore(bubble.position, points);
                
                destroyed.forEach((b, index) => {
                    setTimeout(() => {
                        removeBubble(b);
                        createExplosionEffect(b, true); // Enhanced explosion
                    }, index * 20);
                });
                
                // Play multiple crunchy sounds for bomb explosion
                if (audioSystem.isInitialized) {
                    audioSystem.playSound('crunchy_pop', 1.0);
                }
                
                // Check for floating bubbles
                setTimeout(() => {
                    removeFloatingBubbles();
                }, destroyed.length * 20 + 100);
                } else if (bubble.powerUpType === 'lightning') {
                    // Lightning is handled by the event system
                    gameManager.powerUpSystem.activatePowerUp(bubble, gameState, gameManager);
                    // Don't create new bubble here - it's handled in the lightning execution
                    return;
                } else if (bubble.powerUpType === 'precision') {
                    // Precision aim is activated immediately
                    gameManager.powerUpSystem.activatePowerUp(bubble, gameState, gameManager);
                    // Continue normal flow - create new bubble after
                }
                
                // Create new bubble after power-up activation (except for lightning which handles it)
                if (bubble.powerUpType !== 'lightning') {
                    setTimeout(() => createShootingBubble(), 500);
                }
            }
        }
        
        // Check victory condition
        function checkVictory() {
            let hasAnyBubbles = false;
            
            for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
                    if (gameState.bubbleGrid[y][x]) {
                        hasAnyBubbles = true;
                        break;
                    }
                }
                if (hasAnyBubbles) break;
            }
            
            if (!hasAnyBubbles && !gameState.isGameOver) {
                // Victory! Add bonus points and new rows
                const victoryBonus = 1000 * gameState.level;
                updateScore(victoryBonus);
                createFloatingScore(new THREE.Vector3(0, 0, 0), victoryBonus);
                
                // Show victory text
                visualTextDisplay.showEffectText('victory');
                
                // Play victory sound (multiple plinks in sequence)
                if (audioSystem.isInitialized) {
                    for (let i = 0; i < 5; i++) {
                        setTimeout(() => {
                            audioSystem.playSound('plink', 0.8);
                        }, i * 100);
                    }
                }
                
                // Create celebration effect
                for (let i = 0; i < 50; i++) {
                    setTimeout(() => {
                        const particle = new Particle(
                            (Math.random() - 0.5) * 10,
                            (Math.random() - 0.5) * 10,
                            0,
                            CONFIG.BUBBLE_COLORS[Math.floor(Math.random() * CONFIG.BUBBLE_COLORS.length)],
                            0.3
                        );
                        particle.velocity = new THREE.Vector3(
                            (Math.random() - 0.5) * 15,
                            Math.random() * 10 + 5,
                            (Math.random() - 0.5) * 5
                        );
                        particle.decay = 0.015;
                        gameState.particles.push(particle);
                    }, i * 20);
                }
                
                // Add new rows after celebration
                setTimeout(() => {
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => addNewRow(), i * 200);
                    }
                }, 1500);
            }
        }
        
        // Find connected bubbles of same color
        function findConnectedBubbles(startBubble) {
            const connected = [];
            const visited = new Set();
            const queue = [startBubble];
            const targetColor = startBubble.color;
            
            while (queue.length > 0) {
                const current = queue.shift();
                const key = `${current.gridX},${current.gridY}`;
                
                if (visited.has(key)) continue;
                visited.add(key);
                
                if (current.color === targetColor) {
                    connected.push(current);
                    
                    // Check neighbors
                    const neighbors = getNeighbors(current.gridX, current.gridY);
                    neighbors.forEach(neighbor => {
                        if (neighbor && !visited.has(`${neighbor.gridX},${neighbor.gridY}`)) {
                            queue.push(neighbor);
                        }
                    });
                }
            }
            
            return connected;
        }
        
        // Get neighboring bubbles
        function getNeighbors(x, y) {
            const neighbors = [];
            const isOddRow = y % 2 === 1;
            
            // Hexagonal grid neighbors
            const directions = isOddRow ? [
                [-1, 0], [1, 0],   // Left, Right
                [0, -1], [1, -1],  // Top-left, Top-right (for odd rows)
                [0, 1], [1, 1]     // Bottom-left, Bottom-right (for odd rows)
            ] : [
                [-1, 0], [1, 0],   // Left, Right
                [-1, -1], [0, -1], // Top-left, Top-right (for even rows)
                [-1, 1], [0, 1]    // Bottom-left, Bottom-right (for even rows)
            ];
            
            directions.forEach(([dx, dy]) => {
                const nx = x + dx;
                const ny = y + dy;
                
                if (ny >= 0 && ny < CONFIG.GRID_HEIGHT) {
                    const isNeighborOddRow = ny % 2 === 1;
                    const maxX = isNeighborOddRow ? CONFIG.GRID_WIDTH - 1 : CONFIG.GRID_WIDTH;
                    
                    if (nx >= 0 && nx < maxX && gameState.bubbleGrid[ny][nx]) {
                        neighbors.push(gameState.bubbleGrid[ny][nx]);
                    }
                }
            });
            
            return neighbors;
        }
        
        // Remove floating bubbles
        function removeFloatingBubbles() {
            const connected = new Set();
            
            // Find all bubbles connected to ceiling
            for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
                if (gameState.bubbleGrid[0][x]) {
                    findAllConnected(gameState.bubbleGrid[0][x], connected);
                }
            }
            
            // Remove bubbles not connected to ceiling
            let floatingCount = 0;
            let floatingBubbles = [];
            
            for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
                    const bubble = gameState.bubbleGrid[y][x];
                    if (bubble && !connected.has(bubble)) {
                        floatingCount++;
                        floatingBubbles.push(bubble);
                        setTimeout(() => {
                            removeBubble(bubble);
                            createFloatingEffect(bubble);
                        }, floatingCount * 30);
                        
                        // Play plink sound for each floating bubble
                        if (audioSystem.isInitialized && floatingCount <= 10) {
                            setTimeout(() => {
                                audioSystem.playSound('plink', 0.4);
                            }, floatingCount * 30);
                        }
                    }
                }
            }
            
            if (floatingCount > 0) {
                const floatingPoints = floatingCount * 20 * Math.min(gameState.combo + 1, 5);
                updateScore(floatingPoints);
                
                // Show floating score effect
                if (floatingBubbles.length > 0) {
                    const centerX = floatingBubbles.reduce((sum, b) => sum + b.position.x, 0) / floatingBubbles.length;
                    const centerY = floatingBubbles.reduce((sum, b) => sum + b.position.y, 0) / floatingBubbles.length;
                    setTimeout(() => {
                        createFloatingScore(new THREE.Vector3(centerX, centerY, 0), floatingPoints);
                    }, floatingCount * 15);
                }
                
                // Show visual text for significant floating clears
                if (floatingCount >= 5) {
                    visualTextDisplay.showEffectText('floatingClear', floatingCount);
                    // Play crunchy sound for large floating clears
                    if (audioSystem.isInitialized) {
                        audioSystem.playSound('crunchy_pop', 0.7);
                    }
                }
            }
        }
        
        // Find all connected bubbles
        function findAllConnected(startBubble, connected) {
            const queue = [startBubble];
            
            while (queue.length > 0) {
                const current = queue.shift();
                if (connected.has(current)) continue;
                
                connected.add(current);
                
                const neighbors = getNeighbors(current.gridX, current.gridY);
                neighbors.forEach(neighbor => {
                    if (!connected.has(neighbor)) {
                        queue.push(neighbor);
                    }
                });
            }
        }
        
        // Remove bubble
        function removeBubble(bubble) {
            gameState.bubbleGrid[bubble.gridY][bubble.gridX] = null;
            
            // Animate removal
            const removeAnimation = {
                bubble: bubble,
                progress: 0,
                update: function(deltaTime) {
                    this.progress += deltaTime * 3;
                    bubble.mesh.scale.setScalar(1 - this.progress);
                    bubble.mesh.rotation.x += 0.3;
                    bubble.mesh.rotation.y += 0.2;
                    bubble.material.opacity = 1 - this.progress;
                    
                    if (this.progress >= 1) {
                        bubble.destroy();
                        return false;
                    }
                    return true;
                }
            };
            
            gameState.animations.push(removeAnimation);
        }
        
        // Create explosion effect
        function createExplosionEffect(bubble, enhanced = false) {
            const particleCount = enhanced ? CONFIG.PARTICLE_COUNT * 2 : CONFIG.PARTICLE_COUNT;
            const particleSize = enhanced ? 0.3 : 0.2;
            const speedMultiplier = enhanced ? 1.5 : 1;
            
            // Play appropriate sound effect
            if (audioSystem.isInitialized) {
                if (enhanced) {
                    // Play crunchy sound for enhanced explosions (bombs, multiple bubbles)
                    audioSystem.playSound('crunchy_pop', 0.8);
                } else {
                    // Play tiny plink for single bubble
                    audioSystem.playSound('plink', 0.6);
                }
            }
            
            for (let i = 0; i < particleCount; i++) {
                const particle = new Particle(
                    bubble.position.x,
                    bubble.position.y,
                    bubble.position.z,
                    enhanced ? 0xff0000 : bubble.color,
                    particleSize
                );
                
                const angle = (Math.PI * 2 * i) / particleCount;
                const speed = (8 + Math.random() * 4) * speedMultiplier;
                particle.velocity = new THREE.Vector3(
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    (Math.random() - 0.5) * 4 * speedMultiplier
                );
                
                gameState.particles.push(particle);
            }
            
            // Add screen shake for bomb explosions
            if (enhanced) {
                gameManager.addScreenShake(0.3, 5);
            }
        }
        
        // Create floating effect
        function createFloatingEffect(bubble) {
            bubble.isFloating = true;
            
            const floatAnimation = {
                bubble: bubble,
                progress: 0,
                update: function(deltaTime) {
                    this.progress += deltaTime;
                    bubble.position.y -= deltaTime * 5;
                    bubble.mesh.position.copy(bubble.position);
                    bubble.mesh.rotation.z += 0.1;
                    bubble.material.opacity = Math.max(0, 1 - this.progress);
                    
                    if (this.progress >= 1) {
                        bubble.destroy();
                        return false;
                    }
                    return true;
                }
            };
            
            gameState.animations.push(floatAnimation);
            
            // Add sparkle particles
            for (let i = 0; i < 10; i++) {
                const particle = new Particle(
                    bubble.position.x,
                    bubble.position.y,
                    bubble.position.z,
                    0xffffff,
                    0.1
                );
                gameState.particles.push(particle);
            }
        }
        
        // Restart game
        function restartGame() {
            // Clear all bubbles
            for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
                    if (gameState.bubbleGrid[y][x]) {
                        gameState.bubbleGrid[y][x].destroy();
                        gameState.bubbleGrid[y][x] = null;
                    }
                }
            }
            
            // Clear particles
            gameState.particles.forEach(particle => particle.destroy());
            gameState.particles = [];
            
            // Reset game state
            gameState.score = 0;
            gameState.level = 1;
            gameState.combo = 0;
            gameState.bestCombo = 0;
            gameState.isGameOver = false;
            gameState.currentBubble = null;
            gameState.shootingPower = 0;
            gameState.isCharging = false;
            gameState.animations = [];
            
            // Update UI
            document.getElementById('scoreValue').textContent = '0';
            document.getElementById('levelValue').textContent = '1';
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('comboDisplay').classList.remove('active');
            
            // Remove trajectory
            const oldTrajectory = scene.getObjectByName('trajectoryGroup');
            if (oldTrajectory) {
                oldTrajectory.children.forEach(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                });
                scene.remove(oldTrajectory);
            }
            
            // Create new game
            createInitialBubbles();
            createShootingBubble();
        }
        
        // Create floating score effect
        function createFloatingScore(position, points) {
            const scoreElement = document.createElement('div');
            scoreElement.className = 'floating-score';
            scoreElement.textContent = '+' + points;
            
            // Convert 3D position to screen coordinates
            const vector = position.clone();
            vector.project(camera);
            
            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (1 - (vector.y * 0.5 + 0.5)) * window.innerHeight;
            
            scoreElement.style.left = x + 'px';
            scoreElement.style.top = y + 'px';
            
            document.body.appendChild(scoreElement);
            
            // Remove after animation
            setTimeout(() => {
                scoreElement.remove();
            }, 1500);
        }
        
        // Update score
        function updateScore(points) {
            gameState.score += points;
            document.getElementById('scoreValue').textContent = gameState.score;
            
            // Check level progression
            const newLevel = Math.floor(gameState.score / 1000) + 1;
            if (newLevel > gameState.level) {
                gameState.level = newLevel;
                document.getElementById('levelValue').textContent = gameState.level;
                addNewRow();
            }
        }
        
        // Update combo
        function updateCombo() {
            gameState.combo++;
            if (gameState.combo > gameState.bestCombo) {
                gameState.bestCombo = gameState.combo;
            }
            
            const comboDisplay = document.getElementById('comboDisplay');
            const comboValue = document.getElementById('comboValue');
            
            comboDisplay.classList.add('active');
            comboValue.textContent = gameState.combo + 1;
            
            // Emit combo event for visual text display
            gameManager.eventBus.emit('comboAchieved', { comboSize: gameState.combo + 1 });
            
            clearTimeout(gameState.comboTimer);
            gameState.comboTimer = setTimeout(() => {
                comboDisplay.classList.remove('active');
                gameState.combo = 0;
            }, CONFIG.COMBO_TIMEOUT);
        }
        
        // Add new row when level increases
        function addNewRow() {
            // Shift all bubbles down
            for (let y = CONFIG.GRID_HEIGHT - 1; y > 0; y--) {
                for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
                    gameState.bubbleGrid[y][x] = gameState.bubbleGrid[y - 1][x];
                    if (gameState.bubbleGrid[y][x]) {
                        gameState.bubbleGrid[y][x].gridY = y;
                        const isOddRow = y % 2 === 1;
                        gameState.bubbleGrid[y][x].position.x = (x - CONFIG.GRID_WIDTH / 2 + 0.5) * CONFIG.HEX_WIDTH + (isOddRow ? CONFIG.HEX_WIDTH / 2 : 0);
                        gameState.bubbleGrid[y][x].position.y = 6 - y * CONFIG.HEX_HEIGHT;
                        gameState.bubbleGrid[y][x].mesh.position.copy(gameState.bubbleGrid[y][x].position);
                    }
                }
            }
            
            // Add new row at top
            const isOddRow = false; // Top row is always even
            const bubblesInRow = CONFIG.GRID_WIDTH;
            
            for (let x = 0; x < bubblesInRow; x++) {
                if (Math.random() > 0.2) { // 80% chance for bubble
                    const color = CONFIG.BUBBLE_COLORS[Math.floor(Math.random() * CONFIG.BUBBLE_COLORS.length)];
                    const xPos = (x - CONFIG.GRID_WIDTH / 2 + 0.5) * CONFIG.HEX_WIDTH;
                    const yPos = 6;
                    
                    const bubble = new Bubble(xPos, yPos, color);
                    bubble.gridX = x;
                    bubble.gridY = 0;
                    scene.add(bubble.mesh);
                    gameState.bubbleGrid[0][x] = bubble;
                } else {
                    gameState.bubbleGrid[0][x] = null;
                }
            }
        }
        
        // Game over
        function gameOver() {
            gameState.isGameOver = true;
            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('finalLevel').textContent = gameState.level;
            document.getElementById('bestCombo').textContent = gameState.bestCombo + 1;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        // Mouse/Touch controls
        function handleMouseMove(event) {
            // Don't process mouse movement if game is paused
            if (gameState.isPaused) return;
            
            const rect = renderer.domElement.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            const y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            const vector = new THREE.Vector3(x, y, 0.5);
            vector.unproject(camera);
            
            const dir = vector.sub(camera.position).normalize();
            const distance = -camera.position.z / dir.z;
            const pos = camera.position.clone().add(dir.multiplyScalar(distance));
            
            gameState.mousePosition.set(pos.x, pos.y);
            
            // Update cursor style based on valid shooting angle
            if (gameState.currentBubble && !gameState.currentBubble.isMoving) {
                const direction = new THREE.Vector3(
                    pos.x - gameState.currentBubble.position.x,
                    pos.y - gameState.currentBubble.position.y,
                    0
                );
                
                if (direction.y < 0.3) {
                    renderer.domElement.style.cursor = 'not-allowed';
                } else {
                    renderer.domElement.style.cursor = 'crosshair';
                }
            }
            
            calculateTrajectory();
        }
        
        function handleMouseDown(event) {
            if (gameState.isGameOver || gameState.isPaused || !gameState.currentBubble || gameState.currentBubble.isMoving) return;
            
            
            gameState.isCharging = true;
            document.getElementById('powerMeter').classList.add('active');
        }
        
        function handleMouseUp(event) {
            if (gameState.isGameOver || gameState.isPaused || !gameState.currentBubble || gameState.currentBubble.isMoving) return;
            
            
            if (gameState.isCharging) {
                // Reset bubble scale
                if (gameState.currentBubble) {
                    gameState.currentBubble.mesh.scale.setScalar(1);
                    gameState.currentBubble.material.emissiveIntensity = 0.1;
                }
                
                shootBubble(gameState.shootingPower);
                gameState.isCharging = false;
                gameState.shootingPower = 0;
                document.getElementById('powerMeter').classList.remove('active');
                document.getElementById('powerFill').style.width = '0%';
            }
        }
        
        // Event listeners
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mousedown', handleMouseDown);
        window.addEventListener('mouseup', handleMouseUp);
        
        window.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            handleMouseMove(touch);
            handleMouseDown(touch);
        });
        
        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            handleMouseMove(touch);
        });
        
        window.addEventListener('touchend', handleMouseUp);
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Animation loop
        let lastTime = 0;
        function animate(currentTime) {
            requestAnimationFrame(animate);
            
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            
            if (!gameState.isGameOver && !gameState.isPaused) {
                // Update current bubble
                if (gameState.currentBubble) {
                    gameState.currentBubble.update(deltaTime);
                    checkBubbleCollisions();
                }
                
                // Update all bubbles and count remaining
                let totalBubbles = 0;
                let bubblesRemaining = 0;
                for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                    const isOddRow = y % 2 === 1;
                    const bubblesInRow = isOddRow ? CONFIG.GRID_WIDTH - 1 : CONFIG.GRID_WIDTH;
                    
                    for (let x = 0; x < bubblesInRow; x++) {
                        if (gameState.bubbleGrid[y][x]) {
                            gameState.bubbleGrid[y][x].update(deltaTime);
                            totalBubbles++;
                            // Count non-power-up bubbles for clear detection
                            if (!gameState.bubbleGrid[y][x].isPowerUp) {
                                bubblesRemaining++;
                            }
                        }
                    }
                }
                
                // Update ambient audio based on game state
                if (audioSystem.isInitialized && !gameState.isGameOver) {
                    // Calculate how close we are to clearing the board
                    const clearPercentage = 1 - (bubblesRemaining / 50); // Assume ~50 bubbles is "full"
                    
                    // Swell ambient audio when close to clearing (less than 10 bubbles or 80% clear)
                    if (bubblesRemaining < 10 || clearPercentage > 0.8) {
                        // Increase volume based on how close to clearing
                        const swellFactor = bubblesRemaining < 10 ?
                            1 - (bubblesRemaining / 10) :
                            (clearPercentage - 0.8) * 5; // Scale 0.8-1.0 to 0-1
                        
                        audioSystem.updateAmbientVolume(swellFactor);
                    } else {
                        // Return to normal volume
                        audioSystem.updateAmbientVolume(0);
                    }
                    
                    audioSystem.update();
                }
                
                // Update particles
                gameState.particles = gameState.particles.filter(particle => {
                    const alive = particle.update(deltaTime);
                    if (!alive) particle.destroy();
                    return alive;
                });
                
                // Update animations
                gameState.animations = gameState.animations.filter(animation => {
                    return animation.update(deltaTime);
                });
                
                // Update game manager (power-ups, screen shake, etc.)
                gameManager.update(deltaTime, camera);
                
                // Update power meter
                if (gameState.isCharging) {
                    gameState.shootingPower = Math.min(gameState.shootingPower + deltaTime * 2, 1);
                    document.getElementById('powerFill').style.width = (gameState.shootingPower * 100) + '%';
                    
                    // Add visual feedback on the current bubble
                    if (gameState.currentBubble) {
                        const scale = 1 + gameState.shootingPower * 0.3;
                        gameState.currentBubble.mesh.scale.setScalar(scale);
                        
                        // Add pulsing glow effect
                        gameState.currentBubble.material.emissiveIntensity = 0.1 + gameState.shootingPower * 0.4;
                    }
                }
                
                // Render trajectory
                renderTrajectory();
            }
            
            // Update starfield
            if (gameState.starfieldLayers) {
                gameState.starfieldLayers.forEach(layer => {
                    layer.update(deltaTime, gameState.mousePosition.x * 0.02, gameState.mousePosition.y * 0.02);
                });
            }
            
            // Animate nebula
            if (gameState.nebula) {
                gameState.nebula.rotation.z = currentTime * 0.00005;
                gameState.nebula.material.opacity = 0.3 + Math.sin(currentTime * 0.0002) * 0.1;
            }
            
            // Update shooting stars
            if (gameState.shootingStars) {
                gameState.shootingStars.forEach(star => {
                    star.update(deltaTime);
                });
            }
            
            // Update heat haze effect
            if (gameState.heatHaze) {
                gameState.heatHaze.material.uniforms.time.value = currentTime * 0.001;
            }
            
            // Animate lights
            rimLight.position.x = Math.sin(currentTime * 0.001) * 10;
            accentLight.position.y = Math.cos(currentTime * 0.0007) * 5;
            
            renderer.render(scene, camera);
        }
        
        // Initialize game
        createGameBoard();
        createInitialBubbles();
        createShootingBubble();
        animate(0);
        
        // Make restart function globally accessible
        window.restartGame = restartGame;
    </script>
</body>
