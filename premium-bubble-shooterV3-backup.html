<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium 3D Bubble Shooter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Orbitron', monospace;
            overflow: hidden;
            background: #000;
            color: #fff;
            user-select: none;
        }
        
        #gameCanvas {
            display: block;
            cursor: crosshair;
        }
        
        .ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
            z-index: 100;
        }
        
        .ui-panel {
            background: rgba(0, 20, 40, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 255, 255, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            pointer-events: auto;
        }
        
        .score-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .score-label {
            font-size: 14px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        
        .score-value {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        
        .combo-display {
            position: absolute;
            top: 120px;
            right: 20px;
            font-size: 24px;
            font-weight: 700;
            color: #ff6b35;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.8);
            opacity: 0;
            transition: all 0.3s ease;
        }
        
        .combo-display.active {
            opacity: 1;
            transform: scale(1.2);
        }
        
        .power-meter {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 20px;
            background: rgba(0, 20, 40, 0.7);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .power-meter.active {
            opacity: 1;
        }
        
        .power-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffff 0%, #ff6b35 100%);
            width: 0%;
            transition: width 0.1s ease;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.8);
        }
        
        .next-bubble {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: rgba(0, 20, 40, 0.7);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 255, 255, 0.3);
        }
        
        .next-label {
            position: absolute;
            top: -25px;
            font-size: 12px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            animation: fadeIn 0.5s ease;
            z-index: 200;
        }
        
        .game-over h2 {
            font-size: 48px;
            font-weight: 900;
            color: #ff6b35;
            text-shadow: 0 0 30px rgba(255, 107, 53, 0.8);
            margin-bottom: 20px;
        }
        
        .game-over p {
            font-size: 24px;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            margin-bottom: 30px;
        }
        
        .restart-btn {
            background: linear-gradient(135deg, #00ffff 0%, #ff6b35 100%);
            border: none;
            border-radius: 30px;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 8px 32px rgba(0, 255, 255, 0.4);
            transition: all 0.3s ease;
            font-family: 'Orbitron', monospace;
        }
        
        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(255, 107, 53, 0.6);
        }
        
        .floating-score {
            position: absolute;
            font-size: 24px;
            font-weight: 900;
            color: #ffff00;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.8);
            pointer-events: none;
            animation: floatUp 1.5s ease-out forwards;
            z-index: 150;
        }
        
        @keyframes floatUp {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-100px);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -60%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-container">
        <div class="ui-panel">
            <div class="score-display">
                <span class="score-label">Score</span>
                <span class="score-value" id="scoreValue">0</span>
            </div>
            <div class="score-display">
                <span class="score-label">Level</span>
                <span class="score-value" id="levelValue">1</span>
            </div>
        </div>
    </div>
    
    <div class="combo-display" id="comboDisplay">
        COMBO x<span id="comboValue">2</span>
    </div>
    
    <div class="power-meter" id="powerMeter">
        <div class="power-fill" id="powerFill"></div>
    </div>
    
    <div class="next-bubble" id="nextBubble">
        <span class="next-label">NEXT</span>
    </div>
    
    <div class="game-over" id="gameOver">
        <h2>GAME OVER</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p style="font-size: 18px; color: #fff; margin-bottom: 10px;">Level Reached: <span id="finalLevel">1</span></p>
        <p style="font-size: 18px; color: #fff; margin-bottom: 30px;">Best Combo: <span id="bestCombo">0</span></p>
        <button class="restart-btn" onclick="restartGame()">PLAY AGAIN</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game Configuration
        const CONFIG = {
            BUBBLE_RADIUS: 0.5,
            GRID_WIDTH: 11,
            GRID_HEIGHT: 14,
            SHOOTING_SPEED: 20,
            MAX_SHOOTING_SPEED: 30,
            WALL_BOUNCE_DAMPING: 0.95,
            HEX_WIDTH: 1.0, // Bubble diameter
            HEX_HEIGHT: 0.866, // sqrt(3)/2 * diameter for hexagonal packing
            BUBBLE_COLORS: [
                0xff0066, // Pink
                0x00ff66, // Green
                0x66ff00, // Lime
                0x00ffff, // Cyan
                0xff6600, // Orange
                0x6600ff, // Purple
                0xffff00, // Yellow
                0xff00ff  // Magenta
            ],
            PARTICLE_COUNT: 30,
            COMBO_TIMEOUT: 2000,
            DANGER_LINE: -5
        };
        
        // Initialize Three.js
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000011, 10, 50);
        
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            100
        );
        camera.position.set(0, 0, 20);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({
            canvas: document.getElementById('gameCanvas'),
            antialias: true,
            alpha: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        
        // Lighting Setup
        const ambientLight = new THREE.AmbientLight(0x222244, 0.5);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(5, 10, 5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 50;
        mainLight.shadow.camera.left = -15;
        mainLight.shadow.camera.right = 15;
        mainLight.shadow.camera.top = 15;
        mainLight.shadow.camera.bottom = -15;
        scene.add(mainLight);
        
        const rimLight = new THREE.PointLight(0x00ffff, 0.5, 30);
        rimLight.position.set(-10, 5, 10);
        scene.add(rimLight);
        
        const accentLight = new THREE.PointLight(0xff6b35, 0.3, 25);
        accentLight.position.set(10, -5, 8);
        scene.add(accentLight);
        
        // Game State
        const gameState = {
            score: 0,
            level: 1,
            combo: 0,
            bestCombo: 0,
            comboTimer: null,
            isGameOver: false,
            currentBubble: null,
            nextBubbleColor: null,
            shootingPower: 0,
            isCharging: false,
            mousePosition: new THREE.Vector2(),
            trajectory: [],
            bubbleGrid: [],
            particles: [],
            animations: []
        };
        
        // Bubble Class
        class Bubble {
            constructor(x, y, color, radius = CONFIG.BUBBLE_RADIUS) {
                this.gridX = -1;
                this.gridY = -1;
                this.position = new THREE.Vector3(x, y, 0);
                this.velocity = new THREE.Vector3(0, 0, 0);
                this.color = color;
                this.radius = radius;
                this.isMoving = false;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;
                
                // Create geometry with high detail
                const geometry = new THREE.IcosahedronGeometry(radius, 2);
                
                // Premium glass-like material
                this.material = new THREE.MeshPhysicalMaterial({
                    color: color,
                    metalness: 0.1,
                    roughness: 0.1,
                    transmission: 0.5,
                    thickness: 0.5,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.0,
                    envMapIntensity: 1.5,
                    ior: 1.5,
                    reflectivity: 0.8,
                    emissive: color,
                    emissiveIntensity: 0.1
                });
                
                this.mesh = new THREE.Mesh(geometry, this.material);
                this.mesh.position.set(x, y, 0);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                
                // Add subtle floating animation
                this.floatOffset = Math.random() * Math.PI * 2;
                this.floatSpeed = 0.5 + Math.random() * 0.5;
            }
            
            update(deltaTime) {
                if (this.isMoving) {
                    // Update position
                    this.position.add(this.velocity.clone().multiplyScalar(deltaTime));
                    this.mesh.position.copy(this.position);
                    
                    // Check wall collisions
                    const wallLimit = 5.5;
                    if (Math.abs(this.position.x) > wallLimit - this.radius) {
                        this.position.x = Math.sign(this.position.x) * (wallLimit - this.radius);
                        this.velocity.x *= -CONFIG.WALL_BOUNCE_DAMPING;
                        this.createWallImpactParticles();
                        
                        // Add wall flash effect
                        const wallFlash = new THREE.PointLight(0x00ffff, 2, 5);
                        wallFlash.position.set(this.position.x, this.position.y, 2);
                        scene.add(wallFlash);
                        
                        // Fade out wall flash
                        const fadeInterval = setInterval(() => {
                            wallFlash.intensity -= 0.1;
                            if (wallFlash.intensity <= 0) {
                                scene.remove(wallFlash);
                                clearInterval(fadeInterval);
                            }
                        }, 50);
                    }
                    
                    // Check ceiling
                    if (this.position.y > 7 - this.radius) {
                        this.position.y = 7 - this.radius;
                        this.velocity.y = 0;
                        this.isMoving = false;
                    }
                }
                
                // Floating animation
                if (!this.isMoving) {
                    const floatY = Math.sin(Date.now() * 0.001 * this.floatSpeed + this.floatOffset) * 0.05;
                    this.mesh.position.y = this.position.y + floatY;
                }
                
                // Rotation
                this.mesh.rotation.x += this.rotationSpeed;
                this.mesh.rotation.y += this.rotationSpeed * 0.7;
            }
            
            createWallImpactParticles() {
                for (let i = 0; i < 10; i++) {
                    const particle = new Particle(
                        this.position.x,
                        this.position.y,
                        this.position.z,
                        this.color,
                        0.1
                    );
                    gameState.particles.push(particle);
                }
            }
            
            destroy() {
                scene.remove(this.mesh);
                this.material.dispose();
                this.mesh.geometry.dispose();
            }
        }
        
        // Particle System
        class Particle {
            constructor(x, y, z, color, size) {
                this.position = new THREE.Vector3(x, y, z);
                this.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 5
                );
                this.life = 1.0;
                this.decay = 0.02;
                
                const geometry = new THREE.SphereGeometry(size, 8, 8);
                const material = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 1.0,
                    emissive: color,
                    emissiveIntensity: 2
                });
                
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.copy(this.position);
                scene.add(this.mesh);
            }
            
            update(deltaTime) {
                this.velocity.y -= 9.8 * deltaTime; // Gravity
                this.position.add(this.velocity.clone().multiplyScalar(deltaTime));
                this.mesh.position.copy(this.position);
                
                this.life -= this.decay;
                this.mesh.material.opacity = this.life;
                this.mesh.scale.setScalar(this.life);
                
                return this.life > 0;
            }
            
            destroy() {
                scene.remove(this.mesh);
                this.mesh.geometry.dispose();
                this.mesh.material.dispose();
            }
        }
        
        // Game Board Setup
        function createGameBoard() {
            // Create background stars
            const starsGeometry = new THREE.BufferGeometry();
            const starPositions = [];
            const starSizes = [];
            
            for (let i = 0; i < 200; i++) {
                starPositions.push(
                    (Math.random() - 0.5) * 40,
                    (Math.random() - 0.5) * 30,
                    -15 - Math.random() * 10
                );
                starSizes.push(0.5 + Math.random() * 1.5);
            }
            
            starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
            starsGeometry.setAttribute('size', new THREE.Float32BufferAttribute(starSizes, 1));
            
            const starsMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 1,
                sizeAttenuation: true,
                transparent: true,
                opacity: 0.8
            });
            
            const stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);
            
            // Create walls
            const wallGeometry = new THREE.PlaneGeometry(0.5, 20);
            const wallMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x001133,
                metalness: 0.8,
                roughness: 0.2,
                transparent: true,
                opacity: 0.8,
                side: THREE.DoubleSide
            });
            
            const leftWall = new THREE.Mesh(wallGeometry, wallMaterial);
            leftWall.position.set(-6, 0, -1);
            leftWall.rotation.y = Math.PI / 2;
            scene.add(leftWall);
            
            const rightWall = new THREE.Mesh(wallGeometry, wallMaterial);
            rightWall.position.set(6, 0, -1);
            rightWall.rotation.y = Math.PI / 2;
            scene.add(rightWall);
            
            // Create ceiling
            const ceilingGeometry = new THREE.PlaneGeometry(12, 0.5);
            const ceiling = new THREE.Mesh(ceilingGeometry, wallMaterial);
            ceiling.position.set(0, 7.5, -1);
            scene.add(ceiling);
            
            // Create danger line
            const dangerGeometry = new THREE.PlaneGeometry(12, 0.2);
            const dangerMaterial = new THREE.MeshBasicMaterial({
                color: 0xff0000,
                transparent: true,
                opacity: 0.8,
                emissive: 0xff0000,
                emissiveIntensity: 2
            });
            const dangerLine = new THREE.Mesh(dangerGeometry, dangerMaterial);
            dangerLine.position.set(0, CONFIG.DANGER_LINE, 0);
            scene.add(dangerLine);
            
            // Animate danger line pulse
            const pulseDangerLine = () => {
                dangerLine.material.opacity = 0.5 + Math.sin(Date.now() * 0.003) * 0.3;
                requestAnimationFrame(pulseDangerLine);
            };
            pulseDangerLine();
            
            // Initialize bubble grid
            for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                gameState.bubbleGrid[y] = [];
                for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
                    gameState.bubbleGrid[y][x] = null;
                }
            }
        }
        
        // Create initial bubbles
        function createInitialBubbles() {
            const rows = 5;
            for (let y = 0; y < rows; y++) {
                const isOddRow = y % 2 === 1;
                const bubblesInRow = isOddRow ? CONFIG.GRID_WIDTH - 1 : CONFIG.GRID_WIDTH;
                
                for (let x = 0; x < bubblesInRow; x++) {
                    if (Math.random() > 0.3) { // 70% chance to place a bubble
                        const color = CONFIG.BUBBLE_COLORS[Math.floor(Math.random() * CONFIG.BUBBLE_COLORS.length)];
                        const xPos = (x - CONFIG.GRID_WIDTH / 2 + 0.5) * CONFIG.HEX_WIDTH + (isOddRow ? CONFIG.HEX_WIDTH / 2 : 0);
                        const yPos = 6 - y * CONFIG.HEX_HEIGHT;
                        
                        const bubble = new Bubble(xPos, yPos, color);
                        scene.add(bubble.mesh);
                        gameState.bubbleGrid[y][x] = bubble;
                        bubble.gridX = x;
                        bubble.gridY = y;
                    }
                }
            }
        }
        
        // Create shooting bubble
        function createShootingBubble() {
            const color = gameState.nextBubbleColor || 
                CONFIG.BUBBLE_COLORS[Math.floor(Math.random() * CONFIG.BUBBLE_COLORS.length)];
            
            const bubble = new Bubble(0, -6, color);
            bubble.isMoving = false;
            scene.add(bubble.mesh);
            gameState.currentBubble = bubble;
            
            // Set next bubble color
            gameState.nextBubbleColor = CONFIG.BUBBLE_COLORS[Math.floor(Math.random() * CONFIG.BUBBLE_COLORS.length)];
            updateNextBubbleDisplay();
        }
        
        // Update next bubble display
        function updateNextBubbleDisplay() {
            const nextBubbleDiv = document.getElementById('nextBubble');
            const color = `#${gameState.nextBubbleColor.toString(16).padStart(6, '0')}`;
            nextBubbleDiv.style.background = `radial-gradient(circle at 30% 30%, ${color}88, ${color}44)`;
            nextBubbleDiv.style.borderColor = color + '88';
        }
        
        // Shooting mechanics
        function shootBubble(power) {
            if (!gameState.currentBubble || gameState.currentBubble.isMoving || gameState.isGameOver) return;
            
            // Prevent shooting backwards or below a certain angle
            const direction = new THREE.Vector3(
                gameState.mousePosition.x - gameState.currentBubble.position.x,
                gameState.mousePosition.y - gameState.currentBubble.position.y,
                0
            );
            
            // Minimum upward angle requirement
            if (direction.y < 0.3) return; // Don't allow shooting too low
            
            direction.normalize();
            
            const speed = CONFIG.SHOOTING_SPEED + (CONFIG.MAX_SHOOTING_SPEED - CONFIG.SHOOTING_SPEED) * power;
            gameState.currentBubble.velocity = direction.multiplyScalar(speed);
            gameState.currentBubble.isMoving = true;
            
            // Create shooting trail
            createShootingTrail(gameState.currentBubble);
            
            // Play shooting sound effect (visual feedback instead)
            createShootingEffect(gameState.currentBubble.position.clone());
        }
        
        // Create shooting effect
        function createShootingEffect(position) {
            for (let i = 0; i < 8; i++) {
                const particle = new Particle(
                    position.x,
                    position.y,
                    position.z,
                    0x00ffff,
                    0.15
                );
                const angle = (Math.PI * 2 * i) / 8;
                particle.velocity = new THREE.Vector3(
                    Math.cos(angle) * 3,
                    Math.sin(angle) * 3,
                    0
                );
                particle.decay = 0.04;
                gameState.particles.push(particle);
            }
        }
        
        // Create shooting trail effect
        function createShootingTrail(bubble) {
            const trailInterval = setInterval(() => {
                if (!bubble.isMoving) {
                    clearInterval(trailInterval);
                    return;
                }
                
                const particle = new Particle(
                    bubble.position.x,
                    bubble.position.y,
                    bubble.position.z,
                    bubble.color,
                    0.2
                );
                particle.decay = 0.05;
                gameState.particles.push(particle);
            }, 50);
        }
        
        // Calculate trajectory
        function calculateTrajectory() {
            if (!gameState.currentBubble || gameState.currentBubble.isMoving) return;
            
            gameState.trajectory = [];
            const startPos = gameState.currentBubble.position.clone();
            const direction = new THREE.Vector3(
                gameState.mousePosition.x - startPos.x,
                gameState.mousePosition.y - startPos.y,
                0
            );
            
            // Check minimum angle
            if (direction.y < 0.3) {
                // Don't show trajectory for invalid angles
                return;
            }
            
            direction.normalize();
            
            let pos = startPos.clone();
            let vel = direction.multiplyScalar(CONFIG.SHOOTING_SPEED);
            const step = 0.05; // Smaller steps for smoother trajectory
            const maxSteps = 200;
            
            for (let i = 0; i < maxSteps; i++) {
                pos = pos.add(vel.clone().multiplyScalar(step));
                
                // Check wall bounce
                if (Math.abs(pos.x) > 5.5 - CONFIG.BUBBLE_RADIUS) {
                    vel.x *= -1;
                    pos.x = Math.sign(pos.x) * (5.5 - CONFIG.BUBBLE_RADIUS);
                }
                
                gameState.trajectory.push(pos.clone());
                
                // Stop at ceiling or when hitting bubbles
                if (pos.y > 6.5) break;
                
                // Check collision with existing bubbles
                let hitBubble = false;
                for (let y = 0; y < CONFIG.GRID_HEIGHT && !hitBubble; y++) {
                    const isOddRow = y % 2 === 1;
                    const bubblesInRow = isOddRow ? CONFIG.GRID_WIDTH - 1 : CONFIG.GRID_WIDTH;
                    
                    for (let x = 0; x < bubblesInRow; x++) {
                        const bubble = gameState.bubbleGrid[y][x];
                        if (bubble) {
                            const distance = pos.distanceTo(bubble.position);
                            if (distance < CONFIG.BUBBLE_RADIUS * 1.8) {
                                hitBubble = true;
                                break;
                            }
                        }
                    }
                }
                
                if (hitBubble) break;
            }
        }
        
        // Render trajectory
        function renderTrajectory() {
            // Remove old trajectory
            const oldTrajectory = scene.getObjectByName('trajectoryGroup');
            if (oldTrajectory) {
                oldTrajectory.children.forEach(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                });
                scene.remove(oldTrajectory);
            }
            
            if (gameState.trajectory.length < 2 || !gameState.currentBubble) return;
            
            const trajectoryGroup = new THREE.Group();
            trajectoryGroup.name = 'trajectoryGroup';
            
            // Create glowing dots along the trajectory
            const dotCount = Math.min(gameState.trajectory.length, 30);
            const spacing = Math.floor(gameState.trajectory.length / dotCount);
            
            for (let i = 0; i < dotCount; i++) {
                const index = i * spacing;
                if (index >= gameState.trajectory.length) break;
                
                const point = gameState.trajectory[index];
                const size = 0.05 + (i / dotCount) * 0.1; // Dots get bigger along the path
                const opacity = 0.3 + (i / dotCount) * 0.4; // Fade in along the path
                
                const dotGeometry = new THREE.SphereGeometry(size, 8, 8);
                const dotMaterial = new THREE.MeshBasicMaterial({
                    color: gameState.currentBubble.color,
                    transparent: true,
                    opacity: opacity,
                    emissive: gameState.currentBubble.color,
                    emissiveIntensity: 2
                });
                
                const dot = new THREE.Mesh(dotGeometry, dotMaterial);
                dot.position.copy(point);
                
                // Add glow effect
                const glowGeometry = new THREE.SphereGeometry(size * 2, 8, 8);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: gameState.currentBubble.color,
                    transparent: true,
                    opacity: opacity * 0.3,
                    emissive: gameState.currentBubble.color,
                    emissiveIntensity: 1
                });
                
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                glow.position.copy(point);
                
                trajectoryGroup.add(glow);
                trajectoryGroup.add(dot);
            }
            
            scene.add(trajectoryGroup);
        }
        
        // Bubble collision detection
        function checkBubbleCollisions() {
            if (!gameState.currentBubble || !gameState.currentBubble.isMoving) return;
            
            const current = gameState.currentBubble;
            
            // Check grid bubbles
            for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                const isOddRow = y % 2 === 1;
                const bubblesInRow = isOddRow ? CONFIG.GRID_WIDTH - 1 : CONFIG.GRID_WIDTH;
                
                for (let x = 0; x < bubblesInRow; x++) {
                    const bubble = gameState.bubbleGrid[y][x];
                    if (!bubble) continue;
                    
                    const distance = current.position.distanceTo(bubble.position);
                    // Use slightly less than 2 radii to ensure proper contact
                    if (distance < CONFIG.BUBBLE_RADIUS * 1.8) {
                        attachBubble(current);
                        return;
                    }
                }
            }
            
            // Check if bubble reached the ceiling
            if (current.position.y > 6.5 - CONFIG.BUBBLE_RADIUS) {
                attachBubble(current);
            }
        }
        
        // Attach bubble to grid
        function attachBubble(bubble) {
            bubble.isMoving = false;
            bubble.velocity.set(0, 0, 0);
            
            // Find nearest valid grid position
            let bestDistance = Infinity;
            let bestX = -1;
            let bestY = -1;
            let fallbackX = -1;
            let fallbackY = -1;
            let fallbackDistance = Infinity;
            
            // Check all possible attachment points
            for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                const isOddRow = y % 2 === 1;
                const bubblesInRow = isOddRow ? CONFIG.GRID_WIDTH - 1 : CONFIG.GRID_WIDTH;
                
                for (let x = 0; x < bubblesInRow; x++) {
                    // Skip if position is occupied
                    if (gameState.bubbleGrid[y][x]) continue;
                    
                    // Calculate world position for this grid cell
                    const xPos = (x - CONFIG.GRID_WIDTH / 2 + 0.5) * CONFIG.HEX_WIDTH + (isOddRow ? CONFIG.HEX_WIDTH / 2 : 0);
                    const yPos = 6 - y * CONFIG.HEX_HEIGHT;
                    
                    const distance = Math.sqrt(
                        Math.pow(bubble.position.x - xPos, 2) + 
                        Math.pow(bubble.position.y - yPos, 2)
                    );
                    
                    // Track closest empty position as fallback
                    if (distance < fallbackDistance) {
                        fallbackDistance = distance;
                        fallbackX = x;
                        fallbackY = y;
                    }
                    
                    // Check if this position has adjacent bubbles
                    let hasAdjacent = false;
                    const neighbors = getNeighbors(x, y);
                    for (let neighbor of neighbors) {
                        if (neighbor) {
                            hasAdjacent = true;
                            break;
                        }
                    }
                    
                    // For top row, always allow attachment
                    if (y === 0) hasAdjacent = true;
                    
                    if (hasAdjacent && distance < bestDistance) {
                        bestDistance = distance;
                        bestX = x;
                        bestY = y;
                    }
                }
            }
            
            // Use best position if found, otherwise use fallback
            let finalX = bestX;
            let finalY = bestY;
            
            if (finalX === -1) {
                // No valid position with neighbors found, use closest empty position
                finalX = fallbackX;
                finalY = fallbackY;
            }
            
            if (finalX !== -1 && finalY !== -1) {
                // Snap to position
                const isOddRow = finalY % 2 === 1;
                bubble.position.x = (finalX - CONFIG.GRID_WIDTH / 2 + 0.5) * CONFIG.HEX_WIDTH + (isOddRow ? CONFIG.HEX_WIDTH / 2 : 0);
                bubble.position.y = 6 - finalY * CONFIG.HEX_HEIGHT;
                bubble.gridX = finalX;
                bubble.gridY = finalY;
                bubble.mesh.position.copy(bubble.position);
                
                gameState.bubbleGrid[finalY][finalX] = bubble;
                
                // Create attachment effect
                createAttachmentEffect(bubble);
                
                // Check for matches
                checkMatches(bubble);
                
                // Check game over
                if (finalY >= CONFIG.GRID_HEIGHT - 2) {
                    gameOver();
                } else {
                    // Create new bubble
                    setTimeout(() => createShootingBubble(), 500);
                }
            }
        }
        
        // Create attachment effect
        function createAttachmentEffect(bubble) {
            for (let i = 0; i < 15; i++) {
                const particle = new Particle(
                    bubble.position.x,
                    bubble.position.y,
                    bubble.position.z,
                    0xffffff,
                    0.15
                );
                particle.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 5,
                    (Math.random() - 0.5) * 5,
                    (Math.random() - 0.5) * 3
                );
                gameState.particles.push(particle);
            }
        }
        
        // Check for matches
        function checkMatches(bubble) {
            const matches = findConnectedBubbles(bubble);
            
            if (matches.length >= 3) {
                // Remove matched bubbles
                let points = matches.length * 10;
                const comboMultiplier = Math.min(gameState.combo + 1, 5);
                points *= comboMultiplier;
                
                updateScore(points);
                updateCombo();
                
                // Create floating score at center of match group
                const centerX = matches.reduce((sum, b) => sum + b.position.x, 0) / matches.length;
                const centerY = matches.reduce((sum, b) => sum + b.position.y, 0) / matches.length;
                createFloatingScore(new THREE.Vector3(centerX, centerY, 0), points);
                
                matches.forEach((matchedBubble, index) => {
                    setTimeout(() => {
                        removeBubble(matchedBubble);
                        createExplosionEffect(matchedBubble);
                    }, index * 50);
                });
                
                // Check for floating bubbles
                setTimeout(() => {
                    removeFloatingBubbles();
                    
                    // Check victory condition
                    setTimeout(() => checkVictory(), 500);
                }, matches.length * 50 + 100);
            } else {
                gameState.combo = 0;
            }
        }
        
        // Check victory condition
        function checkVictory() {
            let hasAnyBubbles = false;
            
            for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
                    if (gameState.bubbleGrid[y][x]) {
                        hasAnyBubbles = true;
                        break;
                    }
                }
                if (hasAnyBubbles) break;
            }
            
            if (!hasAnyBubbles && !gameState.isGameOver) {
                // Victory! Add bonus points and new rows
                const victoryBonus = 1000 * gameState.level;
                updateScore(victoryBonus);
                createFloatingScore(new THREE.Vector3(0, 0, 0), victoryBonus);
                
                // Create celebration effect
                for (let i = 0; i < 50; i++) {
                    setTimeout(() => {
                        const particle = new Particle(
                            (Math.random() - 0.5) * 10,
                            (Math.random() - 0.5) * 10,
                            0,
                            CONFIG.BUBBLE_COLORS[Math.floor(Math.random() * CONFIG.BUBBLE_COLORS.length)],
                            0.3
                        );
                        particle.velocity = new THREE.Vector3(
                            (Math.random() - 0.5) * 15,
                            Math.random() * 10 + 5,
                            (Math.random() - 0.5) * 5
                        );
                        particle.decay = 0.015;
                        gameState.particles.push(particle);
                    }, i * 20);
                }
                
                // Add new rows after celebration
                setTimeout(() => {
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => addNewRow(), i * 200);
                    }
                }, 1500);
            }
        }
        
        // Find connected bubbles of same color
        function findConnectedBubbles(startBubble) {
            const connected = [];
            const visited = new Set();
            const queue = [startBubble];
            const targetColor = startBubble.color;
            
            while (queue.length > 0) {
                const current = queue.shift();
                const key = `${current.gridX},${current.gridY}`;
                
                if (visited.has(key)) continue;
                visited.add(key);
                
                if (current.color === targetColor) {
                    connected.push(current);
                    
                    // Check neighbors
                    const neighbors = getNeighbors(current.gridX, current.gridY);
                    neighbors.forEach(neighbor => {
                        if (neighbor && !visited.has(`${neighbor.gridX},${neighbor.gridY}`)) {
                            queue.push(neighbor);
                        }
                    });
                }
            }
            
            return connected;
        }
        
        // Get neighboring bubbles
        function getNeighbors(x, y) {
            const neighbors = [];
            const isOddRow = y % 2 === 1;
            
            // Hexagonal grid neighbors
            const directions = isOddRow ? [
                [-1, 0], [1, 0],   // Left, Right
                [0, -1], [1, -1],  // Top-left, Top-right (for odd rows)
                [0, 1], [1, 1]     // Bottom-left, Bottom-right (for odd rows)
            ] : [
                [-1, 0], [1, 0],   // Left, Right
                [-1, -1], [0, -1], // Top-left, Top-right (for even rows)
                [-1, 1], [0, 1]    // Bottom-left, Bottom-right (for even rows)
            ];
            
            directions.forEach(([dx, dy]) => {
                const nx = x + dx;
                const ny = y + dy;
                
                if (ny >= 0 && ny < CONFIG.GRID_HEIGHT) {
                    const isNeighborOddRow = ny % 2 === 1;
                    const maxX = isNeighborOddRow ? CONFIG.GRID_WIDTH - 1 : CONFIG.GRID_WIDTH;
                    
                    if (nx >= 0 && nx < maxX && gameState.bubbleGrid[ny][nx]) {
                        neighbors.push(gameState.bubbleGrid[ny][nx]);
                    }
                }
            });
            
            return neighbors;
        }
        
        // Remove floating bubbles
        function removeFloatingBubbles() {
            const connected = new Set();
            
            // Find all bubbles connected to ceiling
            for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
                if (gameState.bubbleGrid[0][x]) {
                    findAllConnected(gameState.bubbleGrid[0][x], connected);
                }
            }
            
            // Remove bubbles not connected to ceiling
            let floatingCount = 0;
            let floatingBubbles = [];
            
            for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
                    const bubble = gameState.bubbleGrid[y][x];
                    if (bubble && !connected.has(bubble)) {
                        floatingCount++;
                        floatingBubbles.push(bubble);
                        setTimeout(() => {
                            removeBubble(bubble);
                            createFloatingEffect(bubble);
                        }, floatingCount * 30);
                    }
                }
            }
            
            if (floatingCount > 0) {
                const floatingPoints = floatingCount * 20 * Math.min(gameState.combo + 1, 5);
                updateScore(floatingPoints);
                
                // Show floating score effect
                if (floatingBubbles.length > 0) {
                    const centerX = floatingBubbles.reduce((sum, b) => sum + b.position.x, 0) / floatingBubbles.length;
                    const centerY = floatingBubbles.reduce((sum, b) => sum + b.position.y, 0) / floatingBubbles.length;
                    setTimeout(() => {
                        createFloatingScore(new THREE.Vector3(centerX, centerY, 0), floatingPoints);
                    }, floatingCount * 15);
                }
            }
        }
        
        // Find all connected bubbles
        function findAllConnected(startBubble, connected) {
            const queue = [startBubble];
            
            while (queue.length > 0) {
                const current = queue.shift();
                if (connected.has(current)) continue;
                
                connected.add(current);
                
                const neighbors = getNeighbors(current.gridX, current.gridY);
                neighbors.forEach(neighbor => {
                    if (!connected.has(neighbor)) {
                        queue.push(neighbor);
                    }
                });
            }
        }
        
        // Remove bubble
        function removeBubble(bubble) {
            gameState.bubbleGrid[bubble.gridY][bubble.gridX] = null;
            
            // Animate removal
            const removeAnimation = {
                bubble: bubble,
                progress: 0,
                update: function(deltaTime) {
                    this.progress += deltaTime * 3;
                    bubble.mesh.scale.setScalar(1 - this.progress);
                    bubble.mesh.rotation.x += 0.3;
                    bubble.mesh.rotation.y += 0.2;
                    bubble.material.opacity = 1 - this.progress;
                    
                    if (this.progress >= 1) {
                        bubble.destroy();
                        return false;
                    }
                    return true;
                }
            };
            
            gameState.animations.push(removeAnimation);
        }
        
        // Create explosion effect
        function createExplosionEffect(bubble) {
            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                const particle = new Particle(
                    bubble.position.x,
                    bubble.position.y,
                    bubble.position.z,
                    bubble.color,
                    0.2
                );
                
                const angle = (Math.PI * 2 * i) / CONFIG.PARTICLE_COUNT;
                const speed = 8 + Math.random() * 4;
                particle.velocity = new THREE.Vector3(
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    (Math.random() - 0.5) * 4
                );
                
                gameState.particles.push(particle);
            }
        }
        
        // Create floating effect
        function createFloatingEffect(bubble) {
            bubble.isFloating = true;
            
            const floatAnimation = {
                bubble: bubble,
                progress: 0,
                update: function(deltaTime) {
                    this.progress += deltaTime;
                    bubble.position.y -= deltaTime * 5;
                    bubble.mesh.position.copy(bubble.position);
                    bubble.mesh.rotation.z += 0.1;
                    bubble.material.opacity = Math.max(0, 1 - this.progress);
                    
                    if (this.progress >= 1) {
                        bubble.destroy();
                        return false;
                    }
                    return true;
                }
            };
            
            gameState.animations.push(floatAnimation);
            
            // Add sparkle particles
            for (let i = 0; i < 10; i++) {
                const particle = new Particle(
                    bubble.position.x,
                    bubble.position.y,
                    bubble.position.z,
                    0xffffff,
                    0.1
                );
                gameState.particles.push(particle);
            }
        }
        
        // Restart game
        function restartGame() {
            // Clear all bubbles
            for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
                    if (gameState.bubbleGrid[y][x]) {
                        gameState.bubbleGrid[y][x].destroy();
                        gameState.bubbleGrid[y][x] = null;
                    }
                }
            }
            
            // Clear particles
            gameState.particles.forEach(particle => particle.destroy());
            gameState.particles = [];
            
            // Reset game state
            gameState.score = 0;
            gameState.level = 1;
            gameState.combo = 0;
            gameState.bestCombo = 0;
            gameState.isGameOver = false;
            gameState.currentBubble = null;
            gameState.shootingPower = 0;
            gameState.isCharging = false;
            gameState.animations = [];
            
            // Update UI
            document.getElementById('scoreValue').textContent = '0';
            document.getElementById('levelValue').textContent = '1';
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('comboDisplay').classList.remove('active');
            
            // Remove trajectory
            const oldTrajectory = scene.getObjectByName('trajectoryGroup');
            if (oldTrajectory) {
                oldTrajectory.children.forEach(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                });
                scene.remove(oldTrajectory);
            }
            
            // Create new game
            createInitialBubbles();
            createShootingBubble();
        }
        
        // Create floating score effect
        function createFloatingScore(position, points) {
            const scoreElement = document.createElement('div');
            scoreElement.className = 'floating-score';
            scoreElement.textContent = '+' + points;
            
            // Convert 3D position to screen coordinates
            const vector = position.clone();
            vector.project(camera);
            
            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (1 - (vector.y * 0.5 + 0.5)) * window.innerHeight;
            
            scoreElement.style.left = x + 'px';
            scoreElement.style.top = y + 'px';
            
            document.body.appendChild(scoreElement);
            
            // Remove after animation
            setTimeout(() => {
                scoreElement.remove();
            }, 1500);
        }
        
        // Update score
        function updateScore(points) {
            gameState.score += points;
            document.getElementById('scoreValue').textContent = gameState.score;
            
            // Check level progression
            const newLevel = Math.floor(gameState.score / 1000) + 1;
            if (newLevel > gameState.level) {
                gameState.level = newLevel;
                document.getElementById('levelValue').textContent = gameState.level;
                addNewRow();
            }
        }
        
        // Update combo
        function updateCombo() {
            gameState.combo++;
            if (gameState.combo > gameState.bestCombo) {
                gameState.bestCombo = gameState.combo;
            }
            
            const comboDisplay = document.getElementById('comboDisplay');
            const comboValue = document.getElementById('comboValue');
            
            comboDisplay.classList.add('active');
            comboValue.textContent = gameState.combo + 1;
            
            clearTimeout(gameState.comboTimer);
            gameState.comboTimer = setTimeout(() => {
                comboDisplay.classList.remove('active');
                gameState.combo = 0;
            }, CONFIG.COMBO_TIMEOUT);
        }
        
        // Add new row when level increases
        function addNewRow() {
            // Shift all bubbles down
            for (let y = CONFIG.GRID_HEIGHT - 1; y > 0; y--) {
                for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
                    gameState.bubbleGrid[y][x] = gameState.bubbleGrid[y - 1][x];
                    if (gameState.bubbleGrid[y][x]) {
                        gameState.bubbleGrid[y][x].gridY = y;
                        const isOddRow = y % 2 === 1;
                        gameState.bubbleGrid[y][x].position.x = (x - CONFIG.GRID_WIDTH / 2 + 0.5) * CONFIG.HEX_WIDTH + (isOddRow ? CONFIG.HEX_WIDTH / 2 : 0);
                        gameState.bubbleGrid[y][x].position.y = 6 - y * CONFIG.HEX_HEIGHT;
                        gameState.bubbleGrid[y][x].mesh.position.copy(gameState.bubbleGrid[y][x].position);
                    }
                }
            }
            
            // Add new row at top
            const isOddRow = false; // Top row is always even
            const bubblesInRow = CONFIG.GRID_WIDTH;
            
            for (let x = 0; x < bubblesInRow; x++) {
                if (Math.random() > 0.2) { // 80% chance for bubble
                    const color = CONFIG.BUBBLE_COLORS[Math.floor(Math.random() * CONFIG.BUBBLE_COLORS.length)];
                    const xPos = (x - CONFIG.GRID_WIDTH / 2 + 0.5) * CONFIG.HEX_WIDTH;
                    const yPos = 6;
                    
                    const bubble = new Bubble(xPos, yPos, color);
                    bubble.gridX = x;
                    bubble.gridY = 0;
                    scene.add(bubble.mesh);
                    gameState.bubbleGrid[0][x] = bubble;
                } else {
                    gameState.bubbleGrid[0][x] = null;
                }
            }
        }
        
        // Game over
        function gameOver() {
            gameState.isGameOver = true;
            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('finalLevel').textContent = gameState.level;
            document.getElementById('bestCombo').textContent = gameState.bestCombo + 1;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        // Mouse/Touch controls
        function handleMouseMove(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            const y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            const vector = new THREE.Vector3(x, y, 0.5);
            vector.unproject(camera);
            
            const dir = vector.sub(camera.position).normalize();
            const distance = -camera.position.z / dir.z;
            const pos = camera.position.clone().add(dir.multiplyScalar(distance));
            
            gameState.mousePosition.set(pos.x, pos.y);
            
            // Update cursor style based on valid shooting angle
            if (gameState.currentBubble && !gameState.currentBubble.isMoving) {
                const direction = new THREE.Vector3(
                    pos.x - gameState.currentBubble.position.x,
                    pos.y - gameState.currentBubble.position.y,
                    0
                );
                
                if (direction.y < 0.3) {
                    renderer.domElement.style.cursor = 'not-allowed';
                } else {
                    renderer.domElement.style.cursor = 'crosshair';
                }
            }
            
            calculateTrajectory();
        }
        
        function handleMouseDown(event) {
            if (gameState.isGameOver || !gameState.currentBubble || gameState.currentBubble.isMoving) return;
            
            gameState.isCharging = true;
            document.getElementById('powerMeter').classList.add('active');
        }
        
        function handleMouseUp(event) {
            if (gameState.isGameOver || !gameState.currentBubble || gameState.currentBubble.isMoving) return;
            
            if (gameState.isCharging) {
                // Reset bubble scale
                if (gameState.currentBubble) {
                    gameState.currentBubble.mesh.scale.setScalar(1);
                    gameState.currentBubble.material.emissiveIntensity = 0.1;
                }
                
                shootBubble(gameState.shootingPower);
                gameState.isCharging = false;
                gameState.shootingPower = 0;
                document.getElementById('powerMeter').classList.remove('active');
                document.getElementById('powerFill').style.width = '0%';
            }
        }
        
        // Event listeners
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mousedown', handleMouseDown);
        window.addEventListener('mouseup', handleMouseUp);
        
        window.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            handleMouseMove(touch);
            handleMouseDown(touch);
        });
        
        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            handleMouseMove(touch);
        });
        
        window.addEventListener('touchend', handleMouseUp);
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Animation loop
        let lastTime = 0;
        function animate(currentTime) {
            requestAnimationFrame(animate);
            
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            
            if (!gameState.isGameOver) {
                // Update current bubble
                if (gameState.currentBubble) {
                    gameState.currentBubble.update(deltaTime);
                    checkBubbleCollisions();
                }
                
                // Update all bubbles
                for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                    const isOddRow = y % 2 === 1;
                    const bubblesInRow = isOddRow ? CONFIG.GRID_WIDTH - 1 : CONFIG.GRID_WIDTH;
                    
                    for (let x = 0; x < bubblesInRow; x++) {
                        if (gameState.bubbleGrid[y][x]) {
                            gameState.bubbleGrid[y][x].update(deltaTime);
                        }
                    }
                }
                
                // Update particles
                gameState.particles = gameState.particles.filter(particle => {
                    const alive = particle.update(deltaTime);
                    if (!alive) particle.destroy();
                    return alive;
                });
                
                // Update animations
                gameState.animations = gameState.animations.filter(animation => {
                    return animation.update(deltaTime);
                });
                
                // Update power meter
                if (gameState.isCharging) {
                    gameState.shootingPower = Math.min(gameState.shootingPower + deltaTime * 2, 1);
                    document.getElementById('powerFill').style.width = (gameState.shootingPower * 100) + '%';
                    
                    // Add visual feedback on the current bubble
                    if (gameState.currentBubble) {
                        const scale = 1 + gameState.shootingPower * 0.3;
                        gameState.currentBubble.mesh.scale.setScalar(scale);
                        
                        // Add pulsing glow effect
                        gameState.currentBubble.material.emissiveIntensity = 0.1 + gameState.shootingPower * 0.4;
                    }
                }
                
                // Render trajectory
                renderTrajectory();
            }
            
            // Animate lights
            rimLight.position.x = Math.sin(currentTime * 0.001) * 10;
            accentLight.position.y = Math.cos(currentTime * 0.0007) * 5;
            
            renderer.render(scene, camera);
        }
        
        // Initialize game
        createGameBoard();
        createInitialBubbles();
        createShootingBubble();
        animate(0);
        
        // Make restart function globally accessible
        window.restartGame = restartGame;
    </script>
</body>
</html>
