<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium 3D Bubble Shooter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Orbitron', monospace;
            overflow: hidden;
            background: radial-gradient(ellipse at bottom, #001133 0%, #000011 40%, #000000 100%);
            color: #fff;
            user-select: none;
        }
        
        #gameCanvas {
            display: block;
            cursor: crosshair;
        }
        
        .ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
            z-index: 100;
        }
        
        .ui-panel {
            background: rgba(0, 20, 40, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 255, 255, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            pointer-events: auto;
        }
        
        .score-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .score-label {
            font-size: 14px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        
        .score-value {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        
        .combo-display {
            position: absolute;
            top: 120px;
            right: 20px;
            font-size: 24px;
            font-weight: 700;
            color: #ff6b35;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.8);
            opacity: 0;
            transition: all 0.3s ease;
        }
        
        .combo-display.active {
            opacity: 1;
            transform: scale(1.2);
        }
        
        .power-meter {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 20px;
            background: rgba(0, 20, 40, 0.7);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .power-meter.active {
            opacity: 1;
        }
        
        .power-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffff 0%, #ff6b35 100%);
            width: 0%;
            transition: width 0.1s ease;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.8);
        }
        
        .next-bubble {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: rgba(0, 20, 40, 0.7);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 255, 255, 0.3),
                        inset 0 0 20px rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            overflow: hidden;
        }
        
        .next-bubble::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            animation: rotate 3s linear infinite;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .next-label {
            position: absolute;
            top: -25px;
            font-size: 12px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            animation: fadeIn 0.5s ease;
            z-index: 200;
        }
        
        .game-over h2 {
            font-size: 48px;
            font-weight: 900;
            color: #ff6b35;
            text-shadow: 0 0 30px rgba(255, 107, 53, 0.8);
            margin-bottom: 20px;
        }
        
        .game-over p {
            font-size: 24px;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            margin-bottom: 30px;
        }
        
        .restart-btn {
            background: linear-gradient(135deg, #00ffff 0%, #ff6b35 100%);
            border: none;
            border-radius: 30px;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 8px 32px rgba(0, 255, 255, 0.4);
            transition: all 0.3s ease;
            font-family: 'Orbitron', monospace;
        }
        
        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(255, 107, 53, 0.6);
        }
        
        .floating-score {
            position: absolute;
            font-size: 24px;
            font-weight: 900;
            color: #ffff00;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.8);
            pointer-events: none;
            animation: floatUp 1.5s ease-out forwards;
            z-index: 150;
        }
        
        @keyframes floatUp {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-100px);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -60%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes bubbleBounce {
            0% { transform: scale(0.8) translateY(10px); }
            50% { transform: scale(1.1) translateY(-5px); }
            100% { transform: scale(1) translateY(0); }
        }
        
        /* Lightning Selector UI */
        .lightning-selector {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 20, 40, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid #00aaff;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 0 50px rgba(0, 170, 255, 0.5),
                        inset 0 0 20px rgba(0, 170, 255, 0.2);
            animation: lightningPulse 2s ease-in-out infinite;
        }
        
        .lightning-selector h3 {
            color: #00ddff;
            font-size: 24px;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(0, 221, 255, 0.8);
            letter-spacing: 3px;
        }
        
        .lightning-selector p {
            color: #fff;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .lightning-options {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .lightning-btn {
            background: linear-gradient(135deg, #0066cc, #00aaff);
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 170, 255, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .lightning-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 170, 255, 0.6);
            background: linear-gradient(135deg, #0077dd, #00bbff);
        }
        
        .lightning-btn::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, transparent, #00ddff, transparent);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .lightning-btn:hover::before {
            opacity: 1;
            animation: lightningBorder 1.5s linear infinite;
        }
        
        .lightning-cancel {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .lightning-cancel:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        @keyframes lightningPulse {
            0%, 100% { 
                box-shadow: 0 0 50px rgba(0, 170, 255, 0.5),
                           inset 0 0 20px rgba(0, 170, 255, 0.2);
            }
            50% { 
                box-shadow: 0 0 80px rgba(0, 170, 255, 0.8),
                           inset 0 0 30px rgba(0, 170, 255, 0.4);
            }
        }
        
        @keyframes lightningBorder {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        /* Precision Aim Indicator */
        .precision-indicator {
            position: absolute;
            bottom: 150px;
            right: 30px;
            background: rgba(0, 20, 40, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            animation: precisionGlow 2s ease-in-out infinite;
        }
        
        .precision-timer {
            position: relative;
            width: 60px;
            height: 60px;
        }
        
        .precision-time {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            font-weight: 700;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
        
        .precision-label {
            color: #00ffff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        
        @keyframes precisionGlow {
            0%, 100% { 
                box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
                border-color: #00ffff;
            }
            50% { 
                box-shadow: 0 0 50px rgba(0, 255, 255, 0.8);
                border-color: #66ffff;
            }
        }
        
        /* Power-Up Indicator */
        .powerup-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 20, 40, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #fff;
            border-radius: 30px;
            padding: 10px 30px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            animation: powerupPulse 2s ease-in-out infinite;
        }
        
        .powerup-label {
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }
        
        @keyframes powerupPulse {
            0%, 100% { 
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            }
            50% { 
                transform: translateX(-50%) scale(1.05);
                box-shadow: 0 0 50px rgba(255, 255, 255, 0.5);
            }
        }
        
        /* Lightning selection highlights */
        .lightning-highlight-row,
        .lightning-highlight-column {
            position: absolute;
            pointer-events: none;
            background: rgba(0, 170, 255, 0.3);
            border: 2px solid #00ddff;
            transition: all 0.3s ease;
            z-index: 500;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-container">
        <div class="ui-panel">
            <div class="score-display">
                <span class="score-label">Score</span>
                <span class="score-value" id="scoreValue">0</span>
            </div>
            <div class="score-display">
                <span class="score-label">Level</span>
                <span class="score-value" id="levelValue">1</span>
            </div>
        </div>
    </div>
    
    <div class="combo-display" id="comboDisplay">
        COMBO x<span id="comboValue">2</span>
    </div>
    
    <div class="power-meter" id="powerMeter">
        <div class="power-fill" id="powerFill"></div>
    </div>
    
    <div class="next-bubble" id="nextBubble">
        <span class="next-label">NEXT</span>
    </div>
    
    <div class="game-over" id="gameOver">
        <h2>GAME OVER</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p style="font-size: 18px; color: #fff; margin-bottom: 10px;">Level Reached: <span id="finalLevel">1</span></p>
        <p style="font-size: 18px; color: #fff; margin-bottom: 30px;">Best Combo: <span id="bestCombo">0</span></p>
        <button class="restart-btn" onclick="restartGame()">PLAY AGAIN</button>
    </div>
    
    <!-- Lightning Power-Up Selection UI -->
    <div class="lightning-selector" id="lightningSelector" style="display: none;">
        <h3>LIGHTNING STRIKE</h3>
        <p>Choose your target:</p>
        <div class="lightning-options">
            <button class="lightning-btn" id="selectRow">DESTROY ROW</button>
            <button class="lightning-btn" id="selectColumn">DESTROY COLUMN</button>
        </div>
        <button class="lightning-cancel">CANCEL</button>
    </div>
    
    <!-- Precision Aim Indicator -->
    <div class="precision-indicator" id="precisionIndicator" style="display: none;">
        <div class="precision-timer">
            <svg width="60" height="60" viewBox="0 0 60 60">
                <circle cx="30" cy="30" r="25" fill="none" stroke="rgba(0,255,255,0.2)" stroke-width="3"/>
                <circle cx="30" cy="30" r="25" fill="none" stroke="#00ffff" stroke-width="3"
                        stroke-dasharray="157" stroke-dashoffset="0" 
                        transform="rotate(-90 30 30)" id="precisionTimerCircle"/>
            </svg>
            <span class="precision-time" id="precisionTime">10</span>
        </div>
        <span class="precision-label">PRECISION AIM</span>
    </div>
    
    <!-- Power-Up Indicator -->
    <div class="powerup-indicator" id="powerupIndicator" style="display: none;">
        <span class="powerup-label" id="powerupLabel">POWER-UP</span>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game Configuration
        const CONFIG = {
            BUBBLE_RADIUS: 0.5,
            GRID_WIDTH: 11,
            GRID_HEIGHT: 14,
            SHOOTING_SPEED: 20,
            MAX_SHOOTING_SPEED: 30,
            WALL_BOUNCE_DAMPING: 0.95,
            HEX_WIDTH: 1.0, // Bubble diameter
            HEX_HEIGHT: 0.866, // sqrt(3)/2 * diameter for hexagonal packing
            BUBBLE_COLORS: [
                0xff0066, // Pink
                0x00ff66, // Green
                0x66ff00, // Lime
                0x00ffff, // Cyan
                0xff6600, // Orange
                0x6600ff, // Purple
                0xffff00, // Yellow
                0xff00ff  // Magenta
            ],
            PARTICLE_COUNT: 30,
            COMBO_TIMEOUT: 2000,
            DANGER_LINE: -5
        };
        
        // Event Bus System for modular communication
        class EventBus {
            constructor() {
                this.events = {};
            }
            
            on(event, callback) {
                if (!this.events[event]) {
                    this.events[event] = [];
                }
                this.events[event].push(callback);
            }
            
            off(event, callback) {
                if (this.events[event]) {
                    this.events[event] = this.events[event].filter(cb => cb !== callback);
                }
            }
            
            emit(event, data) {
                if (this.events[event]) {
                    this.events[event].forEach(callback => callback(data));
                }
            }
        }
        
        // Power-Up System
        class PowerUp {
            constructor(type, config) {
                this.type = type;
                this.name = config.name;
                this.rarity = config.rarity;
                this.spawnRate = config.spawnRate;
                this.color = config.color;
                this.glowColor = config.glowColor;
                this.duration = config.duration || 0;
                this.cooldown = config.cooldown || 0;
                this.isActive = false;
            }
            
            activate(targetPosition, gameState, gameManager) {
                // Override in subclasses
                throw new Error('PowerUp activate method must be implemented');
            }
            
            createVisualEffect(bubble) {
                // Add glow and particle effects to power-up bubbles
                bubble.powerUpType = this.type;
                bubble.isPowerUp = true;
                
                // Add glowing effect
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: this.glowColor,
                    transparent: true,
                    opacity: 0.3
                });
                const glowGeometry = new THREE.SphereGeometry(CONFIG.BUBBLE_RADIUS * 1.5, 16, 16);
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                bubble.mesh.add(glow);
                bubble.glowMesh = glow;
                
                // Add pulsing animation
                bubble.powerUpAnimation = {
                    time: 0,
                    update: function(deltaTime) {
                        this.time += deltaTime;
                        const scale = 1 + Math.sin(this.time * 3) * 0.1;
                        glow.scale.set(scale, scale, scale);
                        glow.material.opacity = 0.3 + Math.sin(this.time * 2) * 0.1;
                    }
                };
            }
        }
        
        // Rainbow Bubble Power-Up
        class RainbowPowerUp extends PowerUp {
            constructor() {
                super('rainbow', {
                    name: 'Rainbow Bubble',
                    rarity: 'common',
                    spawnRate: 0.15,
                    color: 0xffffff,
                    glowColor: 0xffffff
                });
            }
            
            activate(targetPosition, gameState, gameManager) {
                // Rainbow bubble matches any color it touches
                gameManager.eventBus.emit('rainbowActivated', { position: targetPosition });
                return true;
            }
            
            createVisualEffect(bubble) {
                super.createVisualEffect(bubble);
                
                // Create rainbow shimmer effect
                bubble.mesh.material = new THREE.MeshPhongMaterial({
                    color: 0xffffff,
                    emissive: 0x444444,
                    emissiveIntensity: 0.5,
                    shininess: 100
                });
                
                // Add rainbow animation
                const originalUpdate = bubble.powerUpAnimation.update;
                bubble.powerUpAnimation.update = function(deltaTime) {
                    originalUpdate.call(this, deltaTime);
                    const hue = (this.time * 0.1) % 1;
                    bubble.mesh.material.color.setHSL(hue, 1, 0.5);
                };
            }
        }
        
        // Bomb Bubble Power-Up
        class BombPowerUp extends PowerUp {
            constructor() {
                super('bomb', {
                    name: 'Bomb Bubble',
                    rarity: 'common',
                    spawnRate: 0.10,
                    color: 0xff0000,
                    glowColor: 0xff0000
                });
                this.explosionRadius = 3; // 3x3 grid
            }
            
            activate(targetPosition, gameState, gameManager) {
                // Destroy bubbles in 3x3 area
                gameManager.eventBus.emit('bombExploded', { 
                    position: targetPosition,
                    radius: this.explosionRadius 
                });
                
                // Screen shake effect
                gameManager.addScreenShake(0.5, 10);
                
                return true;
            }
            
            createVisualEffect(bubble) {
                super.createVisualEffect(bubble);
                
                // Pulsing red glow
                bubble.mesh.material.emissive = new THREE.Color(0x660000);
                bubble.mesh.material.emissiveIntensity = 0.5;
                
                // Add timer ticking effect
                let tickTime = 0;
                const originalUpdate = bubble.powerUpAnimation.update;
                bubble.powerUpAnimation.update = function(deltaTime) {
                    originalUpdate.call(this, deltaTime);
                    tickTime += deltaTime;
                    if (tickTime > 0.5) {
                        tickTime = 0;
                        // Flash effect
                        bubble.mesh.material.emissiveIntensity = 1;
                        setTimeout(() => {
                            bubble.mesh.material.emissiveIntensity = 0.5;
                        }, 100);
                    }
                };
            }
        }
        
        // Lightning Bubble Power-Up
        class LightningPowerUp extends PowerUp {
            constructor() {
                super('lightning', {
                    name: 'Lightning Bubble',
                    rarity: 'rare',
                    spawnRate: 0.08,
                    color: 0x00aaff,
                    glowColor: 0x00ddff
                });
            }
            
            activate(targetPosition, gameState, gameManager) {
                // Show selection UI for row/column choice
                gameManager.eventBus.emit('lightningActivated', { 
                    position: targetPosition,
                    bubble: this
                });
                return true;
            }
            
            createVisualEffect(bubble) {
                super.createVisualEffect(bubble);
                
                // Electric blue material
                bubble.mesh.material = new THREE.MeshPhysicalMaterial({
                    color: 0x00aaff,
                    emissive: 0x0066ff,
                    emissiveIntensity: 0.6,
                    metalness: 0.8,
                    roughness: 0.2,
                    clearcoat: 1,
                    clearcoatRoughness: 0
                });
                
                // Add electric arc particles
                const arcCount = 3;
                bubble.electricArcs = [];
                
                for (let i = 0; i < arcCount; i++) {
                    const arcGeometry = new THREE.BufferGeometry();
                    const arcPositions = new Float32Array(6 * 3); // 6 points per arc
                    arcGeometry.setAttribute('position', new THREE.BufferAttribute(arcPositions, 3));
                    
                    const arcMaterial = new THREE.LineBasicMaterial({
                        color: 0x00ddff,
                        transparent: true,
                        opacity: 0.8,
                        linewidth: 2
                    });
                    
                    const arc = new THREE.Line(arcGeometry, arcMaterial);
                    bubble.mesh.add(arc);
                    bubble.electricArcs.push({ mesh: arc, phase: Math.random() * Math.PI * 2 });
                }
                
                // Enhanced pulsing animation with electric arcs
                const originalUpdate = bubble.powerUpAnimation.update;
                bubble.powerUpAnimation.update = function(deltaTime) {
                    originalUpdate.call(this, deltaTime);
                    
                    // Update electric arcs
                    bubble.electricArcs.forEach((arc, index) => {
                        const positions = arc.mesh.geometry.attributes.position.array;
                        const time = this.time + arc.phase;
                        
                        for (let j = 0; j < 6; j++) {
                            const angle = (j / 5) * Math.PI * 2 + time * 2;
                            const radius = CONFIG.BUBBLE_RADIUS * (0.8 + Math.sin(time * 3 + j) * 0.3);
                            const jitter = Math.sin(time * 10 + j * 2) * 0.1;
                            
                            positions[j * 3] = Math.cos(angle) * radius + jitter;
                            positions[j * 3 + 1] = Math.sin(angle) * radius + jitter;
                            positions[j * 3 + 2] = (j - 2.5) * 0.2;
                        }
                        
                        arc.mesh.geometry.attributes.position.needsUpdate = true;
                        arc.mesh.material.opacity = 0.5 + Math.sin(time * 5) * 0.3;
                    });
                };
            }
        }
        
        // Precision Aim Power-Up
        class PrecisionAimPowerUp extends PowerUp {
            constructor() {
                super('precision', {
                    name: 'Precision Aim',
                    rarity: 'common',
                    spawnRate: 0.12,
                    color: 0x00ffff,
                    glowColor: 0x00ffff,
                    duration: 10 // Lasts for 10 seconds
                });
            }
            
            activate(targetPosition, gameState, gameManager) {
                // Activate precision aim mode
                gameManager.eventBus.emit('precisionAimActivated', { 
                    duration: this.duration 
                });
                
                // Remove the bubble after activation

        // Power-Up System Manager
        class PowerUpSystem {
            constructor(eventBus) {
                this.eventBus = eventBus;
                this.powerUps = new Map();
                this.activePowerUps = [];
                
                // Register power-ups
                this.registerPowerUp(new RainbowPowerUp());
                this.registerPowerUp(new BombPowerUp());
                this.registerPowerUp(new LightningPowerUp());
                this.registerPowerUp(new PrecisionAimPowerUp());
                
                // Calculate total spawn rate
                this.totalSpawnRate = 0;
                this.powerUps.forEach(powerUp => {
                    this.totalSpawnRate += powerUp.spawnRate;
                });
            }
            
            registerPowerUp(powerUp) {
                this.powerUps.set(powerUp.type, powerUp);
            }
            
            shouldSpawnPowerUp() {
                return Math.random() < this.totalSpawnRate;
            }
            
            getRandomPowerUp() {
                const rand = Math.random() * this.totalSpawnRate;
                let accumulator = 0;
                
                for (const [type, powerUp] of this.powerUps) {
                    accumulator += powerUp.spawnRate;
                    if (rand < accumulator) {
                        return powerUp;
                    }
                }
                
                // Fallback to first power-up
                return this.powerUps.values().next().value;
            }
            
            applyPowerUpToBubble(bubble) {
                if (this.shouldSpawnPowerUp()) {
                    const powerUp = this.getRandomPowerUp();
                    powerUp.createVisualEffect(bubble);
                    console.log(`Created ${powerUp.type} power-up`);
                    return powerUp;
                }
                return null;
            }
            
            activatePowerUp(bubble, gameState, gameManager) {
                if (bubble.isPowerUp && bubble.powerUpType) {
                    const powerUp = this.powerUps.get(bubble.powerUpType);
                    if (powerUp) {
                        return powerUp.activate(bubble.position, gameState, gameManager);
                    }
                }
                return false;
            }
            
            update(deltaTime) {
                // Update active power-ups
                this.activePowerUps = this.activePowerUps.filter(powerUp => {
                    powerUp.duration -= deltaTime;
                    return powerUp.duration > 0;
                });
            }
        }

            executeLightningStrike(position, targetType) {
                const gridY = position.gridY;
                const gridX = position.gridX;
                const destroyed = [];
                
                if (targetType === 'row') {
                    // Destroy entire row
                    const isOddRow = gridY % 2 === 1;
                    const bubblesInRow = isOddRow ? CONFIG.GRID_WIDTH - 1 : CONFIG.GRID_WIDTH;
                    
                    for (let x = 0; x < bubblesInRow; x++) {
                        const bubble = gameState.bubbleGrid[gridY][x];
                        if (bubble) {
                            destroyed.push(bubble);
                        }
                    }
                } else if (targetType === 'column') {
                    // Destroy entire column (accounting for hexagonal offset)
                    for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
                        const isOddRow = y % 2 === 1;
                        const adjustedX = isOddRow ? gridX : gridX;
                        
                        if (adjustedX >= 0 && adjustedX < (isOddRow ? CONFIG.GRID_WIDTH - 1 : CONFIG.GRID_WIDTH)) {
                            const bubble = gameState.bubbleGrid[y][adjustedX];
                            if (bubble) {
                                destroyed.push(bubble);
                            }
                        }
                    }
                }
                
                // Create lightning effect
                this.createLightningEffect(destroyed, targetType);
                
                // Calculate points
                let points = destroyed.length * 25; // High points for lightning
                updateScore(points);
                updateCombo();
                
                createFloatingScore(position, points);
                
                // Remove bubbles with delay for effect
                destroyed.forEach((bubble, index) => {
                    setTimeout(() => {
                        removeBubble(bubble);
                        this.createLightningParticles(bubble);
                    }, index * 30);
                });
                
                // Check for floating bubbles
                setTimeout(() => {
                    checkForFloatingBubbles();
                }, destroyed.length * 30 + 200);
                
                // Create new bubble
                setTimeout(() => createShootingBubble(), destroyed.length * 30 + 500);
            }
            
            createLightningEffect(bubbles, targetType) {
                if (bubbles.length === 0) return;
                
                // Create lightning bolt visual
                const lightningGeometry = new THREE.BufferGeometry();
                const positions = [];
                
                bubbles.forEach((bubble, index) => {
                    if (index > 0) {
                        const prev = bubbles[index - 1];
                        positions.push(
                            prev.position.x, prev.position.y, prev.position.z,
                            bubble.position.x, bubble.position.y, bubble.position.z
                        );
                    }
                });
                
                lightningGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                
                const lightningMaterial = new THREE.LineBasicMaterial({
                    color: 0x00ddff,
                    transparent: true,
                    opacity: 1,
                    linewidth: 5
                });
                
                const lightning = new THREE.LineSegments(lightningGeometry, lightningMaterial);
                scene.add(lightning);
                
                // Flash effect
                const flashLight = new THREE.PointLight(0x00ddff, 10, 50);
                const centerPos = bubbles[Math.floor(bubbles.length / 2)].position;
                flashLight.position.copy(centerPos);
                scene.add(flashLight);
                
                // Animate lightning fade
                let opacity = 1;
                const fadeInterval = setInterval(() => {
                    opacity -= 0.1;
                    lightningMaterial.opacity = opacity;
                    flashLight.intensity = opacity * 10;
                    
                    if (opacity <= 0) {
                        scene.remove(lightning);
                        scene.remove(flashLight);
                        clearInterval(fadeInterval);
                    }
                }, 50);
                
                // Screen flash
                this.addScreenShake(0.4, 8);
            }
            
            createLightningParticles(bubble) {
                for (let i = 0; i < 20; i++) {
                    const particle = new Particle(
                        bubble.position.x,
                        bubble.position.y,
                        bubble.position.z,

                        Math.sin(angle) * speed,

                    particle.decay = 0.02;

                        gameState.extendedTrajectory = false;
                        indicator.style.display = 'none';

                    } else {

                        const offset = 157 - (157 * (gameState.precisionAimTime / duration));
                        timerCircle.style.strokeDashoffset = offset;
                    }

            addScreenShake(duration, intensity) {

                this.screenShake.intensity = Math.max(this.screenShake.intensity, intensity);

                    if (this.screenShake.duration <= 0) {
                        camera.position.x = 0;
                        camera.position.y = 0;
                        this.screenShake.intensity = 0;
                    }
                }
            }

                this.updateScreenShake(deltaTime, camera);

        // Bubble Class
        class Bubble {
            constructor(x, y, color, radius = CONFIG.BUBBLE_RADIUS) {
                this.gridX = -1;
                this.gridY = -1;
                this.position = new THREE.Vector3(x, y, 0);
                this.velocity = new THREE.Vector3(0, 0, 0);
                this.color = color;
                this.radius = radius;
                this.isMoving = false;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;
                
                // Create geometry with high detail
                const geometry = new THREE.IcosahedronGeometry(radius, 2);
                
                // Premium glass-like material with enhanced rim lighting
                this.material = new THREE.MeshPhysicalMaterial({
                    color: color,
                    metalness: 0.1,
                    roughness: 0.1,
                    transmission: 0.5,
                    thickness: 0.5,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.0,
                    envMapIntensity: 1.5,
                    ior: 1.5,
                    reflectivity: 0.8,
                    emissive: color,
                    emissiveIntensity: 0.2,
                    sheen: 1.0,
                    sheenRoughness: 0.3,
                    sheenColor: new THREE.Color(color).multiplyScalar(1.5)
                });
                
                this.mesh = new THREE.Mesh(geometry, this.material);
                this.mesh.position.set(x, y, 0);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                
                // Add rim light glow
                const glowGeometry = new THREE.IcosahedronGeometry(radius * 1.1, 2);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.15,
                    side: THREE.BackSide
                });
                this.glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
                this.mesh.add(this.glowMesh);
                
                // Connection animation properties
                this.connectionScale = 1.0;
                this.connectionAnimating = false;
                
                // Add subtle floating animation
                this.floatOffset = Math.random() * Math.PI * 2;
                this.floatSpeed = 0.5 + Math.random() * 0.5;
            }
            
            update(deltaTime) {
                if (this.isMoving) {
                    // Update position
                    this.position.add(this.velocity.clone().multiplyScalar(deltaTime));
                    this.mesh.position.copy(this.position);
                    
                    // Check wall collisions
                    const wallLimit = 5.5;
                    if (Math.abs(this.position.x) > wallLimit - this.radius) {
                        this.position.x = Math.sign(this.position.x) * (wallLimit - this.radius);
                        this.velocity.x *= -CONFIG.WALL_BOUNCE_DAMPING;
                        this.createWallImpactParticles();
                        
                        // Add wall flash effect
                        const wallFlash = new THREE.PointLight(0x00ffff, 2, 5);
                        wallFlash.position.set(this.position.x, this.position.y, 2);
                        scene.add(wallFlash);
                        
                        // Fade out wall flash
                        const fadeInterval = setInterval(() => {
                            wallFlash.intensity -= 0.1;
                            if (wallFlash.intensity <= 0) {
                                scene.remove(wallFlash);
                                clearInterval(fadeInterval);
                            }
                        }, 50);
                    }
                    
                    // Check ceiling
                    if (this.position.y > 7 - this.radius) {
                        this.position.y = 7 - this.radius;
                        this.velocity.y = 0;
                        this.isMoving = false;
                    }
                }
                
                // Floating animation
                if (!this.isMoving) {
                    const floatY = Math.sin(Date.now() * 0.001 * this.floatSpeed + this.floatOffset) * 0.05;
                    this.mesh.position.y = this.position.y + floatY;
                }
                
                // Rotation
                this.mesh.rotation.x += this.rotationSpeed;
                this.mesh.rotation.y += this.rotationSpeed * 0.7;
                
                // Connection bounce animation
                if (this.connectionAnimating) {
                    this.connectionScale = 1.0 + Math.sin(Date.now() * 0.01) * 0.1 * this.connectionAnimating;
                    this.mesh.scale.setScalar(this.connectionScale);
                    this.connectionAnimating *= 0.95; // Decay
                    if (this.connectionAnimating < 0.01) {
                        this.connectionAnimating = false;
                        this.mesh.scale.setScalar(1.0);
                    }
                }
                
                // Update rim glow
                if (this.glowMesh) {
                    this.glowMesh.rotation.x = -this.mesh.rotation.x;
                    this.glowMesh.rotation.y = -this.mesh.rotation.y;
                }
                
                // Update power-up animation if present
                if (this.powerUpAnimation) {
                    this.powerUpAnimation.update(deltaTime);
                }
            }
            
            createWallImpactParticles() {
                for (let i = 0; i < 10; i++) {
                    const particle = new Particle(

                        this.color,
                        0.1
                    );
                    gameState.particles.push(particle);
                }
            }
            
            destroy() {
                scene.remove(this.mesh);
                this.material.dispose();
                this.mesh.geometry.dispose();
            }
        }

            constructor(x, y, z, color, size) {
                this.position = new THREE.Vector3(x, y, z);
                this.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 5
                );
                this.life = 1.0;
                this.decay = 0.02;
                
                const geometry = new THREE.SphereGeometry(size, 8, 8);
                const material = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 1.0,
                    emissive: color,
                    emissiveIntensity: 2
                });
                
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.copy(this.position);
                scene.add(this.mesh);
            }
            
            update(deltaTime) {
                this.velocity.y -= 9.8 * deltaTime; // Gravity
                this.position.add(this.velocity.clone().multiplyScalar(deltaTime));
                this.mesh.position.copy(this.position);
                
                this.life -= this.decay;
                this.mesh.material.opacity = this.life;
                this.mesh.scale.setScalar(this.life);
                
                return this.life > 0;
            }
            
            destroy() {
                scene.remove(this.mesh);
                this.mesh.geometry.dispose();
                this.mesh.material.dispose();
            }
        }
        
        // Starfield System
        class StarfieldLayer {
            constructor(count, size, speed, depth, color = 0xffffff) {
                this.speed = speed;
                this.time = 0;
                
                // Create geometry
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);
                const sizes = new Float32Array(count);
                const twinklePhases = new Float32Array(count);
                
                // Color variations
                const colorVariations = [
                    new THREE.Color(0xffffff), // White
                    new THREE.Color(0xffffff), // White (more common)
                    new THREE.Color(0xaaccff), // Blue
                    new THREE.Color(0xffccaa), // Orange
                    new THREE.Color(0xffaaaa)  // Red
                ];
                
                for (let i = 0; i < count; i++) {
                    // Position
                    positions[i * 3] = (Math.random() - 0.5) * 50;
                    positions[i * 3 + 1] = (Math.random() - 0.5) * 40;
                    positions[i * 3 + 2] = -depth - Math.random() * 10;
                    
                    // Color
                    const starColor = colorVariations[Math.floor(Math.random() * colorVariations.length)];
                    colors[i * 3] = starColor.r;
                    colors[i * 3 + 1] = starColor.g;
                    colors[i * 3 + 2] = starColor.b;
                    
                    // Size
                    sizes[i] = size * (0.5 + Math.random() * 1.5);
                    
                    // Twinkle phase
                    twinklePhases[i] = Math.random() * Math.PI * 2;
                }
                
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
                
                // Store attributes for animation
                this.positions = positions;
                this.sizes = sizes;
                this.baseSizes = new Float32Array(sizes);
                this.twinklePhases = twinklePhases;
                
                // Create material with vertex colors
                const material = new THREE.PointsMaterial({
                    size: 1,
                    sizeAttenuation: true,
                    transparent: true,
                    opacity: 0.9,
                    vertexColors: true,
                    blending: THREE.AdditiveBlending,
                    map: this.createStarTexture()
                });
                
                this.points = new THREE.Points(geometry, material);
                scene.add(this.points);
            }
            
            createStarTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 32;
                canvas.height = 32;
                const ctx = canvas.getContext('2d');
                
                // Create gradient
                const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
                gradient.addColorStop(0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
                gradient.addColorStop(0.4, 'rgba(255,255,255,0.3)');
                gradient.addColorStop(1, 'rgba(255,255,255,0)');
                
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 32, 32);
                
                const texture = new THREE.CanvasTexture(canvas);
                return texture;
            }
            
            update(deltaTime, mouseX, mouseY) {
                this.time += deltaTime;
                
                // Parallax movement based on mouse
                const parallaxX = mouseX * this.speed * 0.1;
                const parallaxY = mouseY * this.speed * 0.1;
                
                // Update positions for parallax
                for (let i = 0; i < this.positions.length / 3; i++) {
                    // Gentle drift
                    this.positions[i * 3] += Math.sin(this.time * 0.1 + i) * this.speed * deltaTime * 0.1;
                    this.positions[i * 3 + 1] += Math.cos(this.time * 0.1 + i) * this.speed * deltaTime * 0.05;
                    
                    // Wrap around edges
                    if (this.positions[i * 3] > 25) this.positions[i * 3] = -25;
                    if (this.positions[i * 3] < -25) this.positions[i * 3] = 25;
                    if (this.positions[i * 3 + 1] > 20) this.positions[i * 3 + 1] = -20;
                    if (this.positions[i * 3 + 1] < -20) this.positions[i * 3 + 1] = 20;
                    
                    // Twinkle effect
                    const twinkle = Math.sin(this.time * 3 + this.twinklePhases[i]) * 0.3 + 0.7;
                    this.sizes[i] = this.baseSizes[i] * twinkle;
                }
                
                // Apply parallax to entire layer
                this.points.position.x = parallaxX;
                this.points.position.y = parallaxY;
                
                // Update buffers
                this.points.geometry.attributes.position.needsUpdate = true;
                this.points.geometry.attributes.size.needsUpdate = true;
            }
        }
        
        // Game Board Setup

        // Shooting mechanics
        function shootBubble(power) {
            if (!gameState.currentBubble || gameState.currentBubble.isMoving || gameState.isGameOver) return;
            
            // Prevent shooting while lightning selector is active
            if (gameState.lightningSelecting) return;
            
            // Prevent shooting backwards or below a certain angle
            const direction = new THREE.Vector3(
                gameState.mousePosition.x - gameState.currentBubble.position.x,
                gameState.mousePosition.y - gameState.currentBubble.position.y,
                0
            );
            
            // Minimum upward angle requirement
            if (direction.y < 0.3) return; // Don't allow shooting too low
            
            direction.normalize();
            
            const speed = CONFIG.SHOOTING_SPEED + (CONFIG.MAX_SHOOTING_SPEED - CONFIG.SHOOTING_SPEED) * power;
            gameState.currentBubble.velocity = direction.multiplyScalar(speed);
            gameState.currentBubble.isMoving = true;
            
            // Create shooting trail
            createShootingTrail(gameState.currentBubble);
            
            // Play shooting sound effect (visual feedback instead)
            createShootingEffect(gameState.currentBubble.position.clone());
        }
        
        // Create shooting effect
        function createShootingEffect(position) {
            for (let i = 0; i < 8; i++) {
                const particle = new Particle(
                    position.x,
                    position.y,
                    position.z,
                    0x00ffff,
                    0.15
                );

                particle.velocity = new THREE.Vector3(

                    Math.sin(angle) * 3,
