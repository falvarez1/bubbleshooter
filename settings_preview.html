<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings UI Preview</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', monospace;
            background: radial-gradient(ellipse at bottom, #001133 0%, #000011 40%, #000000 100%);
            color: #fff;
            min-height: 100vh;
            position: relative;
        }
        
        /* Copy exact styles from the game */
        .settings-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(0, 20, 40, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 255, 255, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }
        
        .settings-icon:hover {
            background: rgba(0, 30, 60, 0.8);
            border-color: rgba(0, 255, 255, 0.5);
            box-shadow: 0 6px 24px rgba(0, 255, 255, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        
        .settings-icon svg {
            width: 24px;
            height: 24px;
            fill: #00ffff;
            filter: drop-shadow(0 0 4px rgba(0, 255, 255, 0.5));
        }
        
        .settings-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 20, 40, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 255, 255, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 2000;
            min-width: 300px;
            display: none;
        }
        
        .settings-panel.active {
            display: block;
            animation: settingsFadeIn 0.3s ease;
        }
        
        @keyframes settingsFadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .settings-title {
            font-size: 24px;
            font-weight: 700;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        
        .settings-close {
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 20px;
            color: #fff;
        }
        
        .settings-close:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }
        
        .settings-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .music-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .music-label {
            font-size: 12px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        
        .toggle-button {
            width: 50px;
            height: 25px;
            background: rgba(0, 255, 255, 0.2);
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 25px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .toggle-button.active {
            background: rgba(0, 255, 255, 0.5);
        }
        
        .toggle-button::after {
            content: '';
            position: absolute;
            width: 21px;
            height: 21px;
            background: #00ffff;
            border-radius: 50%;
            top: 1px;
            left: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
        
        .toggle-button.active::after {
            left: 27px;
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .volume-slider {
            flex: 1;
            height: 6px;
            background: rgba(0, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #00ffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
        
        .volume-value {
            font-size: 12px;
            color: #00ffff;
            min-width: 35px;
            text-align: right;
        }
        
        .game-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1500;
            display: none;
        }
        
        .game-overlay.active {
            display: block;
        }
        
        .pause-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 900;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
            opacity: 0.5;
        }
        
        /* Demo elements */
        .demo-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        
        .demo-info h2 {
            margin-top: 0;
            color: #00ffff;
        }
        
        .demo-info p {
            margin: 10px 0;
            font-size: 14px;
        }
        
        .demo-info button {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: all 0.3s ease;
        }
        
        .demo-info button:hover {
            background: #00dddd;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="demo-info">
        <h2>Settings UI Preview</h2>
        <p>This demonstrates the new settings interface:</p>
        <ul>
            <li>Settings icon (cog) in top-right corner</li>
            <li>Click to open settings panel</li>
            <li>Game pauses with overlay</li>
            <li>Music and volume controls</li>
        </ul>
        <button onclick="toggleSettings()">Toggle Settings</button>
        <button onclick="toggleMusic()">Toggle Music</button>
    </div>
    
    <!-- Settings Icon -->
    <div class="settings-icon" id="settingsIcon" onclick="toggleSettings()">
        <svg viewBox="0 0 24 24">
            <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12A3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5a3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97c0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1c0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66Z"/>
        </svg>
    </div>
    
    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h3 class="settings-title">Settings</h3>
            <div class="settings-close" onclick="toggleSettings()">×</div>
        </div>
        <div class="settings-content">
            <div class="music-toggle">
                <span class="music-label">Music</span>
                <div class="toggle-button active" id="musicToggle" onclick="toggleMusic()"></div>
            </div>
            <div class="volume-control">
                <span class="music-label">Volume</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="30" oninput="updateVolume(this.value)">
                <span class="volume-value" id="volumeValue">30%</span>
            </div>
        </div>
    </div>
    
    <!-- Game Overlay -->
    <div class="game-overlay" id="gameOverlay" onclick="toggleSettings()">
        <div class="pause-text">PAUSED</div>
    </div>
    
    <script>
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            const overlay = document.getElementById('gameOverlay');
            
            if (panel.classList.contains('active')) {
                panel.classList.remove('active');
                overlay.classList.remove('active');
            } else {
                panel.classList.add('active');
                overlay.classList.add('active');
            }
        }
        
        function toggleMusic() {
            const toggle = document.getElementById('musicToggle');
            toggle.classList.toggle('active');
        }
        
        function updateVolume(value) {
            document.getElementById('volumeValue').textContent = value + '%';
        }
    </script>
</body>
</html>
