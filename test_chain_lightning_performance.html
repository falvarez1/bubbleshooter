<!DOCTYPE html>
<html>
<head>
    <title>Chain Lightning Performance Test</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            overflow: hidden;
        }
        
        #performance-monitor {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 1000;
            min-width: 300px;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            padding: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }
        
        .metric-label {
            font-weight: bold;
        }
        
        .metric-value {
            color: #00ff00;
        }
        
        .metric-value.warning {
            color: #ffff00;
        }
        
        .metric-value.danger {
            color: #ff0000;
        }
        
        #controls {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .trigger-btn {
            background: linear-gradient(135deg, #00ddff, #0088ff);
            color: white;
        }
        
        .trigger-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 221, 255, 0.5);
        }
        
        .quality-btn {
            background: #444;
            color: white;
        }
        
        .quality-btn.active {
            background: #00ff00;
            color: black;
        }
        
        #comparison {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            z-index: 1000;
        }
        
        .comparison-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .comparison-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            padding: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }
        
        .old-value {
            color: #ff6666;
        }
        
        .new-value {
            color: #66ff66;
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <div id="performance-monitor">
        <div class="metric">
            <span class="metric-label">FPS:</span>
            <span class="metric-value" id="fps">60</span>
        </div>
        <div class="metric">
            <span class="metric-label">Frame Time:</span>
            <span class="metric-value" id="frame-time">16.67ms</span>
        </div>
        <div class="metric">
            <span class="metric-label">Active Effects:</span>
            <span class="metric-value" id="active-effects">0</span>
        </div>
        <div class="metric">
            <span class="metric-label">Particles:</span>
            <span class="metric-value" id="particles">0</span>
        </div>
        <div class="metric">
            <span class="metric-label">Timers:</span>
            <span class="metric-value" id="timers">0</span>
        </div>
        <div class="metric">
            <span class="metric-label">Draw Calls:</span>
            <span class="metric-value" id="draw-calls">0</span>
        </div>
        <div class="metric">
            <span class="metric-label">Memory (MB):</span>
            <span class="metric-value" id="memory">0</span>
        </div>
        <div class="metric">
            <span class="metric-label">Quality Mode:</span>
            <span class="metric-value" id="quality">high</span>
        </div>
    </div>
    
    <div id="comparison">
        <div class="comparison-header">Performance Comparison</div>
        <div class="comparison-row">
            <span>Implementation:</span>
            <span class="old-value">Old</span>
            <span>→</span>
            <span class="new-value">Optimized</span>
        </div>
        <div class="comparison-row">
            <span>Particles:</span>
            <span class="old-value">400+</span>
            <span>→</span>
            <span class="new-value" id="comp-particles">~50</span>
        </div>
        <div class="comparison-row">
            <span>Timers:</span>
            <span class="old-value">100+</span>
            <span>→</span>
            <span class="new-value">1</span>
        </div>
        <div class="comparison-row">
            <span>Objects:</span>
            <span class="old-value">50+</span>
            <span>→</span>
            <span class="new-value">10 pooled</span>
        </div>
        <div class="comparison-row">
            <span>Lights:</span>
            <span class="old-value">20+</span>
            <span>→</span>
            <span class="new-value">2</span>
        </div>
        <div class="comparison-row">
            <span>Avg FPS:</span>
            <span class="old-value" id="old-fps">~15</span>
            <span>→</span>
            <span class="new-value" id="new-fps">~60</span>
        </div>
    </div>
    
    <div id="controls">
        <button class="trigger-btn" onclick="triggerChainLightning()">
            ⚡ Trigger Chain Lightning
        </button>
        <button class="trigger-btn" onclick="triggerMultiple()">
            ⚡⚡ Trigger Multiple (Stress Test)
        </button>
        <button class="quality-btn active" id="quality-high" onclick="setQuality('high')">
            High Quality
        </button>
        <button class="quality-btn" id="quality-medium" onclick="setQuality('medium')">
            Medium Quality
        </button>
        <button class="quality-btn" id="quality-low" onclick="setQuality('low')">
            Low Quality
        </button>
        <button class="quality-btn" onclick="toggleOldImplementation()">
            Toggle Old/New
        </button>
    </div>
    
    <script type="module">
        import * as THREE from 'three';
        import { CONFIG } from './src/core/Config.js';
        import { OptimizedChainLightningPowerUp } from './src/powerups/OptimizedChainLightningPowerUp.js';
        import { getChainLightningAnimationManager } from './src/graphics/ChainLightningAnimationManager.js';
        
        // Performance monitoring
        let stats = {
            fps: 60,
            frameTime: 16.67,
            activeEffects: 0,
            particles: 0,
            timers: 0,
            drawCalls: 0,
            memory: 0
        };
        
        let lastTime = performance.now();
        let frames = 0;
        let useOldImplementation = false;
        
        // Create test scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('game-container').appendChild(renderer.domElement);
        
        // Setup scene
        scene.background = new THREE.Color(0x0a0a0a);
        camera.position.z = 15;
        
        // Add lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);
        
        // Create test bubbles
        const bubbles = [];
        const bubbleGeometry = new THREE.SphereGeometry(0.5, 16, 16);
        
        for (let y = 0; y < 6; y++) {
            for (let x = 0; x < 8; x++) {
                const material = new THREE.MeshPhongMaterial({
                    color: CONFIG.BUBBLE_COLORS[Math.floor(Math.random() * CONFIG.BUBBLE_COLORS.length)],
                    emissive: 0x000000,
                    emissiveIntensity: 0
                });
                
                const bubble = new THREE.Mesh(bubbleGeometry, material);
                bubble.position.x = (x - 3.5) * 1.2;
                bubble.position.y = (y - 2.5) * 1.2;
                bubble.position.z = 0;
                
                bubble.userData = {
                    id: `bubble_${x}_${y}`,
                    gridX: x,
                    gridY: y,
                    position: bubble.position.clone()
                };
                
                scene.add(bubble);
                bubbles.push(bubble);
            }
        }
        
        // Initialize Chain Lightning system
        const chainLightning = new OptimizedChainLightningPowerUp();
        const animationManager = getChainLightningAnimationManager();
        
        // Mock game state
        const gameState = {
            particlePool: {
                spawn: (x, y, z, color, size, velocity) => {
                    stats.particles++;
                    return { decay: 0.1 };
                }
            },
            animations: [],
            addAnimation: (anim) => gameState.animations.push(anim),
            getBubbleAt: (x, y) => bubbles.find(b => b.userData.gridX === x && b.userData.gridY === y)
        };
        
        // Mock game manager
        const gameManager = {
            scene: scene,
            eventBus: {
                emit: (event, data) => console.log(`Event: ${event}`, data)
            },
            soundManager: null,
            addScreenShake: (intensity, duration) => {
                console.log(`Screen shake: ${intensity} for ${duration}ms`);
            }
        };
        
        window.game = {
            scene: scene,
            particlePool: gameState.particlePool,
            chainLightningVisuals: chainLightning.visualsSystem,
            renderer: renderer
        };
        
        // Trigger chain lightning
        window.triggerChainLightning = function() {
            stats.particles = 0;
            stats.timers = 0;
            
            const centerBubble = bubbles[Math.floor(bubbles.length / 2)];
            
            // Find targets
            const primaryTargets = bubbles.slice(0, 3).map(b => ({
                ...b.userData,
                position: b.position
            }));
            
            const secondaryTargets = bubbles.slice(3, 9).map(b => ({
                ...b.userData,
                position: b.position,
                from: primaryTargets[0].position
            }));
            
            if (useOldImplementation) {
                console.log('Using old implementation (simulated)');
                // Simulate old implementation performance impact
                stats.particles = 400;
                stats.timers = 100;
                setTimeout(() => {
                    stats.particles = 0;
                    stats.timers = 0;
                }, 1000);
            } else {
                // Use new optimized implementation
                chainLightning.activate(centerBubble.position, gameState, gameManager);
            }
        };
        
        // Trigger multiple for stress test
        window.triggerMultiple = function() {
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    window.triggerChainLightning();
                }, i * 200);
            }
        };
        
        // Set quality
        window.setQuality = function(quality) {
            CONFIG.CHAIN_LIGHTNING.PERFORMANCE_MODE = quality;
            
            if (chainLightning.visualsSystem) {
                chainLightning.visualsSystem.setQuality(quality);
            }
            
            // Update UI
            document.querySelectorAll('.quality-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`quality-${quality}`).classList.add('active');
            document.getElementById('quality').textContent = quality;
            
            // Update comparison based on quality
            const settings = CONFIG.CHAIN_LIGHTNING[`${quality.toUpperCase()}_QUALITY`];
            document.getElementById('comp-particles').textContent = `~${settings.MAX_PARTICLES}`;
        };
        
        // Toggle old/new implementation
        window.toggleOldImplementation = function() {
            useOldImplementation = !useOldImplementation;
            console.log(`Using ${useOldImplementation ? 'OLD' : 'NEW'} implementation`);
        };
        
        // Update performance monitor
        function updateMonitor() {
            const now = performance.now();
            const delta = now - lastTime;
            lastTime = now;
            
            frames++;
            if (frames >= 30) {
                stats.fps = Math.round(1000 / delta);
                frames = 0;
            }
            
            stats.frameTime = delta.toFixed(2);
            
            // Update active effects
            if (animationManager) {
                const animStats = animationManager.getStats();
                stats.activeEffects = animStats.activeEffects;
            }
            
            // Update draw calls (approximate)
            stats.drawCalls = renderer.info.render.calls;
            
            // Update memory if available
            if (performance.memory) {
                stats.memory = (performance.memory.usedJSHeapSize / 1048576).toFixed(1);
            }
            
            // Update UI
            document.getElementById('fps').textContent = stats.fps;
            document.getElementById('frame-time').textContent = stats.frameTime + 'ms';
            document.getElementById('active-effects').textContent = stats.activeEffects;
            document.getElementById('particles').textContent = stats.particles;
            document.getElementById('timers').textContent = stats.timers;
            document.getElementById('draw-calls').textContent = stats.drawCalls;
            document.getElementById('memory').textContent = stats.memory;
            
            // Color code based on performance
            const fpsElement = document.getElementById('fps');
            const frameTimeElement = document.getElementById('frame-time');
            
            if (stats.fps < 30) {
                fpsElement.className = 'metric-value danger';
            } else if (stats.fps < 50) {
                fpsElement.className = 'metric-value warning';
            } else {
                fpsElement.className = 'metric-value';
            }
            
            if (stats.frameTime > 33) {
                frameTimeElement.className = 'metric-value danger';
            } else if (stats.frameTime > 20) {
                frameTimeElement.className = 'metric-value warning';
            } else {
                frameTimeElement.className = 'metric-value';
            }
            
            // Update comparison
            document.getElementById('new-fps').textContent = `~${stats.fps}`;
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            const deltaTime = 0.016; // 60 FPS target
            
            // Update chain lightning animations
            if (animationManager) {
                animationManager.update(deltaTime);
            }
            
            // Update visual system
            if (chainLightning.visualsSystem) {
                chainLightning.visualsSystem.update(deltaTime);
            }
            
            // Update monitor
            updateMonitor();
            
            // Render
            renderer.render(scene, camera);
        }
        
        // Start animation
        animate();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log('Chain Lightning Performance Test Ready!');
        console.log('Click "Trigger Chain Lightning" to test the optimized implementation');
        console.log('Use quality buttons to test different performance modes');
    </script>
</body>
</html>
