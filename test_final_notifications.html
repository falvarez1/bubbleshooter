<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Final Notification System</title>
    <link rel="stylesheet" href="css/notifications.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }
        
        .game-area {
            position: relative;
            width: 80%;
            height: 400px;
            margin: 50px auto;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .game-area::before {
            content: "GAME BOARD AREA";
            font-size: 24px;
            color: rgba(255, 255, 255, 0.3);
        }
        
        .test-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            z-index: 3000;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        button {
            display: block;
            margin: 10px 0;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button.danger {
            background: #f44336;
        }
        
        button.danger:hover {
            background: #da190b;
        }
        
        h3 {
            margin-top: 0;
            color: #FFD700;
        }
        
        .test-section {
            margin: 20px 0;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        h4 {
            color: #00d4ff;
            margin: 10px 0;
        }
        
        .status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            z-index: 3000;
        }
        
        .paused {
            color: #ff6b6b;
            font-weight: bold;
        }
        
        .running {
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="game-area" id="gameArea">
        <!-- Simulated game board area -->
    </div>
    
    <div class="status">
        <div>Game Status: <span id="gameStatus" class="running">RUNNING</span></div>
        <div>Blocking Notifications: <span id="blockingCount">0</span></div>
    </div>
    
    <div class="test-controls">
        <h3>Notification System Test</h3>
        
        <div class="test-section">
            <h4>1. Transparent Score Tests</h4>
            <button onclick="testScoreNotifications()">Test Score Visibility</button>
            <button onclick="testEdgeScores()">Test Edge Scores</button>
            <button onclick="testMultipleScores()">Multiple Simultaneous Scores</button>
        </div>
        
        <div class="test-section">
            <h4>2. Blocking Notification Tests</h4>
            <button onclick="testZenMoment()">Test Zen Moment (Should Pause)</button>
            <button onclick="testLevelUp()">Test Level Up (Should Pause)</button>
            <button onclick="testVictory()">Test Victory (Should Pause)</button>
            <button onclick="testMultipleBlocking()">Multiple Blocking Events</button>
        </div>
        
        <div class="test-section">
            <h4>3. Mixed Tests</h4>
            <button onclick="testMixed()">Score + Zen Moment</button>
            <button onclick="testChaos()">Chaos Test (All Types)</button>
        </div>
        
        <div class="test-section">
            <h4>4. Controls</h4>
            <button onclick="clearAll()" class="danger">Clear All</button>
            <button onclick="resetTest()">Reset Test</button>
        </div>
    </div>

    <script type="module">
        import { NotificationManager } from './src/ui/NotificationManager.js';
        import { EventBus } from './src/core/EventBus.js';
        
        // Create event bus and notification manager
        const eventBus = new EventBus();
        const notificationManager = new NotificationManager(eventBus);
        
        // Make them global for testing
        window.notificationManager = notificationManager;
        window.eventBus = eventBus;
        
        // Track game state
        let isPaused = false;
        
        // Listen for pause/resume events
        eventBus.on('pauseAll', (data) => {
            isPaused = true;
            document.getElementById('gameStatus').textContent = 'PAUSED';
            document.getElementById('gameStatus').className = 'paused';
            document.getElementById('blockingCount').textContent = notificationManager.blockingNotificationCount;
            console.log('Game paused:', data);
        });
        
        eventBus.on('resumeAll', (data) => {
            isPaused = false;
            document.getElementById('gameStatus').textContent = 'RUNNING';
            document.getElementById('gameStatus').className = 'running';
            document.getElementById('blockingCount').textContent = notificationManager.blockingNotificationCount;
            console.log('Game resumed:', data);
        });
        
        // Test functions
        window.testScoreNotifications = function() {
            // Simulate scores at different positions
            const positions = [
                { x: window.innerWidth * 0.5, y: window.innerHeight * 0.4 },
                { x: window.innerWidth * 0.3, y: window.innerHeight * 0.5 },
                { x: window.innerWidth * 0.7, y: window.innerHeight * 0.5 }
            ];
            
            positions.forEach((pos, i) => {
                setTimeout(() => {
                    notificationManager.show({
                        text: '+' + (100 * (i + 1)),
                        type: 'score',
                        className: 'floating-score',
                        priority: 1,
                        duration: 1500,
                        position: pos
                    });
                }, i * 200);
            });
        };
        
        window.testEdgeScores = function() {
            // Test scores near screen edges - should be clamped
            const edgePositions = [
                { x: 10, y: 100 },  // Left edge
                { x: window.innerWidth - 10, y: 100 },  // Right edge
                { x: window.innerWidth / 2, y: 10 },  // Top edge
                { x: window.innerWidth / 2, y: window.innerHeight - 10 }  // Bottom edge
            ];
            
            edgePositions.forEach((pos, i) => {
                setTimeout(() => {
                    notificationManager.show({
                        text: '+EDGE',
                        type: 'score',
                        className: 'floating-score',
                        priority: 1,
                        duration: 2000,
                        position: pos
                    });
                }, i * 300);
            });
        };
        
        window.testMultipleScores = function() {
            // Simulate rapid bubble popping
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    notificationManager.show({
                        text: '+' + (50 + Math.floor(Math.random() * 200)),
                        type: 'score',
                        className: 'floating-score',
                        priority: 1,
                        duration: 1500,
                        position: {
                            x: 200 + Math.random() * (window.innerWidth - 400),
                            y: 200 + Math.random() * (window.innerHeight - 400)
                        }
                    });
                }, i * 100);
            }
        };
        
        window.testZenMoment = function() {
            notificationManager.show({
                text: '✨ ZEN MOMENT ✨\nTake a breather - No timer for 30 seconds!',
                type: 'zenMoment',
                className: 'zen-moment-notification',
                priority: 4,
                duration: 3000,
                immediate: true
            });
        };
        
        window.testLevelUp = function() {
            notificationManager.show({
                text: 'LEVEL UP!\nLevel 5',
                type: 'levelUp',
                className: 'level-up-notification',
                priority: 4,
                duration: 2500,
                immediate: true
            });
        };
        
        window.testVictory = function() {
            notificationManager.show({
                text: 'VICTORY!\nAll Clear!',
                type: 'victory',
                className: 'victory-notification',
                priority: 4,
                duration: 3000,
                immediate: true
            });
        };
        
        window.testMultipleBlocking = function() {
            // Test multiple blocking notifications in sequence
            testZenMoment();
            setTimeout(() => testLevelUp(), 1500);
            setTimeout(() => testVictory(), 3000);
        };
        
        window.testMixed = function() {
            // Scores followed by zen moment
            testScoreNotifications();
            setTimeout(() => testZenMoment(), 800);
        };
        
        window.testChaos = function() {
            // Everything at once
            testScoreNotifications();
            setTimeout(() => testZenMoment(), 200);
            setTimeout(() => {
                notificationManager.show({
                    text: 'COMBO x5!',
                    type: 'combo',
                    priority: 3,
                    duration: 2000
                });
            }, 400);
            setTimeout(() => {
                notificationManager.show({
                    text: 'RAINBOW BUBBLE!',
                    type: 'rainbow',
                    priority: 2,
                    duration: 2000
                });
            }, 600);
            setTimeout(() => testMultipleScores(), 800);
        };
        
        window.clearAll = function() {
            notificationManager.clearAll();
        };
        
        window.resetTest = function() {
            clearAll();
            isPaused = false;
            document.getElementById('gameStatus').textContent = 'RUNNING';
            document.getElementById('gameStatus').className = 'running';
            document.getElementById('blockingCount').textContent = '0';
        };
        
        // Add visual feedback to game area when paused
        setInterval(() => {
            const gameArea = document.getElementById('gameArea');
            if (isPaused) {
                gameArea.style.opacity = '0.5';
                gameArea.style.filter = 'blur(2px)';
            } else {
                gameArea.style.opacity = '1';
                gameArea.style.filter = 'none';
            }
        }, 100);
        
        console.log('Notification test page ready!');
        console.log('Features to test:');
        console.log('1. Transparent score notifications that don\'t block gameplay');
        console.log('2. Blocking notifications that pause the game with overlay');
        console.log('3. Edge clamping to prevent cut-off');
        console.log('4. Proper zone management to prevent overlaps');
    </script>
</body>
</html>
